# rava 生成器 workspace（Rust 实现；计划见 docs/plans/2026-09-20-rust-generator-rewrite.md、
# docs/plans/2026-09-29-rust-closure-analyzer.md）
[workspace]
resolver = "2"
members = ["crates/classfile", "crates/resolve", "crates/closure", "crates/driver", "crates/ty", "crates/ir", "crates/input", "crates/cfg", "crates/sim", "crates/instr", "crates/method", "crates/emit"]

[workspace.package]
version = "0.1.0"
edition = "2021"

[workspace.dependencies]
classfile = { path = "crates/classfile" }
resolve = { path = "crates/resolve" }
closure = { path = "crates/closure" }
ty = { path = "crates/ty" }
ir = { path = "crates/ir" }
input = { path = "crates/input" }
cfg = { path = "crates/cfg" }
sim = { path = "crates/sim" }
instr = { path = "crates/instr" }
method = { path = "crates/method" }
emit = { path = "crates/emit" }
zip = { version = "8", default-features = false, features = ["deflate"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
indexmap = "2"
hashbrown = { version = "0.17", default-features = false }
regex = "1"
regex-syntax = "0.8"
crc32fast = "1"
toml = "1"
proc-macro2 = "1"
syn = { version = "2", features = ["full", "visit", "parsing"] }
mimalloc = { version = "0.1", default-features = false }

[profile.release]
debug = 1
lto = "fat"
codegen-units = 1
