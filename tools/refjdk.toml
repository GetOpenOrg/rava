# 语料参考 JDK 固定构建（docs/plans/2026-10-03-reference-jdk-21.md）
#
# 语料（e2e 全集、抽查、作业、expected 生成）在所有机器上用同一个 JDK 构建：
# javac / java / jmods / golden JVM 全部同源，CLDR 等随小版本漂移的数据两侧一致。
# 21.0.11 = 现有 tests/expected 的生成版本（golden 无需重生成）。升级参考 JDK 是一次
# 显式的基线事件：改本文件 + 全量重生成 expected + 双跑闸门，单独立项。
#
# 消费方：scripts/fetch_reference_jdk.sh（取包 / 校验 / 定位，唯一解析实现）；
# scripts/run_tests.py 与语料 shell 脚本经它取 JAVA_HOME。生成器 crate 不读本文件。
# 落位：<JDK 根>/<tag>/（JDK 根缺省为主检出的 tools/refjdk/，RAVA_REFJDK_ROOT 覆盖）。
#
# 格式约束（取包脚本以 awk 解析）：每行一个 key = "value"，平台段名为 [<os>-<arch>]。
# 来源：Adoptium API /v3/assets/release_name/eclipse/<tag>（package.link / package.checksum）。

