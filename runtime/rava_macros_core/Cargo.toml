[package]
name = "rava_macros_core"
version = "0.1.0"
edition = "2021"

# `java_class!` / `java_try!` 的展开与分析逻辑（普通库）：宏 crate `rava_macros` 只做 proc-macro 入口；
# 生成器经 `plan` 特性复用同一份判定（拆层剥体，docs/plans/2026-10-01-rustc-memory-and-crate-split.md §7.5.2）。

[features]
# 生成器侧：回落实现下取记号字节区间
plan = ["proc-macro2/span-locations"]

[dependencies]
syn   = { version = "2", features = ["full", "visit", "visit-mut"] }
quote = "1"
proc-macro2 = "1"

# S5 剥体对照工具（§7.5.2 验收）
[[example]]
name = "decl_check"
required-features = ["plan"]
