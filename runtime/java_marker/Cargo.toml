[package]
name = "java_marker"
version = "0.1.0"
edition = "2021"

# 标记层基础（S7 计划 §9.9 K4）：只承载与签名无关的运行时基础设施——对象引用计数指针
# （obj_ref）与同步模型原语（sync_model），无 Java 行为。行为（区域登记、监视器侧表）
# 经 `unsafe extern "Rust"` 链接期声明转交行为层（java_runtime 侧定义，与 `rava_layer`
# 拆层同一机制），故本 crate 不依赖任何 JDK / 声明层 crate，可置于声明链之下。

[lib]
name = "java_marker"
path = "src/lib.rs"

[dependencies]
# __RefSlot 的 OS 读写锁守卫（sync_model mt 模块）
parking_lot = "0.12"

[lints.rust]
# 手写层的既有形态（内部名 `__` 前缀、测试外未用项等）
dead_code = "allow"
unused_imports = "allow"
non_snake_case = "allow"
non_camel_case_types = "allow"
non_upper_case_globals = "allow"
