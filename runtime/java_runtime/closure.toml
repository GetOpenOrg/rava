# 闭包边界清单：调用链 BFS 在哪里截断（手写边界）、哪里放行（按字节码翻译）。
#
# 读取入口：codegen/runtime_manifest.py（生成器不出现 JDK 类名——原则 4，类名只在本清单）。
# 条目形态：`packages` 为包前缀（必须以 `/` 结尾）；`classes` 为类 binary name（覆盖自身与其
# `$` 嵌套类，不作字符串前缀匹配——`java/security/Permission` 不覆盖 `Permissions`）。
# 加载器校验两种形态不混用。

# ── 内部边界包 ─────────────────────────────────────────────────────────────────────
# BFS 在此截断，类整体手写 / 存根，不展开调用链（docs/reference/handwritten-boundary.md §三 过渡类）。
# 终态：C1d「边界收窄」按包实测后取消前缀截断，本段收窄为逐类的 VM 契约清单
# （docs/plans/2026-09-29-boundary-narrowing.md）。
[boundary]
packages = [
    "sun/",
    "jdk/",
    "com/sun/",
    "com/oracle/",
    # JVM 安全服务层（JDK 21 SecurityManager 恒 null；JDK 24+ JEP 486 移除）。
    "java/security/",
]

# ── VM 耦合边界类 ──────────────────────────────────────────────────────────────────
# 公开包（java/）里由 JVM 自身引导、承载 VM 设施的类。它们在 HotSpot 中由 VM 本地代码直接
# 创建 / 驱动（initPhase1~3、模块系统引导、类加载、安全管理器），在原生二进制里没有字节码层面
# 的对应物。按方法划分：native / VM 内建 / 共置手写体按精确名提供的方法取手写（审计单独计数
# vm_boundary_methods），其余被调用到的方法按字节码翻译——运行时执行的就是其字节码，闭包分析
# （rava closure）同口径建模。不在调用链上的方法保持 panic!("stub: ...")。
#
# 引入动机：类初始化（JVMS §5.5）进入调用链后，<clinit> 的静态可达闭包会沿安全管理器 → 模块层
# 引导 → 虚拟线程调度器一路展开到整个并发 / 模块 / 反射子系统，而这些路径在运行时永不执行。
[vm_boundary]
classes = [
    "java/lang/SecurityManager",
    "java/lang/VirtualThread",
    "java/lang/ClassLoader",
    "java/lang/Module",
    "java/lang/ModuleLayer",
    "java/lang/Class",

    # POSIX 原生族档 A（2026-09-23）：FileSystems.getDefault 的默认持有者链
    # （DefaultFileSystemHolder → $1 → getDefaultProvider → getFileSystem("file:///")）。收录理由 =
    # 策略截断：getDefaultProvider 的系统属性 / ClassLoader 反射链会展开整个反射子系统（约 1000 类，
    # bin −143M，见 d8c431c）。getDefault 以 DefaultFileSystemProvider.theFileSystem() 等价承载
    # （doPrivileged 在无安全管理器时透明，JDK 可观测行为一致），其余成员保持 panic 存根。
    "java/nio/file/FileSystems",

    # 平台名字服务（2026-09-28）：InetAddress 的解析机制——resolver SPI（ServiceLoader 装载
    # InetAddressResolverProvider）、hosts 文件解析器（Scanner）、DNS 缓存与 expirySet
    # （ConcurrentSkipListSet）、Inet*AddressImpl native——在原生二进制中由操作系统解析器承载。
    # 收录理由 = 策略截断：file: URL 实例化后，URL.hashCode / equals 经根类虚方法传播入链，
    # URLStreamHandler.hostsEqual → getHostAddress → InetAddress.getByName 会把整个名字服务栈
    # （约 1.3MB 生成代码）拉进 JCA / NativePRNG 闭包，而该路径运行期永不执行（TestCipherDesModes
    # rustc 峰值内存越过 14G 上限实证）。被调用到的方法按需手写，其余保持 panic 存根。
    "java/net/InetAddress",

    # K-JCA（docs/plans/2026-09-25-jca-service-registry.md）：JCE 管辖策略。JceSecurity.<clinit> 从
    # JDK 安装目录读 conf/security/policy/*.policy 并做 provider jar 签名校验——原生二进制无 JDK
    # 安装目录，且 JDK 9+ 默认策略即 unlimited。整类手写：canUseProvider 恒 true、isRestricted 恒
    # false（Cipher 据此取 CryptoAllPermission，JDK 默认安装的可观测行为一致）。
    "javax/crypto/JceSecurity",

    # MH-native（docs/plans/2026-09-26-mh-native.md）：LambdaForm 运行期字节码生成器。原生二进制
    # 不能定义隐藏类；句柄调用由原生 LambdaForm 解释器承载，编译入口返回解释入口（vm_intrinsics.toml）。
    "java/lang/invoke/InvokerBytecodeGenerator",
]

# ── 边界放行：内部边界前缀下按字节码翻译的纯 Java 类 / 包 ─────────────────────────────
# JCA 服务实现族的放行在 seeds.toml [jca]（与服务种子同一消费面）。
[release]
packages = [
    # FS-R R2a（docs/plans/2026-09-27-reflection-metadata-table.md）：反射访问器族（JDK 21 的
    # Field.get / Method.invoke 经 ReflectionFactory → MethodHandleAccessorFactory → DirectMethodHandle，
    # 与 MH-native 同一管线）。包内 native（Reflection.getCallerClass 等）由共置 _impl.rs 手写；运行期
    # 字节码生成点（generateSerializationConstructor）按 vm_intrinsics.toml 准入（R3）。
    "jdk/internal/reflect/",
    # FS-R R4b：注解解析族（Class/Field/Method.getAnnotation → AnnotationParser 按原始字节解析，
    # 实例经 Proxy.newProxyInstance + AnnotationInvocationHandler）。唯一例外 parseSig 手写：注解签名
    # 恒为描述符形态，结果即描述符 → Class（annotation_parser_impl.rs）——sun/reflect/generics 不放行
    # （其泛型 visitor 体系使 java_runtime 编译峰值内存越过 15G）。
    "sun/reflect/annotation/",
    # 旧日历 API 的历法引擎（GregorianCalendar / Date / TimeZone 的 CalendarSystem、Gregorian、
    # BaseCalendar、ZoneInfo、ZoneInfoFile 等，纯 Java）。ZoneInfoFile 读
    # <java.home>/lib/tzdb.dat → jdk_resources 嵌入数据；TimeZone 的两个 native 见 time_zone_impl.rs。
    "sun/util/calendar/",
    # C1d：浮点十进制转换（DoubleToDecimal / FloatToDecimal / FormattedFPDecimal、dtoa 的 FloatingDecimal /
    # FDBigInteger 等，纯 Java）。手写近似无法逐位一致（DecimalFormat HALF_EVEN 依赖 dtoa 产物），按字节码翻译。
    "jdk/internal/math/",
    # C1d：特权属性读取动作（GetPropertyAction / GetBooleanAction / GetIntegerAction 等，纯 Java，0 个
    # ACC_NATIVE）。安全管理器恒 null，privilegedGetProperty 等按字节码直通 System.getProperty；原手写
    # 属过渡类（策略截断），删除后闭包变小（手写不透明返回的 Character* 过近似消失，计划 §6.6）。
    "sun/security/action/",
    # C1d：模块系统工具（ServicesCatalog / Resources / Checks 等，纯 Java，0 个 ACC_NATIVE）。
    # ServicesCatalog 的 getServicesCatalogOrNull 仍为过渡手写（被 jdk/internal/loader 截断阻塞，见
    # services_catalog_impl.rs），其余按字节码；引导目录按 closure.json 的服务事实装填（__boot_catalog）。
    "jdk/internal/module/",
    # C1d：HotSpot 性能计数器（PerfCounter / Perf 包装，Java 部分纯字节码）。Perf 的 ACC_NATIVE
    # （registerNatives / createLong 等）按需手写于 perf_impl.rs：原生二进制无 jvmstat 共享内存，
    # createLong 返回进程私有的 8 字节缓冲，计数器语义（get/set/add）由字节码经 LongBuffer 承载。
    "jdk/internal/perf/",
    # C1d：安全工具类（SecurityConstants / KnownOIDs / ArrayUtil / 算法约束 / HexDumpEncoder 等，纯 Java，
    # 0 个 ACC_NATIVE）。SecurityConstants.PROVIDER_VER 与 CryptoAlgorithmConstraints.permits 的过渡手写已删；
    # Debug.getInstance / isOn / isVerbose 仍为过渡手写（阻塞在分析器系统属性折叠，见 debug_impl.rs）。
    "sun/security/util/",
]
classes = [
    # MH-native：asType / 组合子的类型转换与名字工具。纯 Java（装拆箱 / 拓宽句柄经 IMPL_LOOKUP
    # 按名查找本类静态方法——常量反射引用扫描入链）。
    "sun/invoke/util/ValueConversions",
    "sun/invoke/util/BytecodeName",
    "sun/invoke/util/VerifyType",

    # file: 协议 URL 处理器（纯 Java 的 URLStreamHandler 子类；URL$DefaultFactory 对 file 协议直接
    # new）。消费方：NativePRNG.getEgdUrl 的 `new URL("file:/dev/random")`（SUN provider 初始化）。
    "sun/net/www/protocol/file/Handler",
    # CLDR 货币名束的基类（纯 Java：getContents 数组 → 惰性 HashMap 查表 + 父链回退；L-2）
    "sun/util/resources/OpenListResourceBundle",
    # URL 解析的纯 Java 工具（主机串校验、延迟解析开关 $MASKS.DELAY_URL_PARSING_SP_VALUE）
    "sun/net/util/IPAddressUtil",
    # URL 规范串工具（纯 Java）：CodeSource.<init> 的 urlNoFragString（去片段的 URL 串，含缺省端口判定）
    "sun/net/util/URLUtil",

    # FS-R：VM 边界类 java/lang/Class 的纯 Java 嵌套辅助类（0 个 ACC_NATIVE）：reflectionData()
    # 缓存、EnclosingMethodInfo（isLocalClass / isAnonymousClass / getEnclosingClass）、Atomic
    # （reflectionData / annotationData 的 CAS）、AnnotationData。
    "java/lang/Class$ReflectionData",
    "java/lang/Class$EnclosingMethodInfo",
    "java/lang/Class$Atomic",
    "java/lang/Class$AnnotationData",
    # Class.newInstance 的特权块（匿名 PrivilegedAction：构造器 setAccessible(true)，纯 Java）。
    # 消费方：CalendarSystem.forName（JulianCalendar 按类名反射实例化）等 Class.newInstance 调用。
    "java/lang/Class$1",

    # FS-H0 安全组：特权执行与访问控制上下文（纯 Java；native 仅栈上上下文 / 保护域 / 栈遍历物化，
    # access_controller_impl.rs）。SecurityManager 恒 null，doPrivileged 直通 action.run()。
    "java/security/AccessController",
    "java/security/AccessControlContext",

    # 权限与保护域（纯 Java）。消费方：ForkJoinPool 工作线程 ACC（contextWithPermissions）、
    # ThreadPerTaskExecutor.<clinit>、JCA CryptoPermission。
    "java/security/Permission",
    "java/security/PermissionCollection",
    "java/security/Permissions",
    "java/security/PermissionsHash",
    "java/security/BasicPermission",
    "java/security/BasicPermissionCollection",
    "java/security/ProtectionDomain",
    # gap 7e：权限枚举 / 代码来源 / 特权异常（纯 Java）。Permissions.elements 的 PermissionsEnumerator、
    # ProtectionDomain 与 SecureClassLoader 的 CodeSource、doPrivileged(PrivilegedExceptionAction) 包装受检
    # 异常的 PrivilegedActionException、AllPermission / SecurityPermission。
    "java/security/PermissionsEnumerator",
    "java/security/CodeSource",
    "java/security/PrivilegedActionException",
    "java/security/AllPermission",
    "java/security/SecurityPermission",

    # gap 批次 4：随机数流（纯 Java；含嵌套 $AbstractSpliteratorGenerator / $Random*Spliterator /
    # $AbstractSplittableGenerator 等）。Random / SplittableRandom 的 ints / longs / doubles 流、
    # 有界随机数核心（boundedNextInt 等）、mix 函数。唯一手写例外 initialSeed：其 secureRandomSeed
    # 分支经 SecureRandom.getSeed 拉入整条 JCA 链（random_support_impl.rs）。
    "jdk/internal/util/random/RandomSupport",

    # 平台枚举（纯 Java；initOS 取 JDK 构建期常量 "linux"）。消费方：ProcessImpl.<clinit> 的 OS 字段
    # （initStreams / 启动模式按平台分支）。边界截断下 <clinit> 不发射，CURRENT_OS 恒 null → NPE。
    "jdk/internal/util/OperatingSystem",
    # 旧式 Cleaner（PhantomReference 子类，纯 Java：静态双链表登记 + clean() 执行 thunk）。消费方：
    # DirectByteBuffer 的内存释放登记（Cleaner.create(this, new Deallocator(..))）。原生二进制无 GC，
    # 与 JDK 在引用不入队时同形：只在显式 clean() 时执行。
    "jdk/internal/ref/Cleaner",

    # gap 批次 4：BCP 47 语言标签与区域匹配（纯 Java）。Locale.forLanguageTag / toLanguageTag /
    # Builder / 扩展（u- / x-）/ LanguageRange / lookup / filter，以及 Locale 实例缓存
    # （Locale$Cache 的基类 LocaleObjectCache）。BaseLocale 仍手写（常量表下标随 JDK 版本变化）。
    "sun/util/locale/LanguageTag",
    "sun/util/locale/InternalLocaleBuilder",
    "sun/util/locale/LocaleExtensions",
    "sun/util/locale/Extension",
    "sun/util/locale/UnicodeLocaleExtension",
    "sun/util/locale/LocaleSyntaxException",
    "sun/util/locale/ParseStatus",
    "sun/util/locale/StringTokenIterator",
    "sun/util/locale/LocaleMatcher",
    "sun/util/locale/LocaleEquivalentMaps",
    "sun/util/locale/LocaleObjectCache",
    "sun/util/locale/LocaleUtils",
]

# ── 动态对照：JVM 直接调用的 Java 入口 ────────────────────────────────────────────────
# 只供 scripts/dyn_compare.py（C5：真实 JVM 类加载轨迹 vs 静态闭包，只用于验证）读取；闭包分析器与
# 生成器不读本段，它不影响闭包。
#
# 动态对照按类加载时的调用栈归因：自入口帧起逐帧上溯，全部是闭包内按字节码建模的方法时，
# 加载的翻译域类若不在闭包即为漏覆盖；途经手写 / native / 边界域方法则归因于该帧。本段列出的
# 类，其方法由 JVM 在链接期直接调用（不经任何字节码调用点）：invokedynamic 调用点链接、
# 动态常量 / MethodType / MethodHandle 常量解析。rava 以运行模型替换这条链接路径（vm_intrinsics.toml
# [indy]、MH-native），这些帧之上的加载归因为「VM 上调」，不计漏覆盖。
# 条目形态同 [vm_boundary]：类 binary name，覆盖自身与其 `$` 嵌套类。
[dynamic]
vm_upcall_classes = [
    "java/lang/invoke/MethodHandleNatives",
]
