# 闭包边界清单：调用链 BFS 在哪里截断（手写边界）。
#
# 读取入口：codegen/runtime_manifest.py 与 generator/crates/{closure,input}/src/manifest.rs（生成器 /
# 分析器不出现 JDK 类名——原则 4，类名只在本清单）。
# 条目形态：`classes` 为类 binary name（覆盖自身与其 `$` 嵌套类，不作字符串前缀匹配——
# `java/security/Permission` 不覆盖 `Permissions`）。
#
# C1d 终态（2026-09-30，docs/plans/2026-09-29-boundary-narrowing.md §6.8）：包前缀截断（原 [boundary]
# 的 sun/ jdk/ com/sun/ com/oracle/ java/security/）与放行清单（原 [release]）已取消——JDK 全部类
# 按字节码翻译，截断只剩下方逐类的 VM 契约清单（docs/reference/handwritten-boundary.md 准入 ②③）。

# ── VM 耦合边界类 ──────────────────────────────────────────────────────────────────
# 公开包（java/）里由 JVM 自身引导、承载 VM 设施的类。它们在 HotSpot 中由 VM 本地代码直接
# 创建 / 驱动（initPhase1~3、模块系统引导、类加载、安全管理器），在原生二进制里没有字节码层面
# 的对应物。按方法划分：native / VM 内建 / 共置手写体按精确名提供的方法取手写（审计单独计数
# vm_boundary_methods），其余被调用到的方法按字节码翻译——运行时执行的就是其字节码，闭包分析
# （rava closure）同口径建模。不在调用链上的方法保持 panic!("stub: ...")。
#
# 引入动机：类初始化（JVMS §5.5）进入调用链后，<clinit> 的静态可达闭包会沿安全管理器 → 模块层
# 引导 → 虚拟线程调度器一路展开到整个并发 / 模块 / 反射子系统，而这些路径在运行时永不执行。
[vm_boundary]
classes = [
    "java/lang/SecurityManager",
    "java/lang/VirtualThread",
    "java/lang/ClassLoader",
    "java/lang/Module",
    "java/lang/ModuleLayer",
    "java/lang/Class",

    # POSIX 原生族档 A（2026-09-23）：FileSystems.getDefault 的默认持有者链
    # （DefaultFileSystemHolder → $1 → getDefaultProvider → getFileSystem("file:///")）。收录理由 =
    # 策略截断：getDefaultProvider 的系统属性 / ClassLoader 反射链会展开整个反射子系统（约 1000 类，
    # bin −143M，见 d8c431c）。getDefault 以 DefaultFileSystemProvider.theFileSystem() 等价承载
    # （doPrivileged 在无安全管理器时透明，JDK 可观测行为一致），其余成员保持 panic 存根。
    "java/nio/file/FileSystems",

    # 平台名字服务（2026-09-28）：InetAddress 的解析机制——resolver SPI（ServiceLoader 装载
    # InetAddressResolverProvider）、hosts 文件解析器（Scanner）、DNS 缓存与 expirySet
    # （ConcurrentSkipListSet）、Inet*AddressImpl native——在原生二进制中由操作系统解析器承载。
    # 收录理由 = 策略截断：file: URL 实例化后，URL.hashCode / equals 经根类虚方法传播入链，
    # URLStreamHandler.hostsEqual → getHostAddress → InetAddress.getByName 会把整个名字服务栈
    # （约 1.3MB 生成代码）拉进 JCA / NativePRNG 闭包，而该路径运行期永不执行（TestCipherDesModes
    # rustc 峰值内存越过 14G 上限实证）。被调用到的方法按需手写，其余保持 panic 存根。
    "java/net/InetAddress",

    # K-JCA（docs/plans/2026-09-25-jca-service-registry.md）：JCE 管辖策略。JceSecurity.<clinit> 从
    # JDK 安装目录读 conf/security/policy/*.policy 并做 provider jar 签名校验——原生二进制无 JDK
    # 安装目录，且 JDK 9+ 默认策略即 unlimited。整类手写：canUseProvider 恒 true、isRestricted 恒
    # false（Cipher 据此取 CryptoAllPermission，JDK 默认安装的可观测行为一致）。
    "javax/crypto/JceSecurity",

    # MH-native（docs/plans/2026-09-26-mh-native.md）：LambdaForm 运行期字节码生成器。原生二进制
    # 不能定义隐藏类；句柄调用由原生 LambdaForm 解释器承载，编译入口返回解释入口（vm_intrinsics.toml）。
    "java/lang/invoke/InvokerBytecodeGenerator",

    # ── C1d 终态：内部包的 VM 契约类（准入 ③ VM 注入状态 / VM 驱动行为，② 类加载模型）──────────────
    # Unsafe：堆 / 直接内存访问原语（字段偏移 ↔ 字段身份、数组基址 / 比例、CAS、park）。native 之外
    # 的包装（getInt(Object,long) 等 @IntrinsicCandidate 族）经原生对象模型直接承载（unsafe__impl.rs）。
    "jdk/internal/misc/Unsafe",
    # VM：引导阶段状态（initLevel / isBooted / isModuleSystemInited / isJavaLangInvokeInited）、停机标记、
    # 保存属性——HotSpot 由 initPhase1~3 与 create_vm 写入，原生二进制进入 main 即「引导完成」档位。
    "jdk/internal/misc/VM",
    # 内建类加载器层级（boot / platform / app）与 boot 层服务：原生单二进制无动态类加载与本地库加载。
    "jdk/internal/loader/BootLoader",
    "jdk/internal/loader/ClassLoaders",
]

# VM 边界类的纯 Java 嵌套类：按字节码翻译（其余嵌套类随外层类归入边界）。
# FS-R：java/lang/Class 的 reflectionData() 缓存、EnclosingMethodInfo（isLocalClass / isAnonymousClass /
# getEnclosingClass）、Atomic（reflectionData / annotationData 的 CAS）、AnnotationData；Class$1 为
# Class.newInstance 的特权块（构造器 setAccessible(true)）。
translate_nested = [
    "java/lang/Class$ReflectionData",
    "java/lang/Class$EnclosingMethodInfo",
    "java/lang/Class$Atomic",
    "java/lang/Class$AnnotationData",
    "java/lang/Class$1",
]

# VM 边界类中 `<clinit>` 按字节码翻译的类（逐类精确匹配；其余边界类的 `<clinit>` 不翻译——其静态状态
# 由 VM 建立并由手写层承载，如类加载器层级、调度器）。准入：初始化器只写 VM 之外可复现的缺省值，
# 运行期改写由翻译的字节码完成（handwritten-boundary.md：方法语义以它自己的字节码为准）：
#   VM：lock、directMemory 缺省值；引导期 System.initPhase1 → VM.saveProperties（字节码）按保存属性
#       改写 directMemory / pageAlignDirectMemory / classFileMajorVersion 等
# Unsafe 的数组布局与指针宽度静态字段属 VM 注入常量，见 vm_intrinsics.toml [vm_constants.injected_statics]。
translate_clinit = [
    "jdk/internal/misc/VM",
]

# ── 动态对照：JVM 直接调用的 Java 入口 ────────────────────────────────────────────────
# 只供 scripts/dyn_compare.py（C5：真实 JVM 类加载轨迹 vs 静态闭包，只用于验证）读取；闭包分析器与
# 生成器不读本段，它不影响闭包。
#
# 动态对照按类加载时的调用栈归因：自入口帧起逐帧上溯，全部是闭包内按字节码建模的方法时，
# 加载的翻译域类若不在闭包即为漏覆盖；途经手写 / native / 边界域方法则归因于该帧。本段列出的
# 类，其方法由 JVM 在链接期直接调用（不经任何字节码调用点）：invokedynamic 调用点链接、
# 动态常量 / MethodType / MethodHandle 常量解析。rava 以运行模型替换这条链接路径（vm_intrinsics.toml
# [indy]、MH-native），这些帧之上的加载归因为「VM 上调」，不计漏覆盖。
# 条目形态同 [vm_boundary]：类 binary name，覆盖自身与其 `$` 嵌套类。
[dynamic]
vm_upcall_classes = [
    "java/lang/invoke/MethodHandleNatives",
]
