[facts.handle_interpreters]
# 方法句柄解释器（MH-native，method_handle_ext.rs `interpret`）：手写体按 LambdaForm 执行句柄，实参以 Object 汇入值池。
# LambdaForm 里的 Unsafe 引用读写成员只来自 DirectMethodHandle 的字段访问器
# （DirectMethodHandle.preparedFieldLambdaForm：`UNSAFE.putReference(checkBase(obj), fieldOffset(mh), value)`，
# 静态字段以 staticBase 类镜像为基址；数组元素句柄走 MethodHandleImpl$ArrayAccessor 字节码 / VarHandle，不经 Unsafe 成员；
# jdk.internal.misc.Unsafe 不导出，用户代码取不到它的方法句柄）。分析器在这些方法的手写体调用点上把
# [facts.array_writes] 的 fields 写入成员与 [facts.memory_reads] 的读取成员按「DMH 所指字段」接入：
#   - 不写 / 不读数组元素（不经数组写入臂把值池泛写进值池里的各数组）；
#   - 实例字段限于偏移可经字段句柄 / MemberName 取得的字段（按名查找、字段枚举放开、全部放开）；字节码外写入
#     （手写层写入、VM 状态、边界类）只使字段不折叠，不产生字段句柄，不在此列；
#     反序列化放开的字段不在此列——反序列化经 FieldReflector 自身的 Unsafe 调用点读写，不构造字段方法句柄；
#   - 静态字段与类镜像基址同普通偏移读写（按名打开的静态字段）。
