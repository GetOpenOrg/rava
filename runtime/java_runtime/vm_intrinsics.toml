[facts.array_returns]
# 手写方法返回新分配的引用数组，VM 只写入所列类型的元素（闭包分析，generator `rava closure` 读取）。
# 分析器把返回值建模为该方法的一个数组分配点、元素为所列类型的 open，替代 open(返回类型)——
# `Object[]` 的 open 元素是 open(Object)，会经读取方对全部逃逸对象分派（计划 boundary-narrowing §6.2 G3）。
#   elements  元素可能的类型（binary name / 数组描述符），不分下标
# 准入：JVM 规范 / JDK 源码注释给出的元素构成，与手写实现一致（注明实现位置）。
# EnclosingMethod 属性 → {封闭类, 方法名, 描述符}（class_impl.rs getEnclosingMethod0；Class.java `getEnclosingMethod0` 注释）
"java/lang/Class.getEnclosingMethod0:()[Ljava/lang/Object;" = { elements = ["java/lang/Class", "java/lang/String"] }

[facts.memory_reads]
# 手写方法的返回值按 VM 语义读自形参 src 所指对象（形参序号按描述符，0 起，不含接收者）：
# 数组取其元素，对象取其引用实例字段（偏移只能指向这些位置）。分析器按调用点接入，替代手写返回的
# open(返回类型)——open 结果只能按非抽象接收者分派，容器元素 / 字段读取经此会失去对象敏感
# Unsafe 引用读取（unsafe__impl.rs）；getAndSet / compareAndExchange 返回旧值
"jdk/internal/misc/Unsafe.getReference:(Ljava/lang/Object;J)Ljava/lang/Object;" = { src = 0 }
"jdk/internal/misc/Unsafe.getReferenceVolatile:(Ljava/lang/Object;J)Ljava/lang/Object;" = { src = 0 }
"jdk/internal/misc/Unsafe.getReferenceOpaque:(Ljava/lang/Object;J)Ljava/lang/Object;" = { src = 0 }
"jdk/internal/misc/Unsafe.getReferenceAcquire:(Ljava/lang/Object;J)Ljava/lang/Object;" = { src = 0 }
"jdk/internal/misc/Unsafe.getAndSetReference:(Ljava/lang/Object;JLjava/lang/Object;)Ljava/lang/Object;" = { src = 0 }
"jdk/internal/misc/Unsafe.compareAndExchangeReference:(Ljava/lang/Object;JLjava/lang/Object;Ljava/lang/Object;)Ljava/lang/Object;" = { src = 0 }

# ── invokedynamic 引导方法分类（闭包分析，generator `rava closure` 读取）──────────────────
# 生成器原生承载这些引导方法的链接语义，分析器不展开其 Java 体，按分类建模调用点：
#   lambda  LambdaMetafactory：调用点产出实现 SAM 接口的合成类，SAM 调用分派到实现方法句柄
#   concat  StringConcatFactory：动态实参按 String.valueOf 语义调用 toString
#   native  其余原生承载的引导方法：只沿静态实参里的方法句柄入链
# 未列出的引导方法按普通静态调用分析其 Java 体（安全方向）。
[indy]
lambda = [
    "java/lang/invoke/LambdaMetafactory.metafactory",
    "java/lang/invoke/LambdaMetafactory.altMetafactory",
]
concat = [
    "java/lang/invoke/StringConcatFactory.makeConcatWithConstants",
    "java/lang/invoke/StringConcatFactory.makeConcat",
]
native = [
    "java/lang/runtime/SwitchBootstraps.typeSwitch",
    "java/lang/runtime/ObjectMethods.bootstrap",
]
# native 的细分（Python 生成器读取；Rust 分析器按上方 native 条目建模）：
#   type_switch  模式匹配 switch：静态实参即 case 标签序列（Class / String / 整数常量），
#                生成器据此发射运行时标签判定链（S-17）
type_switch = [
    "java/lang/runtime/SwitchBootstraps.typeSwitch",
]
