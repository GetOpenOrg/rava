# 反射只走 native 访问器（NativeConstructorAccessorImpl / NativeMethodAccessorImpl 手写承载），
# 不经 MethodHandle 访问器——原生二进制不在运行期生成 LambdaForm
"jdk.reflect.useNativeAccessorOnly" = "true"

# 读取入口：实参序号含接收者；receiver = 接收者须为系统属性表对象；default = 缺省值实参；snapshot = 读启动快照（见下）。
# 包装方法（System.getProperty 等）由分析器从字节码识别：返回值恰是入口读取、键来自形参
[facts.system_properties.readers]
"java/util/Properties.getProperty:(Ljava/lang/String;)Ljava/lang/String;" = { receiver = true, key = 1 }
"java/util/Properties.getProperty:(Ljava/lang/String;Ljava/lang/String;)Ljava/lang/String;" = { receiver = true, key = 1, default = 2 }
"sun/security/action/GetPropertyAction.privilegedGetProperty:(Ljava/lang/String;)Ljava/lang/String;" = { key = 0 }
"sun/security/action/GetPropertyAction.privilegedGetProperty:(Ljava/lang/String;Ljava/lang/String;)Ljava/lang/String;" = { key = 0, default = 1 }
# 删除并返回原值：结果即该键的读取（启动时不存在、且从未写入的键为 null）
"java/util/Properties.remove:(Ljava/lang/Object;)Ljava/lang/Object;" = { receiver = true, key = 1 }
# 启动快照（snapshot）：VM.savedProps 是 initPhase1 交给 VM.saveProperties 的初始属性表（此后 JDK 内无写入方：
# getSavedProperties 的调用者 VMSupport / JVMCI 只读），取值与上表同——System.props 之外多出的 VM 私有键
# （sun.nio.MaxDirectMemorySize 等）由 [concrete.boot] vm_props 提供，原生二进制不提供，同为不存在。
# 快照不随运行期 System.setProperty / 属性表对象逃逸变化，读取不查不折叠集合（如
# ThreadLocalRandom.<clinit> 读 java.util.secureRandomSeed：不存在 → null → 不取 SecureRandom 种子）
"jdk/internal/misc/VM.getSavedProperty:(Ljava/lang/String;)Ljava/lang/String;" = { key = 0, snapshot = true }

# 按键改写入口（接收者为系统属性表对象时只改写 key 实参所指的键）。remove = 删除：只可能改变启动时
# 存在的键（values / dynamic），只被删除、从未写入的键仍读作不存在；删除键推不出时按拼接段匹配 values 键，
# 拼接段也推不出则 values 全部不折叠（不波及启动时不存在的键）
[facts.system_properties.writers]
"java/util/Properties.setProperty:(Ljava/lang/String;Ljava/lang/String;)Ljava/lang/Object;" = { key = 1 }
"java/util/Properties.put:(Ljava/lang/Object;Ljava/lang/Object;)Ljava/lang/Object;" = { key = 1 }
"java/util/Properties.remove:(Ljava/lang/Object;)Ljava/lang/Object;" = { key = 1, remove = true }

[facts.field_writes]
# 字段常量折叠的反射式写入来源（计划 C1c 第 1 步）。分析器按「全部写入来源」求字段值集，
# 只有一个常量时把读取折叠掉；以下调用可达时相关字段不折叠。
# 按名写入（objectFieldOffset(Class, "名") / findVarHandle / newUpdater / getDeclaredField("名") / 字段 MemberName 构造）
# 见下方 name_resolvers，不在此列。
# enumerators：返回字段句柄数组。句柄只有经下列 handle_writers 才能写字段：枚举结果带来源标记，标记随句柄
#   沿字节码数据流传到 handle_writers 的句柄实参时，接收者是类字面量则只放开该类及其超类的字段，否则全部
#   字段不折叠；只读句柄（取名字 / 修饰符 / 值，如 ObjectStreamClass.computeDefaultSUID）与按名字常量取到的
#   句柄（已按名放开）不放开被枚举的字段。写入口的句柄实参取不到值 / 含非建模代码产出的句柄、或写入口经
#   非字节码调用点（反射调用、lambda、手写体）到达时按全部枚举放开（engine/field_handles.rs）
enumerators = [
    "java/lang/Class.getDeclaredFields:()[Ljava/lang/reflect/Field;",
    "java/lang/Class.getFields:()[Ljava/lang/reflect/Field;",
]
# handle_writers：按字段句柄写字段的入口（Field.set* 的访问器、Lookup 的 setter / VarHandle、
#   jdk.unsupported 的 Unsafe 偏移取法）。jdk.internal.misc.Unsafe 的 Field 偏移取法不在此列：
#   JDK 内部调用者只有 Field.get* / set* 的访问器（写入仍经 Field.set*）与反序列化的 FieldReflector
#   （由 deserializers 计入）
handle_writers = [
    "java/lang/reflect/Field.set:(Ljava/lang/Object;Ljava/lang/Object;)V",
    "java/lang/reflect/Field.setBoolean:(Ljava/lang/Object;Z)V",
    "java/lang/reflect/Field.setByte:(Ljava/lang/Object;B)V",
    "java/lang/reflect/Field.setChar:(Ljava/lang/Object;C)V",
    "java/lang/reflect/Field.setShort:(Ljava/lang/Object;S)V",
    "java/lang/reflect/Field.setInt:(Ljava/lang/Object;I)V",
    "java/lang/reflect/Field.setLong:(Ljava/lang/Object;J)V",
    "java/lang/reflect/Field.setFloat:(Ljava/lang/Object;F)V",
    "java/lang/reflect/Field.setDouble:(Ljava/lang/Object;D)V",
    "java/lang/invoke/MethodHandles$Lookup.unreflectSetter:(Ljava/lang/reflect/Field;)Ljava/lang/invoke/MethodHandle;",
    "java/lang/invoke/MethodHandles$Lookup.unreflectVarHandle:(Ljava/lang/reflect/Field;)Ljava/lang/invoke/VarHandle;",
    "sun/misc/Unsafe.objectFieldOffset:(Ljava/lang/reflect/Field;)J",
    "sun/misc/Unsafe.staticFieldOffset:(Ljava/lang/reflect/Field;)J",
    "sun/misc/Unsafe.staticFieldBase:(Ljava/lang/reflect/Field;)Ljava/lang/Object;",
]
# handle_bridges：在其内调用 handle_writers 不算写入入口。JavaLangInvokeAccess.unreflectField 的实现，
#   JDK 内唯一调用者是 MethodHandleAccessorFactory.newFieldAccessor：Field.get* / set* 首次取访问器时
#   一并建 setter 句柄（isReadOnly 取决于运行期修饰符，恒可达），句柄只存于 FieldAccessor、
#   只经 Field.set* 调用，写入已由上面的 Field.set* 计入
handle_bridges = [
    "java/lang/invoke/MethodHandleImpl$1.unreflectField:(Ljava/lang/reflect/Field;Z)Ljava/lang/invoke/MethodHandle;",
]
# deserializers：可达即可序列化类（声明类是 serializable_markers 的子类型）的非 static、非 transient 字段不折叠。
#   反序列化按 ObjectStreamClass 只写可序列化类声明的字段；首个不可序列化超类及其以上的字段由其无参构造器初始化（字节码可见）
deserializers = [
    "java/io/ObjectInputStream.readObject:()Ljava/lang/Object;",
    "java/io/ObjectInputStream.readUnshared:()Ljava/lang/Object;",
]
serializable_markers = ["java/io/Serializable"]
# serial_persistent_fields：可序列化类以 private static final 的该字段显式声明序列化字段面时，默认序列化 / 反序列化
#   只按其中的名字绑定本类字段（ObjectStreamClass.getDeclaredSerialFields）；其余字段即使非 static、非 transient
#   也不经偏移读写。名字取自该类 <clinit> 的字符串常量（如 ObjectStreamClass 声明 NO_FIELDS：其 Method 缓存字段
#   不受反序列化写入，直连调用点接收者不混入 open(Method)）
serial_persistent_fields = ["serialPersistentFields:[Ljava/io/ObjectStreamField;"]
# serial_enumerators：只对可序列化类（serializable_markers 的子类型）调用上列 enumerators、只用其非 static、
#   非 transient 字段（默认序列化字段按 static / transient 掩码过滤；computeDefaultSUID 只读名字与修饰符）的调用方。
#   其枚举接收者推不出（类来自流中类名 / 对象的 getClass）时按可序列化字段口径放开（同 deserializers 的字段面），
#   不按全部字段记枚举缺口
serial_enumerators = [
    "java/io/ObjectStreamClass.getDefaultSerialFields:(Ljava/lang/Class;)[Ljava/io/ObjectStreamField;",
    "java/io/ObjectStreamClass.computeDefaultSUID:(Ljava/lang/Class;)J",
]
# instance_field_users：在其内按名 / 枚举取到的字段句柄只用于实例字段（按修饰符滤掉 static）的方法。其取法照常
#   计入字段放开与元数据口径，但不使静态字段可经句柄按名访问（静态字段按名访问表 `__STATICS` 不计）。
#   getDeclaredSerialFields 按 serialPersistentFields 的名字取 Field，只绑定非 static 的同类型字段
instance_field_users = [
    "java/io/ObjectStreamClass.getDeclaredSerialFields:(Ljava/lang/Class;)[Ljava/io/ObjectStreamField;",
]
# static_offset_getters：静态字段基址 / 偏移的全部取法（Field 版与 MemberName 版）。按偏移读的基址若是类镜像，
#   只有这些取法之一可达时才作静态字段基址读所指类的静态字段——否则静态字段偏移无从取得，类镜像基址只读 Class 的实例字段
static_offset_getters = [
    "jdk/internal/misc/Unsafe.staticFieldBase:(Ljava/lang/reflect/Field;)Ljava/lang/Object;",
    "jdk/internal/misc/Unsafe.staticFieldOffset:(Ljava/lang/reflect/Field;)J",
    "sun/misc/Unsafe.staticFieldBase:(Ljava/lang/reflect/Field;)Ljava/lang/Object;",
    "sun/misc/Unsafe.staticFieldOffset:(Ljava/lang/reflect/Field;)J",
    "java/lang/invoke/MethodHandleNatives.staticFieldBase:(Ljava/lang/invoke/MemberName;)Ljava/lang/Object;",
    "java/lang/invoke/MethodHandleNatives.staticFieldOffset:(Ljava/lang/invoke/MemberName;)J",
]
# static_bases：返回字段句柄实参（形参 0，不含接收者）所指静态字段的基址——HotSpot 下是声明类的类镜像
#   （unsafe__impl/access.rs staticFieldBase0 返回 Field.clazz）。分析器按调用点把结果取为句柄值集所指声明类的类镜像
#   （枚举标记按口径类及其超类 / 超接口；推不出的为所指未知的类镜像），不按声明返回类型 open(Object)——
#   否则 UnsafeStaticFieldAccessorImpl.base 为 open，Field.set 的全部值经静态访问器的 putReference 逃逸（c1d §30.17）
static_bases = [
    "jdk/internal/misc/Unsafe.staticFieldBase0:(Ljava/lang/reflect/Field;)Ljava/lang/Object;",
]
# handle_getters / handle_setters：按字段句柄（接收者）读 / 写对象实参（形参 0）的字段，setter 的写入值为形参 1。
#   字节码调用点上接收者是字段枚举标记、且口径类 C 推得出时，分析器按调用点建模（engine/field_access.rs）：
#   读的结果 = 对象实参里 C 的子类型对象在 C（含超类）引用实例字段上的值 ∪ C 及其超类 / 超接口的静态引用字段
#   ∪ 基本类型字段的装箱值（取被调方返回值中该装箱类的值）；写入值落到同一组字段。对象实参与写入值不再流入
#   被调方形参——否则它们经 FieldAccessor 接口汇合（45 个访问器实现）与访问器内 getter / setter 的
#   MethodHandle.invokeExact 手写值池整组逃逸（c1d §30.17 成因 4）。接收者不是枚举标记或口径推不出时照常接边
handle_getters = [
    "java/lang/reflect/Field.get:(Ljava/lang/Object;)Ljava/lang/Object;",
    "java/lang/reflect/Field.getBoolean:(Ljava/lang/Object;)Z",
    "java/lang/reflect/Field.getByte:(Ljava/lang/Object;)B",
    "java/lang/reflect/Field.getChar:(Ljava/lang/Object;)C",
    "java/lang/reflect/Field.getShort:(Ljava/lang/Object;)S",
    "java/lang/reflect/Field.getInt:(Ljava/lang/Object;)I",
    "java/lang/reflect/Field.getLong:(Ljava/lang/Object;)J",
    "java/lang/reflect/Field.getFloat:(Ljava/lang/Object;)F",
    "java/lang/reflect/Field.getDouble:(Ljava/lang/Object;)D",
]
handle_setters = [
    "java/lang/reflect/Field.set:(Ljava/lang/Object;Ljava/lang/Object;)V",
    "java/lang/reflect/Field.setBoolean:(Ljava/lang/Object;Z)V",
    "java/lang/reflect/Field.setByte:(Ljava/lang/Object;B)V",
    "java/lang/reflect/Field.setChar:(Ljava/lang/Object;C)V",
    "java/lang/reflect/Field.setShort:(Ljava/lang/Object;S)V",
    "java/lang/reflect/Field.setInt:(Ljava/lang/Object;I)V",
    "java/lang/reflect/Field.setLong:(Ljava/lang/Object;J)V",
    "java/lang/reflect/Field.setFloat:(Ljava/lang/Object;F)V",
    "java/lang/reflect/Field.setDouble:(Ljava/lang/Object;D)V",
]

# name_resolvers：按名取字段身份的入口（名字 → 偏移 / setter / VarHandle / 更新器 / 字段句柄）。
#   class = Class 实参形参序号（"receiver" = 接收者本身），name = 字段名形参序号（均不含接收者），
#   handle = true 表示返回字段句柄（只经 handle_writers 写入）；offset = true 表示返回字段偏移（字段身份：
#   类字面量 + 名字常量的调用折叠为符号偏移，供按偏移读写的手写调用点只触及该字段）。名字是常量时按上面的形状规则放开；
#   名字取自形参时按各调用点的常量逐个放开；形参出现过非常量实参、或名字来自字段读 / 调用返回 / 拼接时，
#   放开 class 所指类（类字面量）及其超类的全部字段，推不出类则全部字段不折叠；handle = true 的按字段枚举
#   处理（结果句柄带来源标记，流到句柄写入口才放开）。名字取自字段读时取该 String 字段各写入处的字符串常量，取自
#   辅助方法返回时取其返回常量候选。类与名字都取自所在方法形参时登记字段配对，各调用点按本点实参放开（逐层上推）。
#   本表是按名取字段身份的全部入口（清单即边界）：分析器不按调用形状（Class + String 实参）兜底放开同名字段。
#   kind = 引用种类（JVMS §5.4.3.5 reference_kind）形参序号，read_kinds = 只读种类（1 REF_getField / 2 REF_getStatic）：
#   该实参是只读种类的常量时只取读取能力，不放开。按名字段 MemberName 的取法：Lookup.resolveOrFail(byte, Class,
#   String, Class)——Lookup 全部按名字段查找（findSetter / findGetter / findVarHandle …）与 JDK 内部直接解析
#   （ClassSpecializer$Factory.linkCodeToSpeciesData 以 REF_putStatic 解析 species 字段后经 Unsafe.putReference 写入）
#   都经此；MemberName(byte, Class, String, Object) 是方法句柄常量链接（Lookup.linkMethodHandleConstant）的入口。
#   MemberName(Class, String, Class, byte) 不列：java.base 内调用者只有上面的 resolveOrFail 与
#   DirectMethodHandle.createFunction（REF_getStatic 常量，只读）；列入则 resolveOrFail 内的引用种类是形参，
#   getter 查找也会按写入配对放开
[facts.field_writes.name_resolvers]
"jdk/internal/misc/Unsafe.objectFieldOffset:(Ljava/lang/Class;Ljava/lang/String;)J" = { class = 0, name = 1, offset = true }
"java/lang/invoke/MethodHandles$Lookup.findSetter:(Ljava/lang/Class;Ljava/lang/String;Ljava/lang/Class;)Ljava/lang/invoke/MethodHandle;" = { class = 0, name = 1 }
