# 应用工厂 / URLStreamHandlerProvider / java.protocol.handler.pkgs（应用类，java.base 不导出 sun.net.www.protocol，
# 应用无法构造其中的处理器；pkgs 前缀取到的同样是 `<前缀>.<protocol>.Handler`）、内建工厂 URL$DefaultFactory
# （file / jar / jrt 直接 new，其余按 "sun.net.www.protocol." + protocol + ".Handler" 反射构造）——
# 返回的内建处理器都是 sun/net/www/protocol/<protocol>/Handler。
# URL(URL context, String spec, URLStreamHandler handler) 的查找点读 this.protocol：只在 handler 实参为 null、且未沿用
# context 的处理器（context.handler 恒非 null）时到达，此时 spec 必带协议且 protocol 即 spec 解析出的协议名；
# spec 不带协议时要么沿用 context 处理器、要么抛 MalformedURLException("no protocol")，不按协议查找
"java/net/URL.getURLStreamHandler:(Ljava/lang/String;)Ljava/net/URLStreamHandler;" = { key = 0, class_pattern = "sun/net/www/protocol/{}/Handler", scheme_sites = { "java/net/URL.<init>:(Ljava/net/URL;Ljava/lang/String;Ljava/net/URLStreamHandler;)V" = 1 } }

# ── invokedynamic 引导方法分类（闭包分析，generator `rava closure` 读取）──────────────────
# 生成器原生承载这些引导方法的链接语义，分析器不展开其 Java 体，按分类建模调用点：
#   lambda  LambdaMetafactory：调用点产出实现 SAM 接口的合成类，SAM 调用分派到实现方法句柄
#   concat  StringConcatFactory：动态实参按 String.valueOf 语义调用 toString
#   native  其余原生承载的引导方法：只沿静态实参里的方法句柄入链
#   object_methods  native 的细分（record 的 equals / hashCode / toString）：静态实参里的 getter 句柄
#           读出各分量，引用分量按调用点名派发同名 Object 方法（描述符 = indy 描述符去掉首个 record 形参）
# 未列出的引导方法按普通静态调用分析其 Java 体（安全方向）。
[indy]
lambda = [
    "java/lang/invoke/LambdaMetafactory.metafactory",
    "java/lang/invoke/LambdaMetafactory.altMetafactory",
]
concat = [
    "java/lang/invoke/StringConcatFactory.makeConcatWithConstants",
    "java/lang/invoke/StringConcatFactory.makeConcat",
]
native = [
    "java/lang/runtime/SwitchBootstraps.typeSwitch",
    "java/lang/runtime/SwitchBootstraps.enumSwitch",
    "java/lang/runtime/ObjectMethods.bootstrap",
]
# native 的细分（生成器读取；Rust 分析器按上方 native 条目建模）：
#   type_switch  模式匹配 switch：静态实参即 case 标签序列（Class / String / 整数常量 / EnumDesc 动态常量），
#                生成器据此发射运行时标签判定链（S-17）
#   enum_switch  枚举选择子的模式 switch：标签为枚举常量名（选择子枚举类）或 Class
type_switch = [
    "java/lang/runtime/SwitchBootstraps.typeSwitch",
]
enum_switch = [
    "java/lang/runtime/SwitchBootstraps.enumSwitch",
]
object_methods = [
    "java/lang/runtime/ObjectMethods.bootstrap",
]
# concat / object_methods（record toString）引用实参的字符串化入口：两者对引用实参的语义即
# String.valueOf(Object)（null → "null"，否则虚分派 toString；JLS §5.1.11）。
# 生成器在拼接点发射对它的调用（由字节码翻译），分析器把各引用实参接入它的形参
concat_stringify = "java/lang/String.valueOf:(Ljava/lang/Object;)Ljava/lang/String;"
# object_methods（record hashCode / equals）引用分量的入口：语义即 Objects.hashCode(Object)
# （null → 0，否则虚分派 hashCode）与 Objects.equals(Object,Object)（同一引用或均 null → true，
# 否则 a != null && 虚分派 a.equals(b)）。生成器在 record 方法体发射对它们的调用，分析器把分量接入形参。
# 清单是唯一真源：登记了 concat / object_methods 引导方法而缺这三项时装载报错
component_hash = "java/util/Objects.hashCode:(Ljava/lang/Object;)I"
component_equals = "java/util/Objects.equals:(Ljava/lang/Object;Ljava/lang/Object;)Z"

# ── VM 注入状态的落地（closure/src/manifest/vm_state.rs 读取）────────────────────────────
# field_hooks：HotSpot 在建镜像 / 引导时写入、原生二进制改为首次访问时落地的字段。键为
# `属主.字段名:描述符`；receiver = true 的钩子是属主上的接收者方法（`fn(&self) -> Result<&Self>`），
# 发射为 `recv.hook()?.__get_x()`；否则为宿主类静态 fn，访问（读 / 写）前调用。手写体属
# docs/reference/handwritten-boundary.md 准入第 ③ 类（VM 注入状态）。
# - Class.classLoader：类镜像的定义加载器（java_lang_Class::create_mirror），按类块属性 `defining_loader` 填充；
# - ClassLoader.scl / Thread.contextClassLoader：initPhase3 的系统类加载器段（initSystemClassLoader +
#   初始线程 setContextClassLoader），两步均走字节码，进程内执行一次。
[vm_state.field_hooks]
"java/lang/Class.classLoader:Ljava/lang/ClassLoader;" = { hook = "java/lang/Class.__vm_defining_loader", receiver = true }
"java/lang/ClassLoader.scl:Ljava/lang/ClassLoader;" = { hook = "java/lang/ClassLoader.__vm_init_phase3" }
"java/lang/Thread.contextClassLoader:Ljava/lang/ClassLoader;" = { hook = "java/lang/ClassLoader.__vm_init_phase3" }

# loader_map：JDK 模块 → 内建加载器（ModuleLoaderMap 的构建期生成表：<clinit> 把 boot / platform 模块名
# 集合写入两个静态字段）。生成器据此给 JDK 类定出定义加载器：boot 集合 → 引导（null），platform 集合 →
# 平台加载器，其余 JDK 模块 → 应用加载器；用户类与库类为应用加载器。
[vm_state.loader_map]
class = "jdk/internal/module/ModuleLoaderMap$Modules"
boot = "bootModules"
platform = "platformModules"

# ── 基本类型的装箱类（闭包分析，generator `rava closure` 读取）─────────────────────────
# LambdaMetafactory 在 SAM 与实现方法签名的基本类型 ↔ 引用类型位置上做装箱 / 拆箱适配：
# 基本 → 引用调装箱类 `valueOf`，引用 → 基本调装箱类返回该基本类型的 `xxxValue`；
# 这些调用由 VM 生成、不在任何字节码里，分析器据本表补调用边。键为基本类型描述符字符
[boxing]
B = "java/lang/Byte"
C = "java/lang/Character"
D = "java/lang/Double"
F = "java/lang/Float"
I = "java/lang/Integer"
J = "java/lang/Long"
S = "java/lang/Short"
Z = "java/lang/Boolean"

# ── 确定性具体求值（闭包分析，generator `rava closure` 读取；engine/concrete）──────────────
# 入口方法的调用点实参可枚举（字符串字面量 / 类镜像 / 整数 / null 且来源全部可取回）时，按实参逐组
# 具体执行；轨迹上的方法只按执行过的指令入闭包，结果对象图物化为类型流。任一组合失败即回退抽象调用边。
[concrete]
# 入口（`类.方法:描述符`）
entries = [
    "java/util/Formatter.parse:(Ljava/lang/String;)Ljava/util/List;",
    "java/util/regex/Pattern.compile:(Ljava/lang/String;)Ljava/util/regex/Pattern;",
    # 实例方法入口：接收者值集须全部是所指已知的类镜像（逐镜像求值）
    "java/lang/Class.getGenericInterfaces:()[Ljava/lang/reflect/Type;",
]
# 内存缓存字段（`类.字段`）：可读映像对象上的这些字段；冷 / 热两次求值取并，求值后撤销写入
memo_fields = [
    "java/lang/Class.genericInfo",
    "java/lang/Class.reflectionData",
    "java/lang/String.hash",
    "java/lang/String.hashIsZero",
]
# 发布后不再改写的类型（含子类型）：映像中这类对象的全部实例字段可读，经其字段取到的映像数组视为冻结；
# 声明在这类类型上的静态字段所指映像数组同样冻结。
# Pattern 的契约是「实例不可变、可多线程共享」：节点图与字符谓词在构造（compile）中建成，匹配状态全在 Matcher；
# CharacterData 各子类的 Unicode 属性表、ASCII 的字符类别表、各装箱缓存（JLS §5.1.7 的规范化实例表）
# 在类初始化中建成，之后只读
stable_types = [
    "java/lang/CharacterData",
    "java/lang/Byte$ByteCache",
    "java/lang/Character$CharacterCache",
    "java/lang/Short$ShortCache",
    "java/lang/Integer$IntegerCache",
    "java/lang/Long$LongCache",
    "java/util/regex/ASCII",
    "java/util/regex/Pattern",
    "java/util/regex/Pattern$Node",
    "java/util/regex/Pattern$CharPredicate",
]

# 手写承载方法的具体语义：成员（`类.方法:描述符`）→ 操作名（engine/concrete/natives.rs）
# `bytecode`：手写承载与 JDK 字节码语义一致的方法（边界类未登记翻译的 `<clinit>` 等），求值时解释其字节码；
# `opaque`（只用于 `<clinit>`）：静态状态由 VM / 手写层承载的类，初始化不执行、其静态字段不可读（读即求值失败）
[concrete.natives]
"java/lang/System.arraycopy:(Ljava/lang/Object;ILjava/lang/Object;II)V" = "arraycopy"
"java/lang/System.identityHashCode:(Ljava/lang/Object;)I" = "identity_hash"
"java/lang/Object.<init>:()V" = "noop"
"java/lang/Object.getClass:()Ljava/lang/Class;" = "get_class"
"java/lang/Object.hashCode:()I" = "identity_hash"
"java/lang/Object.clone:()Ljava/lang/Object;" = "clone"
"java/lang/Class.<clinit>:()V" = "bytecode"
"jdk/internal/misc/Unsafe.<clinit>:()V" = "opaque"
# Unsafe 实例由 VM 持有（Unsafe.<clinit> 不执行）：取单例
"jdk/internal/misc/Unsafe.getUnsafe:()Ljdk/internal/misc/Unsafe;" = "vm_singleton"
"jdk/internal/misc/Unsafe.allocateUninitializedArray:(Ljava/lang/Class;I)Ljava/lang/Object;" = "bytecode"
# 字段偏移即字段身份（unsafe__impl.rs objectFieldOffset_class_str 的不透明 id 同口径），按身份 CAS 实例引用字段
"jdk/internal/misc/Unsafe.objectFieldOffset:(Ljava/lang/Class;Ljava/lang/String;)J" = "field_offset"
"jdk/internal/misc/Unsafe.compareAndSetReference:(Ljava/lang/Object;JLjava/lang/Object;Ljava/lang/Object;)Z" = "cas_reference"
"java/lang/Class.registerNatives:()V" = "noop"
"java/lang/Class.getPrimitiveClass:(Ljava/lang/String;)Ljava/lang/Class;" = "primitive_class"
"java/lang/Class.initClassName:()Ljava/lang/String;" = "class_name"
"java/lang/Class.isArray:()Z" = "class_is_array"
"java/lang/Class.isPrimitive:()Z" = "class_is_primitive"
"java/lang/Class.isInterface:()Z" = "class_is_interface"
"java/lang/Class.getModifiers:()I" = "class_modifiers"
"java/lang/Class.getSuperclass:()Ljava/lang/Class;" = "class_superclass"
"java/lang/Class.getInterfaces0:()[Ljava/lang/Class;" = "class_interfaces"
"java/lang/Class.getGenericSignature0:()Ljava/lang/String;" = "class_signature"
"java/lang/Class.getDeclaringClass0:()Ljava/lang/Class;" = "class_declaring_class"
"java/lang/Class.getEnclosingMethod0:()[Ljava/lang/Object;" = "class_enclosing_method"
"java/lang/Class.isInstance:(Ljava/lang/Object;)Z" = "class_is_instance"
"java/lang/Class.isAssignableFrom:(Ljava/lang/Class;)Z" = "class_is_assignable_from"
"java/lang/Class.desiredAssertionStatus0:(Ljava/lang/Class;)Z" = "const:false"
"java/lang/Class.forName0:(Ljava/lang/String;ZLjava/lang/ClassLoader;Ljava/lang/Class;)Ljava/lang/Class;" = "class_for_name"
# 原生二进制不携带 CDS 归档（cds_impl.rs / vm_impl.rs）：查询恒 false、归档恢复为空操作、转储种子恒 0
"jdk/internal/misc/CDS.isDumpingClassList0:()Z" = "const:false"
"jdk/internal/misc/CDS.isDumpingArchive0:()Z" = "const:false"
"jdk/internal/misc/CDS.isSharingEnabled0:()Z" = "const:false"
"jdk/internal/misc/CDS.initializeFromArchive:(Ljava/lang/Class;)V" = "noop"
"jdk/internal/misc/CDS.getRandomSeedForDumping:()J" = "noop"
"jdk/internal/misc/VM.initialize:()V" = "noop"
# 求值器的 UTF16 字符串布局按小端码元（与目标平台一致，string_utf16_impl.rs）
"java/lang/StringUTF16.isBigEndian:()Z" = "const:false"
"java/lang/String.intern:()Ljava/lang/String;" = "intern"
"java/lang/Float.floatToRawIntBits:(F)I" = "float_to_raw_int_bits"
"java/lang/Float.intBitsToFloat:(I)F" = "int_bits_to_float"
"java/lang/Double.doubleToRawLongBits:(D)J" = "double_to_raw_long_bits"
"java/lang/Double.longBitsToDouble:(J)D" = "long_bits_to_double"
"jdk/internal/reflect/Reflection.getCallerClass:()Ljava/lang/Class;" = "caller_class"
"java/lang/reflect/Array.newArray:(Ljava/lang/Class;I)Ljava/lang/Object;" = "new_array"
"java/lang/Throwable.fillInStackTrace:(I)Ljava/lang/Throwable;" = "self"

# 隐式异常（JVMS §6.5 各指令的运行期异常）：种类 → VM 抛出的异常类型。具体求值时按异常表查找处理器，
# 未被捕获则作为求值结果的抛出值；异常对象由 VM 直接分配（消息惰性给出，不执行构造器）
[concrete.implicit]
null = "java/lang/NullPointerException"
index = "java/lang/ArrayIndexOutOfBoundsException"
cast = "java/lang/ClassCastException"
arith = "java/lang/ArithmeticException"
store = "java/lang/ArrayStoreException"
size = "java/lang/NegativeArraySizeException"

# VM 直接构造字符串字面量与类镜像时写入的字段（语义名 → `类.字段`）
[concrete.vm_fields]
string_value = "java/lang/String.value"
string_coder = "java/lang/String.coder"
component_type = "java/lang/Class.componentType"
reference_referent = "java/lang/ref/Reference.referent"
class_module = "java/lang/Class.module"

# ── 构建期引导映像求值（docs/plans/2026-10-05-boot-image-evaluator.md；engine/concrete/boot*.rs）──
# 每次闭包分析前按 calls 顺序具体执行 JDK 引导字节码（永久映像纪元），结果见 closure.json summary.boot_image
# 与 `rava audit boot`。值：`@deferred` = 宿主相关（运行期取宿主值；构建期读其内容即「延迟值参与求值」，
# 所在根帧调用 / 区段残差化或所在类转为运行期初始化）；`@null` = null；`@jdk_feature` = 参考 JDK 特性版本号。
# 用户决策 U1（2026-10-05）：sun.jnu.encoding、stdout/stderr.encoding、file.encoding（JDK 25 为 native.encoding）、
# line.separator、java.home 不钉值，一律延迟。
[concrete.boot]
calls = [
    ["java/lang/System.initPhase1:()V"],
    ["java/lang/System.initPhase2:(ZZ)I", 0, 0],
    ["java/lang/System.initPhase3:()V"],
]
# HotSpot Threads::initialize_java_lang_classes 在 initPhase1 前初始化的类（JDK 21 次序）
init = [
    "java/lang/String", "java/lang/System", "java/lang/Class", "java/lang/ThreadGroup", "java/lang/Thread",
    "java/lang/Module", "jdk/internal/misc/UnsafeConstants", "java/lang/reflect/Method", "java/lang/ref/Finalizer",
]
# create_initial_thread_group / create_initial_thread：system 组、main 组、main 线程
objects = [
    ["java/lang/ThreadGroup", "()V"],
    ["java/lang/ThreadGroup", "(Ljava/lang/ThreadGroup;Ljava/lang/String;)V", "@0", "str:main"],
    ["java/lang/Thread", "(Ljava/lang/ThreadGroup;Ljava/lang/String;)V", "@1", "str:main"],
]
current_thread = 2
vm_props = [
    ["java.home", "@deferred"],
    ["sun.boot.library.path", "@deferred"],
    ["java.library.path", ""],
    ["java.class.path", ""],
    ["java.vm.specification.name", "Java Virtual Machine Specification"],
    ["java.vm.specification.vendor", "Oracle Corporation"],
    ["java.vm.specification.version", "@jdk_feature"],
    ["java.vm.name", "rava native runtime"],
    ["java.vm.vendor", "rava"],
    ["java.vm.version", "@jdk_feature"],
    ["java.vm.info", "native image"],
    ["jdk.debug", "release"],
    ["jdk.reflect.useNativeAccessorOnly", "true"],
]

