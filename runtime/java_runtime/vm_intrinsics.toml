"java/lang/invoke/VarHandle.weakCompareAndSetPlain:([Ljava/lang/Object;)Z" = { dst = 0, last = true, fields = true }
"java/lang/invoke/VarHandle.weakCompareAndSetAcquire:([Ljava/lang/Object;)Z" = { dst = 0, last = true, fields = true }
"java/lang/invoke/VarHandle.weakCompareAndSetRelease:([Ljava/lang/Object;)Z" = { dst = 0, last = true, fields = true }
"java/lang/invoke/VarHandle.compareAndExchange:([Ljava/lang/Object;)Ljava/lang/Object;" = { dst = 0, last = true, fields = true }
