# VM 承载清单：公开 API 中由 VM（手写层）承载、不执行其 Java 体的方法，以及生成器对调用点的特判。
#
# 读取入口：generator/crates/closure/src/manifest.rs、generator/crates/input/src/manifest.rs。内建与「手写覆盖」（FS-H0 审计线，最终态 0）分开计数：
# 内建是最终态的一部分，`[raw-audit] intrinsics=` 单独统计。
#
# 内建准入类别（kind）——每条须写明依据（reason）：
#   exact             精确运算：JDK 源码标注 @IntrinsicCandidate，规范给出唯一结果（IEEE 754 正确舍入 /
#                     精确运算），Rust 原生运算逐位相同
#   class_definition  运行期类定义点：原生二进制无运行期类定义（defineClass / 隐藏类），方法体的唯一
#                     可观察效果是「定义并返回一个类」（或其对偶查询），VM 以类宇宙中的静态类等价承载
#   stack_frame       栈帧查询点：原生二进制无 Java 栈帧，方法体的唯一可观察效果是「按抛出位置作布尔
#                     判定」，VM 的运行期登记与栈帧判定逐例同解
#   bytecode_generator 字节码生成器内部判定：只为「生成的字节码」服务，生成链截断后无语义消费方

[[intrinsic]]
member = "java/lang/StrictMath.sqrt:(D)D"
kind = "exact"
reason = "JLS / StrictMath.sqrt：IEEE 754 squareRoot 正确舍入；f64::sqrt 同为正确舍入"

[[intrinsic]]
member = "java/lang/invoke/ClassSpecializer$Factory.generateConcreteSpeciesCode:(Ljava/lang/String;Ljava/lang/invoke/ClassSpecializer$SpeciesData;)Ljava/lang/Class;"
kind = "class_definition"
reason = "动态物种统一由 VM 支持类 BoundMethodHandle$Species_Dyn 承载（docs/plans/2026-09-27-bmh-dynamic-species.md）"

[[intrinsic]]
member = "jdk/internal/reflect/MethodAccessorGenerator.generateSerializationConstructor:(Ljava/lang/Class;[Ljava/lang/Class;ILjava/lang/Class;)Ljdk/internal/reflect/SerializationConstructorAccessorImpl;"
kind = "class_definition"
reason = "序列化构造器访问器统一由 VM 支持类 SerializationConstructorAccessorDyn 承载（docs/plans/2026-09-27-reflection-metadata-table.md §2.4）"

[[intrinsic]]
member = "java/lang/reflect/Proxy.newProxyInstance:(Ljava/lang/ClassLoader;[Ljava/lang/Class;Ljava/lang/reflect/InvocationHandler;)Ljava/lang/Object;"
kind = "class_definition"
reason = "动态代理类统一由 VM 支持类 Proxy$Dyn 承载（docs/plans/2026-09-27-reflection-metadata-table.md §2.6）"

[[intrinsic]]
member = "java/lang/reflect/Proxy$ProxyBuilder.isProxyClass:(Ljava/lang/Class;)Z"
kind = "class_definition"
reason = "类定义点的对偶查询：代理类即 Proxy$Dyn（不经 defineProxyClass 登记 reverseProxyCache）"

[[intrinsic]]
member = "java/lang/invoke/MethodHandleImpl$BindCaller.makeInjectedInvoker:(Ljava/lang/Class;)Ljava/lang/Class;"
kind = "class_definition"
reason = "@CallerSensitive 注入调用器隐藏类按宿主由 VM 登记，静态方法由 VM 支持类 InjectedInvokerDyn 承载（docs/plans/2026-10-02-c1d-reflect-narrow.md §3.3）"

[[intrinsic]]
member = "java/lang/invoke/MethodHandleImpl$BindCaller.generateInvokerTemplate:()[B"
kind = "bytecode_generator"
reason = "注入调用器模板类字节（ASM）；唯一消费方 makeInjectedInvoker 由 VM 承载 → 空模板"

# LambdaForm 编译：JDK 把 LambdaForm 编译为隐藏类字节码（ASM + defineHiddenClass），原生二进制以原生
# LambdaForm 解释器承载全部句柄调用（MH-native，docs/plans/2026-09-26-mh-native.md §二-2）；编译入口
# 返回解释入口 MemberName（HotSpot interpret_<sig> 的等价物，「已就绪」判据）。
[[intrinsic]]
member = "java/lang/invoke/InvokerBytecodeGenerator.generateCustomizedCode:(Ljava/lang/invoke/LambdaForm;Ljava/lang/invoke/MethodType;)Ljava/lang/invoke/MemberName;"
kind = "class_definition"
reason = "生成 LambdaForm 隐藏类 → 解释入口"

[[intrinsic]]
member = "java/lang/invoke/InvokerBytecodeGenerator.generateLambdaFormInterpreterEntryPoint:(Ljava/lang/invoke/MethodType;)Ljava/lang/invoke/MemberName;"
kind = "class_definition"
reason = "生成解释入口隐藏类 → 解释入口"

[[intrinsic]]
member = "java/lang/invoke/InvokerBytecodeGenerator.lookupPregenerated:(Ljava/lang/invoke/LambdaForm;Ljava/lang/invoke/MethodType;)Ljava/lang/invoke/MemberName;"
kind = "class_definition"
reason = "查 jlink 预生成 LambdaForm Holder 类（运行期按名加载）→ null，走解释"

[[intrinsic]]
member = "java/lang/invoke/InvokerBytecodeGenerator.isStaticallyInvocable:([Ljava/lang/invoke/LambdaForm$NamedFunction;)Z"
kind = "bytecode_generator"
reason = "「生成的字节码能否直接 invokestatic 成员」；生成链截断后仅断言消费，解释器对全部成员可调 → 恒 true"

[[intrinsic]]
member = "java/lang/invoke/InvokerBytecodeGenerator.isStaticallyInvocable:(Ljava/lang/invoke/LambdaForm$Name;)Z"
kind = "bytecode_generator"
reason = "同上"

[[intrinsic]]
member = "java/lang/invoke/InvokerBytecodeGenerator.isStaticallyInvocable:(Ljava/lang/invoke/MemberName;)Z"
kind = "bytecode_generator"
reason = "同上"

[[intrinsic]]
member = "jdk/internal/reflect/AccessorUtils.isIllegalArgument:(Ljava/lang/Class;Ljava/lang/RuntimeException;)Z"
kind = "stack_frame"
reason = "栈帧规则「途经 java.base 帧继续、遇用户帧判目标抛出」由 L3 分派登记等价（reflect_dispatch::thrown_by_target：仅经用户成员逃逸者登记）"

# ── @CallerSensitive 注解（binary name）──────────────────────────────────────────────
# 调用标注此注解的方法时，生成器把调用处所在类显式传入运行时（reflect_dispatch::__caller_sensitive），
# Reflection.getCallerClass 据此返回——平台无关、与 JVM 栈帧语义逐点一致（原生二进制无 Java 栈帧可读）。
[caller_sensitive]
annotations = [
    "jdk/internal/reflect/CallerSensitive",
]

# ── 签名多态方法（JVMS §2.9.3）中需要调用点类型的成员：`类.方法` ─────────────────────────
# codegen 对这些调用发射 `recv.<方法>__site("<调用点描述符>", 实参数组)`，手写伴生据调用点 MethodType
# 做类型检查 / 适配（MH-native，docs/plans/2026-09-26-mh-native.md §二-6）：
#   invokeExact：句柄类型 ≠ 调用点类型 → WrongMethodTypeException
#   invoke：     句柄类型 ≠ 调用点类型 → asType(调用点类型) 后调用
[sigpoly]
callsite_typed = [
    "java/lang/invoke/MethodHandle.invokeExact",
    "java/lang/invoke/MethodHandle.invoke",
]

# ── VM 常量（死分支剪除）──────────────────────────────────────────────────────────────
# 手写边界方法在原生二进制中返回恒定值（无启动选项可改变），其守卫的分支静态可判。
# 字节码规范化阶段（generator/crates/input/src/prune.rs，classfile 解码后单点执行）剪除恒不执行的分支体：
# 调用链不再经它拉入类，生成代码也不含该分支——与 JVM 在同一配置下的执行路径一致。
#   null_returns   恒返回 null 的方法（`类.方法:描述符`）
#   null_to_false  纯函数：null 实参 → false（JDK 规范语义）
# 识别形态：`<null_returns 调用> [astore k; aload k] ifnull L` 与
#           `<null_returns 调用> [astore k; aload k] <null_to_false 调用> ifeq L`——恒跳转，
#           剪除 (分支, L) 之间的直线段（段内无外部跳入 / 异常表端点时才剪）。
[vm_constants]
null_returns = [
    # VM 保存属性仅来自 -XX: / 归档选项；原生二进制无启动选项（vm_impl.rs getSavedProperty 恒 null）
    "jdk/internal/misc/VM.getSavedProperty:(Ljava/lang/String;)Ljava/lang/String;",
]
null_to_false = [
    "java/lang/Boolean.parseBoolean:(Ljava/lang/String;)Z",
]

# VM 注入的静态字段（handwritten-boundary.md 类 ③）：HotSpot 在类初始化期间写入平台 / 对象布局常量，
# 字节码里的初值（UnsafeConstants.<clinit> 的 0 / false）或初始化器（Unsafe.<clinit> 经 VM 原语
# arrayBaseOffset0 / arrayIndexScale0 取值，Unsafe 为 VM 边界类、<clinit> 不翻译）不给出运行期值。
# 条目 `类.字段` = 取值表达式（crate 根下路径，返回 i64 / bool；runtime/java_runtime/src/vm_constants.rs），
# 或整数 / 布尔字面量（值与宿主无关的 VM 引导状态；分析器按该值折叠读取）。
# 生成器把字段发为读取该表达式的访问器（按字段描述符做数值宽度转换；字节码对它的写入被 VM 值覆盖，
# 同 HotSpot UnsafeConstantsFixup 在 <clinit> 后改写），分析器不按字节码值折叠其读取。
[vm_constants.injected_statics]
"jdk/internal/misc/UnsafeConstants.ADDRESS_SIZE0" = "vm_constants::address_size()"
"jdk/internal/misc/UnsafeConstants.PAGE_SIZE" = "vm_constants::page_size()"
"jdk/internal/misc/UnsafeConstants.BIG_ENDIAN" = "vm_constants::big_endian()"
"jdk/internal/misc/UnsafeConstants.UNALIGNED_ACCESS" = "vm_constants::unaligned_access()"
"jdk/internal/misc/UnsafeConstants.DATA_CACHE_LINE_FLUSH_SIZE" = "vm_constants::data_cache_line_flush_size()"
"jdk/internal/misc/Unsafe.ADDRESS_SIZE" = "vm_constants::address_size()"
"jdk/internal/misc/Unsafe.ARRAY_BOOLEAN_BASE_OFFSET" = "vm_constants::array_base_offset()"
"jdk/internal/misc/Unsafe.ARRAY_BOOLEAN_INDEX_SCALE" = "vm_constants::array_index_scale('Z')"
"jdk/internal/misc/Unsafe.ARRAY_BYTE_BASE_OFFSET" = "vm_constants::array_base_offset()"
"jdk/internal/misc/Unsafe.ARRAY_BYTE_INDEX_SCALE" = "vm_constants::array_index_scale('B')"
"jdk/internal/misc/Unsafe.ARRAY_SHORT_BASE_OFFSET" = "vm_constants::array_base_offset()"
"jdk/internal/misc/Unsafe.ARRAY_SHORT_INDEX_SCALE" = "vm_constants::array_index_scale('S')"
"jdk/internal/misc/Unsafe.ARRAY_CHAR_BASE_OFFSET" = "vm_constants::array_base_offset()"
"jdk/internal/misc/Unsafe.ARRAY_CHAR_INDEX_SCALE" = "vm_constants::array_index_scale('C')"
"jdk/internal/misc/Unsafe.ARRAY_INT_BASE_OFFSET" = "vm_constants::array_base_offset()"
"jdk/internal/misc/Unsafe.ARRAY_INT_INDEX_SCALE" = "vm_constants::array_index_scale('I')"
"jdk/internal/misc/Unsafe.ARRAY_LONG_BASE_OFFSET" = "vm_constants::array_base_offset()"
"jdk/internal/misc/Unsafe.ARRAY_LONG_INDEX_SCALE" = "vm_constants::array_index_scale('J')"
"jdk/internal/misc/Unsafe.ARRAY_FLOAT_BASE_OFFSET" = "vm_constants::array_base_offset()"
"jdk/internal/misc/Unsafe.ARRAY_FLOAT_INDEX_SCALE" = "vm_constants::array_index_scale('F')"
"jdk/internal/misc/Unsafe.ARRAY_DOUBLE_BASE_OFFSET" = "vm_constants::array_base_offset()"
"jdk/internal/misc/Unsafe.ARRAY_DOUBLE_INDEX_SCALE" = "vm_constants::array_index_scale('D')"
"jdk/internal/misc/Unsafe.ARRAY_OBJECT_BASE_OFFSET" = "vm_constants::array_base_offset()"
"jdk/internal/misc/Unsafe.ARRAY_OBJECT_INDEX_SCALE" = "vm_constants::array_index_scale('L')"
# 安全管理器档位：HotSpot 由 System.initPhase3（VM 驱动的引导入口，原生二进制不执行）按系统属性
# java.security.manager 写入；原生二进制无 -D，属性缺席即 NEVER（= 1，JDK 21 缺省）：getSecurityManager
# 恒 null、setSecurityManager 抛 UnsupportedOperationException，与 JVM 缺省配置一致
"java/lang/System.allowSecurityManager" = 1

# ── VM 事实（闭包分析的常量条件，generator `rava closure` 读取）─────────────────────────
# 手写层承载的方法在原生二进制中返回恒定值；分析器据此做常量传播与死分支剪枝（计划
# docs/plans/2026-09-29-rust-closure-analyzer.md §3.2）。值：null / 整数 / true / false。
# 准入：值由手写实现无条件给出（注明实现位置），与 JVM 缺省配置的可观测行为一致。
# [vm_constants] null_returns 同为事实来源（分析器一并读取）。
[facts]
# 返回值是接收者的浅拷贝（JVMS clone 语义：同类型、数组元素逐个复制）：分析器把接收者的
# 类型集接到返回值，数组副本与原数组共享元素类型节点（替代手写返回的 open(返回类型)）
receiver_returns = [
    "java/lang/Object.clone:()Ljava/lang/Object;",
]
# 按值比较的纯函数：接收者与实参都是常量（字符串 / null）时结果即常量（JDK 规范语义：
# 内容相同为 true，实参为 null 为 false）
value_equals = [
    "java/lang/String.equals:(Ljava/lang/Object;)Z",
]

# 字符 / 字符串纯函数：接收者与实参都是常量（或实参 null）时结果即常量（JDK 规范语义）。
# 值：equals_ignore_case（实参 null 为 false）/ length（UTF-16 长度）/ is_empty /
# hash_code（String.hashCode 规范公式；字符串 switch 的分派键）/ char_at（越界不折叠）/
# char_to_lower_case（仅 ASCII 实参折叠）。用途：常量协议名等经字符串 switch、逐字符比较选分支时按值剪枝
# （如 URL$DefaultFactory.createURLStreamHandler("file") 不走反射加载、URL.isOverrideable("file") 为 false）
[facts.string_ops]
"java/lang/String.equalsIgnoreCase:(Ljava/lang/String;)Z" = "equals_ignore_case"
"java/lang/String.length:()I" = "length"
"java/lang/String.isEmpty:()Z" = "is_empty"
"java/lang/String.hashCode:()I" = "hash_code"
"java/lang/String.charAt:(I)C" = "char_at"
"java/lang/Character.toLowerCase:(C)C" = "char_to_lower_case"
# 按 locale 小写：只在 ASCII 且不含 `I` 的串上折叠（此时各 locale 结果相同，土耳其语等的 `I` 例外不出现）
"java/lang/String.toLowerCase:(Ljava/util/Locale;)Ljava/lang/String;" = "to_lower_case"

[facts.returns]
# 断言的 VM 初值（`-ea` 缺省）：class_impl.rs desiredAssertionStatus0 恒 false。`desiredAssertionStatus()`
# 本身走字节码：引导类镜像的 classLoader 为 null（分析器常量求值按定义加载器表给出）→ 落到本条 → 引导类
# `$assertionsDisabled = !X.class.desiredAssertionStatus()` 折叠为常量，assert 体不入闭包；应用 / 平台类按
# 加载器的断言表在运行期求值
"java/lang/Class.desiredAssertionStatus0:(Ljava/lang/Class;)Z" = false
# 原生二进制进入 main 时运行时已完成引导（vm_impl.rs：isBooted / isModuleSystemInited /
# isJavaLangInvokeInited 恒 true）；引导期分支（如 ReflectionFactory.config 的 DEFAULT_CONFIG）不可达
"jdk/internal/misc/VM.isBooted:()Z" = true
"jdk/internal/misc/VM.isModuleSystemInited:()Z" = true
"jdk/internal/misc/VM.isJavaLangInvokeInited:()Z" = true

# VM 初始系统属性表：原生二进制启动时 `System.props` 的内容（System.registerNatives 按本表填充，
# 与 system_impl.rs 的 initPhase1 对应物同源）。原生二进制无 `-D` 注入机制，因此：
#   values   取值恒定的键——读取折叠为该值
#   dynamic  存在、但取值由宿主环境 / 语料 JDK（VersionProps）在启动期决定的键——不折叠
#   其余键   启动时不存在——读取折叠为 null（带缺省值的读取折叠为缺省值）
# 折叠只针对运行期不会被改写的键：可达代码里对系统属性表的按键改写（writers，键为常量）使该键
# 不折叠；键不定的改写、整表替换（写 holders 字段）、系统属性表对象流出读写锚点之外（作实参 /
# 存入字段 / 返回 / 调用其他方法）使全部键不折叠。
[facts.system_properties]
# 持有系统属性表对象的静态字段 / 返回它的手写方法
holders = [
    "java/lang/System.props:Ljava/util/Properties;",
    "sun/security/action/GetPropertyAction.privilegedGetProperties:()Ljava/util/Properties;",
]
dynamic = [
    "java.home", "line.separator", "user.dir", "user.home", "user.name", "java.io.tmpdir",
    "os.name", "os.arch", "os.version", "sun.arch.data.model", "sun.cpu.endian", "sun.io.unicode.encoding",
    "sun.boot.library.path", "native.encoding", "sun.jnu.encoding", "user.timezone",
    "user.language", "user.country",
    # VersionProps.init（翻译的字节码，取值随语料 JDK）
    "java.version", "java.version.date", "java.runtime.version", "java.runtime.name", "java.vendor.version",
    "java.class.version", "java.specification.version", "java.specification.name", "java.specification.vendor",
    "java.vendor", "java.vendor.url", "java.vendor.url.bug",
    # VM 族中随 VersionProps 取值的键
    "java.vm.specification.version", "java.vm.vendor", "java.vm.version",
]
# 只读查询入口：接收者为系统属性表对象时既不改写表、结果也不持有表的引用（不算逃逸）
queries = [
    # 新建 HashMap 收集字符串键值，返回其键集的不可变视图
    "java/util/Properties.stringPropertyNames:()Ljava/util/Set;",
]

[facts.system_properties.values]
"file.separator" = "/"
"path.separator" = ":"
"java.class.path" = ""
"java.library.path" = ""
"jdk.debug" = "release"
"file.encoding" = "UTF-8"
"stdout.encoding" = "UTF-8"
"stderr.encoding" = "UTF-8"
"java.vm.specification.name" = "Java Virtual Machine Specification"
"java.vm.specification.vendor" = "Oracle Corporation"
"java.vm.name" = "rava native runtime"
"java.vm.info" = "native image"
# 反射只走 native 访问器（NativeConstructorAccessorImpl / NativeMethodAccessorImpl 手写承载），
# 不经 MethodHandle 访问器——原生二进制不在运行期生成 LambdaForm
"jdk.reflect.useNativeAccessorOnly" = "true"

# 读取入口：实参序号含接收者；receiver = 接收者须为系统属性表对象；default = 缺省值实参。
# 包装方法（System.getProperty 等）由分析器从字节码识别：返回值恰是入口读取、键来自形参
[facts.system_properties.readers]
"java/util/Properties.getProperty:(Ljava/lang/String;)Ljava/lang/String;" = { receiver = true, key = 1 }
"java/util/Properties.getProperty:(Ljava/lang/String;Ljava/lang/String;)Ljava/lang/String;" = { receiver = true, key = 1, default = 2 }
"sun/security/action/GetPropertyAction.privilegedGetProperty:(Ljava/lang/String;)Ljava/lang/String;" = { key = 0 }
"sun/security/action/GetPropertyAction.privilegedGetProperty:(Ljava/lang/String;Ljava/lang/String;)Ljava/lang/String;" = { key = 0, default = 1 }
# 删除并返回原值：结果即该键的读取（启动时不存在、且从未写入的键为 null）
"java/util/Properties.remove:(Ljava/lang/Object;)Ljava/lang/Object;" = { receiver = true, key = 1 }

# 按键改写入口（接收者为系统属性表对象时只改写 key 实参所指的键）。remove = 删除：只可能改变启动时
# 存在的键（values / dynamic），只被删除、从未写入的键仍读作不存在；删除键推不出时按拼接段匹配 values 键，
# 拼接段也推不出则 values 全部不折叠（不波及启动时不存在的键）
[facts.system_properties.writers]
"java/util/Properties.setProperty:(Ljava/lang/String;Ljava/lang/String;)Ljava/lang/Object;" = { key = 1 }
"java/util/Properties.put:(Ljava/lang/Object;Ljava/lang/Object;)Ljava/lang/Object;" = { key = 1 }
"java/util/Properties.remove:(Ljava/lang/Object;)Ljava/lang/Object;" = { key = 1, remove = true }

[facts.field_writes]
# 字段常量折叠的反射式写入来源（计划 C1c 第 1 步）。分析器按「全部写入来源」求字段值集，
# 只有一个常量时把读取折叠掉；以下调用可达时相关字段不折叠。
# 按名写入（objectFieldOffset(Class, "名") / findVarHandle / newUpdater / getDeclaredField("名")）
# 按字节码形状识别（同一调用含 Class 实参 / 接收者 + 字符串常量），不在此列。
# enumerators：返回字段句柄数组。句柄只有经下列 handle_writers 才能写字段：枚举结果带来源标记，标记随句柄
#   沿字节码数据流传到 handle_writers 的句柄实参时，接收者是类字面量则只放开该类及其超类的字段，否则全部
#   字段不折叠；只读句柄（取名字 / 修饰符 / 值，如 ObjectStreamClass.computeDefaultSUID）与按名字常量取到的
#   句柄（已按名放开）不放开被枚举的字段。写入口的句柄实参取不到值 / 含非建模代码产出的句柄、或写入口经
#   非字节码调用点（反射调用、lambda、手写体）到达时按全部枚举放开（engine/field_handles.rs）
enumerators = [
    "java/lang/Class.getDeclaredFields:()[Ljava/lang/reflect/Field;",
    "java/lang/Class.getFields:()[Ljava/lang/reflect/Field;",
]
# handle_writers：按字段句柄写字段的入口（Field.set* 的访问器、Lookup 的 setter / VarHandle、
#   jdk.unsupported 的 Unsafe 偏移取法）。jdk.internal.misc.Unsafe 的 Field 偏移取法不在此列：
#   JDK 内部调用者只有 Field.get* / set* 的访问器（写入仍经 Field.set*）与反序列化的 FieldReflector
#   （由 deserializers 计入）
handle_writers = [
    "java/lang/reflect/Field.set:(Ljava/lang/Object;Ljava/lang/Object;)V",
    "java/lang/reflect/Field.setBoolean:(Ljava/lang/Object;Z)V",
    "java/lang/reflect/Field.setByte:(Ljava/lang/Object;B)V",
    "java/lang/reflect/Field.setChar:(Ljava/lang/Object;C)V",
    "java/lang/reflect/Field.setShort:(Ljava/lang/Object;S)V",
    "java/lang/reflect/Field.setInt:(Ljava/lang/Object;I)V",
    "java/lang/reflect/Field.setLong:(Ljava/lang/Object;J)V",
    "java/lang/reflect/Field.setFloat:(Ljava/lang/Object;F)V",
    "java/lang/reflect/Field.setDouble:(Ljava/lang/Object;D)V",
    "java/lang/invoke/MethodHandles$Lookup.unreflectSetter:(Ljava/lang/reflect/Field;)Ljava/lang/invoke/MethodHandle;",
    "java/lang/invoke/MethodHandles$Lookup.unreflectVarHandle:(Ljava/lang/reflect/Field;)Ljava/lang/invoke/VarHandle;",
    "sun/misc/Unsafe.objectFieldOffset:(Ljava/lang/reflect/Field;)J",
    "sun/misc/Unsafe.staticFieldOffset:(Ljava/lang/reflect/Field;)J",
    "sun/misc/Unsafe.staticFieldBase:(Ljava/lang/reflect/Field;)Ljava/lang/Object;",
]
# handle_bridges：在其内调用 handle_writers 不算写入入口。JavaLangInvokeAccess.unreflectField 的实现，
#   JDK 内唯一调用者是 MethodHandleAccessorFactory.newFieldAccessor：Field.get* / set* 首次取访问器时
#   一并建 setter 句柄（isReadOnly 取决于运行期修饰符，恒可达），句柄只存于 FieldAccessor、
#   只经 Field.set* 调用，写入已由上面的 Field.set* 计入
handle_bridges = [
    "java/lang/invoke/MethodHandleImpl$1.unreflectField:(Ljava/lang/reflect/Field;Z)Ljava/lang/invoke/MethodHandle;",
]
# deserializers：可达即可序列化类（声明类是 serializable_markers 的子类型）的非 static、非 transient 字段不折叠。
#   反序列化按 ObjectStreamClass 只写可序列化类声明的字段；首个不可序列化超类及其以上的字段由其无参构造器初始化（字节码可见）
deserializers = [
    "java/io/ObjectInputStream.readObject:()Ljava/lang/Object;",
    "java/io/ObjectInputStream.readUnshared:()Ljava/lang/Object;",
]
serializable_markers = ["java/io/Serializable"]
# serial_enumerators：只对可序列化类（serializable_markers 的子类型）调用上列 enumerators、只用其非 static、
#   非 transient 字段（默认序列化字段按 static / transient 掩码过滤；computeDefaultSUID 只读名字与修饰符）的调用方。
#   其枚举接收者推不出（类来自流中类名 / 对象的 getClass）时按可序列化字段口径放开（同 deserializers 的字段面），
#   不按全部字段记枚举缺口
serial_enumerators = [
    "java/io/ObjectStreamClass.getDefaultSerialFields:(Ljava/lang/Class;)[Ljava/io/ObjectStreamField;",
    "java/io/ObjectStreamClass.computeDefaultSUID:(Ljava/lang/Class;)J",
]
# instance_field_users：在其内按名 / 枚举取到的字段句柄只用于实例字段（按修饰符滤掉 static）的方法。其取法照常
#   计入字段放开与元数据口径，但不使静态字段可经句柄按名访问（静态字段按名访问表 `__STATICS` 不计）。
#   getDeclaredSerialFields 按 serialPersistentFields 的名字取 Field，只绑定非 static 的同类型字段
instance_field_users = [
    "java/io/ObjectStreamClass.getDeclaredSerialFields:(Ljava/lang/Class;)[Ljava/io/ObjectStreamField;",
]
# static_offset_getters：静态字段基址 / 偏移的全部取法（Field 版与 MemberName 版）。按偏移读的基址若是类镜像，
#   只有这些取法之一可达时才作静态字段基址读所指类的静态字段——否则静态字段偏移无从取得，类镜像基址只读 Class 的实例字段
static_offset_getters = [
    "jdk/internal/misc/Unsafe.staticFieldBase:(Ljava/lang/reflect/Field;)Ljava/lang/Object;",
    "jdk/internal/misc/Unsafe.staticFieldOffset:(Ljava/lang/reflect/Field;)J",
    "sun/misc/Unsafe.staticFieldBase:(Ljava/lang/reflect/Field;)Ljava/lang/Object;",
    "sun/misc/Unsafe.staticFieldOffset:(Ljava/lang/reflect/Field;)J",
    "java/lang/invoke/MethodHandleNatives.staticFieldBase:(Ljava/lang/invoke/MemberName;)Ljava/lang/Object;",
    "java/lang/invoke/MethodHandleNatives.staticFieldOffset:(Ljava/lang/invoke/MemberName;)J",
]

# name_resolvers：按名取字段身份的入口（名字 → 偏移 / setter / VarHandle / 更新器 / 字段句柄）。
#   class = Class 实参形参序号（"receiver" = 接收者本身），name = 字段名形参序号（均不含接收者），
#   handle = true 表示返回字段句柄（只经 handle_writers 写入）；offset = true 表示返回字段偏移（字段身份：
#   类字面量 + 名字常量的调用折叠为符号偏移，供按偏移读写的手写调用点只触及该字段）。名字是常量时按上面的形状规则放开；
#   名字取自形参时按各调用点的常量逐个放开；形参出现过非常量实参、或名字来自字段读 / 调用返回 / 拼接时，
#   放开 class 所指类（类字面量）及其超类的全部字段，推不出类则全部字段不折叠；handle = true 的按字段枚举
#   处理（结果句柄带来源标记，流到句柄写入口才放开）。JDK 内部的 resolveOrFail / MemberName 构造只经下列公开入口取字段
#   写入能力（ClassSpecializer 的 resolveOrFail 取 species 字段的 getter，只读），不在此列
[facts.field_writes.name_resolvers]
