# VM 承载清单：公开 API 中由 VM（手写层）承载、不执行其 Java 体的方法，以及生成器对调用点的特判。
#
# 读取入口：codegen/runtime_manifest.py。内建与「手写覆盖」（FS-H0 审计线，最终态 0）分开计数：
# 内建是最终态的一部分，`[raw-audit] intrinsics=` 单独统计。
#
# 内建准入类别（kind）——每条须写明依据（reason）：
#   exact             精确运算：JDK 源码标注 @IntrinsicCandidate，规范给出唯一结果（IEEE 754 正确舍入 /
#                     精确运算），Rust 原生运算逐位相同
#   class_definition  运行期类定义点：原生二进制无运行期类定义（defineClass / 隐藏类），方法体的唯一
#                     可观察效果是「定义并返回一个类」（或其对偶查询），VM 以类宇宙中的静态类等价承载
#   stack_frame       栈帧查询点：原生二进制无 Java 栈帧，方法体的唯一可观察效果是「按抛出位置作布尔
#                     判定」，VM 的运行期登记与栈帧判定逐例同解
#   bytecode_generator 字节码生成器内部判定：只为「生成的字节码」服务，生成链截断后无语义消费方

[[intrinsic]]
member = "java/lang/StrictMath.sqrt:(D)D"
kind = "exact"
reason = "JLS / StrictMath.sqrt：IEEE 754 squareRoot 正确舍入；f64::sqrt 同为正确舍入"

[[intrinsic]]
member = "java/lang/invoke/ClassSpecializer$Factory.generateConcreteSpeciesCode:(Ljava/lang/String;Ljava/lang/invoke/ClassSpecializer$SpeciesData;)Ljava/lang/Class;"
kind = "class_definition"
reason = "动态物种统一由 VM 支持类 BoundMethodHandle$Species_Dyn 承载（docs/plans/2026-09-27-bmh-dynamic-species.md）"

[[intrinsic]]
member = "jdk/internal/reflect/MethodAccessorGenerator.generateSerializationConstructor:(Ljava/lang/Class;[Ljava/lang/Class;ILjava/lang/Class;)Ljdk/internal/reflect/SerializationConstructorAccessorImpl;"
kind = "class_definition"
reason = "序列化构造器访问器统一由 VM 支持类 SerializationConstructorAccessorDyn 承载（docs/plans/2026-09-27-reflection-metadata-table.md §2.4）"

[[intrinsic]]
member = "java/lang/reflect/Proxy.newProxyInstance:(Ljava/lang/ClassLoader;[Ljava/lang/Class;Ljava/lang/reflect/InvocationHandler;)Ljava/lang/Object;"
kind = "class_definition"
reason = "动态代理类统一由 VM 支持类 Proxy$Dyn 承载（docs/plans/2026-09-27-reflection-metadata-table.md §2.6）"

[[intrinsic]]
member = "java/lang/reflect/Proxy$ProxyBuilder.isProxyClass:(Ljava/lang/Class;)Z"
kind = "class_definition"
reason = "类定义点的对偶查询：代理类即 Proxy$Dyn（不经 defineProxyClass 登记 reverseProxyCache）"

# LambdaForm 编译：JDK 把 LambdaForm 编译为隐藏类字节码（ASM + defineHiddenClass），原生二进制以原生
# LambdaForm 解释器承载全部句柄调用（MH-native，docs/plans/2026-09-26-mh-native.md §二-2）；编译入口
# 返回解释入口 MemberName（HotSpot interpret_<sig> 的等价物，「已就绪」判据）。
[[intrinsic]]
member = "java/lang/invoke/InvokerBytecodeGenerator.generateCustomizedCode:(Ljava/lang/invoke/LambdaForm;Ljava/lang/invoke/MethodType;)Ljava/lang/invoke/MemberName;"
kind = "class_definition"
reason = "生成 LambdaForm 隐藏类 → 解释入口"

[[intrinsic]]
member = "java/lang/invoke/InvokerBytecodeGenerator.generateLambdaFormInterpreterEntryPoint:(Ljava/lang/invoke/MethodType;)Ljava/lang/invoke/MemberName;"
kind = "class_definition"
reason = "生成解释入口隐藏类 → 解释入口"

[[intrinsic]]
member = "java/lang/invoke/InvokerBytecodeGenerator.lookupPregenerated:(Ljava/lang/invoke/LambdaForm;Ljava/lang/invoke/MethodType;)Ljava/lang/invoke/MemberName;"
kind = "class_definition"
reason = "查 jlink 预生成 LambdaForm Holder 类（运行期按名加载）→ null，走解释"

[[intrinsic]]
member = "java/lang/invoke/InvokerBytecodeGenerator.isStaticallyInvocable:([Ljava/lang/invoke/LambdaForm$NamedFunction;)Z"
kind = "bytecode_generator"
reason = "「生成的字节码能否直接 invokestatic 成员」；生成链截断后仅断言消费，解释器对全部成员可调 → 恒 true"

[[intrinsic]]
member = "java/lang/invoke/InvokerBytecodeGenerator.isStaticallyInvocable:(Ljava/lang/invoke/LambdaForm$Name;)Z"
kind = "bytecode_generator"
reason = "同上"

[[intrinsic]]
member = "java/lang/invoke/InvokerBytecodeGenerator.isStaticallyInvocable:(Ljava/lang/invoke/MemberName;)Z"
kind = "bytecode_generator"
reason = "同上"

[[intrinsic]]
member = "jdk/internal/reflect/AccessorUtils.isIllegalArgument:(Ljava/lang/Class;Ljava/lang/RuntimeException;)Z"
kind = "stack_frame"
reason = "栈帧规则「途经 java.base 帧继续、遇用户帧判目标抛出」由 L3 分派登记等价（reflect_dispatch::thrown_by_target：仅经用户成员逃逸者登记）"

# ── @CallerSensitive 注解（binary name）──────────────────────────────────────────────
# 调用标注此注解的方法时，生成器把调用处所在类显式传入运行时（reflect_dispatch::__caller_sensitive），
# Reflection.getCallerClass 据此返回——平台无关、与 JVM 栈帧语义逐点一致（原生二进制无 Java 栈帧可读）。
[caller_sensitive]
annotations = [
    "jdk/internal/reflect/CallerSensitive",
]

# ── 签名多态方法（JVMS §2.9.3）中需要调用点类型的成员：`类.方法` ─────────────────────────
# codegen 对这些调用发射 `recv.<方法>__site("<调用点描述符>", 实参数组)`，手写伴生据调用点 MethodType
# 做类型检查 / 适配（MH-native，docs/plans/2026-09-26-mh-native.md §二-6）：
#   invokeExact：句柄类型 ≠ 调用点类型 → WrongMethodTypeException
#   invoke：     句柄类型 ≠ 调用点类型 → asType(调用点类型) 后调用
[sigpoly]
callsite_typed = [
    "java/lang/invoke/MethodHandle.invokeExact",
    "java/lang/invoke/MethodHandle.invoke",
]

# ── VM 常量（死分支剪除）──────────────────────────────────────────────────────────────
# 手写边界方法在原生二进制中返回恒定值（无启动选项可改变），其守卫的分支静态可判。
# 字节码规范化阶段（codegen/vm_constants.py，classfile 解码后单点执行）剪除恒不执行的分支体：
# 调用链不再经它拉入类，生成代码也不含该分支——与 JVM 在同一配置下的执行路径一致。
#   null_returns   恒返回 null 的方法（`类.方法:描述符`）
#   null_to_false  纯函数：null 实参 → false（JDK 规范语义）
# 识别形态：`<null_returns 调用> [astore k; aload k] ifnull L` 与
#           `<null_returns 调用> [astore k; aload k] <null_to_false 调用> ifeq L`——恒跳转，
#           剪除 (分支, L) 之间的直线段（段内无外部跳入 / 异常表端点时才剪）。
[vm_constants]
null_returns = [
    # VM 保存属性仅来自 -XX: / 归档选项；原生二进制无启动选项（vm_impl.rs getSavedProperty 恒 null）
    "jdk/internal/misc/VM.getSavedProperty:(Ljava/lang/String;)Ljava/lang/String;",
]
null_to_false = [
    "java/lang/Boolean.parseBoolean:(Ljava/lang/String;)Z",
]

# ── VM 事实（闭包分析的常量条件，generator `rava closure` 读取）─────────────────────────
# 手写层承载的方法在原生二进制中返回恒定值；分析器据此做常量传播与死分支剪枝（计划
# docs/plans/2026-09-29-rust-closure-analyzer.md §3.2）。值：null / 整数 / true / false。
# 准入：值由手写实现无条件给出（注明实现位置），与 JVM 缺省配置的可观测行为一致。
# [vm_constants] null_returns 同为事实来源（分析器一并读取）。
[facts]
# 返回值是接收者的浅拷贝（JVMS clone 语义：同类型、数组元素逐个复制）：分析器把接收者的
# 类型集接到返回值，数组副本与原数组共享元素类型节点（替代手写返回的 open(返回类型)）
receiver_returns = [
    "java/lang/Object.clone:()Ljava/lang/Object;",
]

[facts.returns]
# 断言恒关（`-ea` 缺省）：class_impl.rs desiredAssertionStatus0 恒 false；javac 的
# `$assertionsDisabled = !desiredAssertionStatus()` 由此成为常量，assert 语句体整片不可达
"java/lang/Class.desiredAssertionStatus0:(Ljava/lang/Class;)Z" = false
"java/lang/Class.desiredAssertionStatus:()Z" = false

[facts.field_writes]
# 字段常量折叠的反射式写入来源（计划 C1c 第 1 步）。分析器按「全部写入来源」求字段值集，
# 只有一个常量时把读取折叠掉；以下调用可达时相关字段不折叠。
# 按名写入（objectFieldOffset(Class, "名") / findVarHandle / newUpdater / getDeclaredField("名")）
# 按字节码形状识别（同一调用含 Class 实参 / 接收者 + 字符串常量），不在此列。
# enumerators：返回字段句柄数组，经 Field.set* / Unsafe 可写任意字段。接收者是类字面量时
#   只放开该类及其超类的字段，否则全部字段不折叠
enumerators = [
    "java/lang/Class.getDeclaredFields:()[Ljava/lang/reflect/Field;",
    "java/lang/Class.getFields:()[Ljava/lang/reflect/Field;",
]
# deserializers：可达即全部非 static、非 transient 字段不折叠
deserializers = [
    "java/io/ObjectInputStream.readObject:()Ljava/lang/Object;",
    "java/io/ObjectInputStream.readUnshared:()Ljava/lang/Object;",
]

[facts.reflect]
# 反射成员面（闭包分析，generator `rava closure` 读取）。VM 按类镜像构造反射对象、再按反射对象调用其成员；
# 分析器把 Class 值按所指类区分（类字面量、下列 mirror_of_receiver 的逐调用点接收者），以此求反射目标：
#   mirror_of_receiver  返回接收者的类镜像（JLS §4.3.2 getClass）
#   methods / constructors / record_accessors  成员枚举：接收者镜像所指类的声明方法 / 构造器 /
#                       record 组件访问器成为反射对象（class_impl.rs，按 build.rs 元数据表构造）
#   method_lookups      按名查找方法：同一调用里的类字面量 + 方法名常量点名反射目标（字段查找不在此列）
#   method_invokers / constructor_invokers    反射调用：调用反射对象所表示的方法 / 构造器
#                       （NativeAccessor 直接按声明键分派；DirectMethodHandleAccessor 经 MethodHandle.invokeExact）
# 被枚举（用户类）或被按名查找（任意类）、且有对应调用可达的成员入链（形参按声明类型 open，同 VM 入口）；接收者镜像推不出的枚举记为反射缺口
# （closure.json `reflect.gaps`），不做模糊扩展——缺口由清单补种。
mirror_of_receiver = [
    "java/lang/Object.getClass:()Ljava/lang/Class;",
]
methods = [
    "java/lang/Class.getDeclaredMethods0:(Z)[Ljava/lang/reflect/Method;",
]
constructors = [
    "java/lang/Class.getDeclaredConstructors0:(Z)[Ljava/lang/reflect/Constructor;",
]
record_accessors = [
    "java/lang/Class.getRecordComponents0:()[Ljava/lang/reflect/RecordComponent;",
]
method_lookups = [
    "java/lang/Class.getMethod:(Ljava/lang/String;[Ljava/lang/Class;)Ljava/lang/reflect/Method;",
    "java/lang/Class.getDeclaredMethod:(Ljava/lang/String;[Ljava/lang/Class;)Ljava/lang/reflect/Method;",
    "java/lang/invoke/MethodHandles$Lookup.findStatic:(Ljava/lang/Class;Ljava/lang/String;Ljava/lang/invoke/MethodType;)Ljava/lang/invoke/MethodHandle;",
    "java/lang/invoke/MethodHandles$Lookup.findVirtual:(Ljava/lang/Class;Ljava/lang/String;Ljava/lang/invoke/MethodType;)Ljava/lang/invoke/MethodHandle;",
    "java/lang/invoke/MethodHandles$Lookup.findSpecial:(Ljava/lang/Class;Ljava/lang/String;Ljava/lang/invoke/MethodType;Ljava/lang/Class;)Ljava/lang/invoke/MethodHandle;",
    "java/lang/invoke/MethodHandles$Lookup.resolveOrFail:(BLjava/lang/Class;Ljava/lang/String;Ljava/lang/invoke/MethodType;)Ljava/lang/invoke/MemberName;",
    "java/lang/invoke/MethodHandles$Lookup.resolveOrNull:(BLjava/lang/Class;Ljava/lang/String;Ljava/lang/invoke/MethodType;)Ljava/lang/invoke/MemberName;",
]
method_invokers = [
    "jdk/internal/reflect/DirectMethodHandleAccessor$NativeAccessor.invoke0:(Ljava/lang/reflect/Method;Ljava/lang/Object;[Ljava/lang/Object;)Ljava/lang/Object;",
    "jdk/internal/reflect/NativeMethodAccessorImpl.invoke0:(Ljava/lang/reflect/Method;Ljava/lang/Object;[Ljava/lang/Object;)Ljava/lang/Object;",
    "java/lang/invoke/MethodHandle.invokeExact:([Ljava/lang/Object;)Ljava/lang/Object;",
    "java/lang/invoke/MethodHandle.invokeBasic:([Ljava/lang/Object;)Ljava/lang/Object;",
]
constructor_invokers = [
    "jdk/internal/reflect/DirectConstructorHandleAccessor$NativeAccessor.newInstance0:(Ljava/lang/reflect/Constructor;[Ljava/lang/Object;)Ljava/lang/Object;",
    "jdk/internal/reflect/NativeConstructorAccessorImpl.newInstance0:(Ljava/lang/reflect/Constructor;[Ljava/lang/Object;)Ljava/lang/Object;",
    "java/lang/invoke/MethodHandle.invokeExact:([Ljava/lang/Object;)Ljava/lang/Object;",
    "java/lang/invoke/MethodHandle.invokeBasic:([Ljava/lang/Object;)Ljava/lang/Object;",
]

[facts.array_writes]
# 手写方法对实参数组元素的写入（闭包分析，generator `rava closure` 读取）。分析器按调用点把写入值
# 接到该调用点实参数组的元素上；形参序号按描述符（0 起，不含接收者）：
#   dst       被写入元素的数组形参（省略 = 不写任何实参数组）
#   values    写入值取自这些形参的值
#   elements  写入值取自这些形参数组的元素
#   produced  写入值含手写体自身产出的对象
#   fields    dst 为对象（非数组）时写入值落在其引用实例字段上（按偏移写入，偏移只能指向这些位置）
#   last      写入值取自调用点最后一个实参（签名多态方法，实参个数随调用点变化）
# 未列出、且手写体取得数组视图（JArray / __view_into / array_store_*）的方法按保守规则：
# 每个非接收者引用形参都可被写入，来源为其它形参、全部实参数组的元素与手写体产出。
# 准入：JVM 规范 / JDK 文档给出的写入语义，与手写实现一致（注明实现位置）。
# System.arraycopy：dest[destPos..] ← src[srcPos..]（system_impl.rs）
"java/lang/System.arraycopy:(Ljava/lang/Object;ILjava/lang/Object;II)V" = { dst = 2, elements = [0] }
# Unsafe 引用写入：o 为引用元素数组时写入元素（unsafe__impl.rs `_erased_ref_array` 臂），
# 为对象时写入其引用字段（`__unsafe_ref_update` 按字段名匹配）
"jdk/internal/misc/Unsafe.putReference:(Ljava/lang/Object;JLjava/lang/Object;)V" = { dst = 0, values = [2], fields = true }
"jdk/internal/misc/Unsafe.putReferenceVolatile:(Ljava/lang/Object;JLjava/lang/Object;)V" = { dst = 0, values = [2], fields = true }
"jdk/internal/misc/Unsafe.putReferenceOpaque:(Ljava/lang/Object;JLjava/lang/Object;)V" = { dst = 0, values = [2], fields = true }
"jdk/internal/misc/Unsafe.putReferenceRelease:(Ljava/lang/Object;JLjava/lang/Object;)V" = { dst = 0, values = [2], fields = true }
"jdk/internal/misc/Unsafe.getAndSetReference:(Ljava/lang/Object;JLjava/lang/Object;)Ljava/lang/Object;" = { dst = 0, values = [2], fields = true }
"jdk/internal/misc/Unsafe.compareAndSetReference:(Ljava/lang/Object;JLjava/lang/Object;Ljava/lang/Object;)Z" = { dst = 0, values = [3], fields = true }
"jdk/internal/misc/Unsafe.weakCompareAndSetReference:(Ljava/lang/Object;JLjava/lang/Object;Ljava/lang/Object;)Z" = { dst = 0, values = [3], fields = true }
"jdk/internal/misc/Unsafe.compareAndExchangeReference:(Ljava/lang/Object;JLjava/lang/Object;Ljava/lang/Object;)Ljava/lang/Object;" = { dst = 0, values = [3], fields = true }
# VarHandle 引用写入访问模式（签名多态，var_handle_impl.rs → `__unsafe_ref_update` / 数组元素写入）：
# 形参序号按调用点实参；第 0 个坐标是 holder（实例字段 / 数组），写入值是最后一个实参（last）。
# 静态字段句柄没有 holder 坐标：写入值另接到按名打开的静态字段（findStaticVarHandle 等）
"java/lang/invoke/VarHandle.set:([Ljava/lang/Object;)V" = { dst = 0, last = true, fields = true }
"java/lang/invoke/VarHandle.setVolatile:([Ljava/lang/Object;)V" = { dst = 0, last = true, fields = true }
"java/lang/invoke/VarHandle.setOpaque:([Ljava/lang/Object;)V" = { dst = 0, last = true, fields = true }
"java/lang/invoke/VarHandle.setRelease:([Ljava/lang/Object;)V" = { dst = 0, last = true, fields = true }
"java/lang/invoke/VarHandle.compareAndSet:([Ljava/lang/Object;)Z" = { dst = 0, last = true, fields = true }
