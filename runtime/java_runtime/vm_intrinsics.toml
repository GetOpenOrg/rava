    # 新建 HashMap 收集字符串键值，返回其键集的不可变视图
    "java/util/Properties.stringPropertyNames:()Ljava/util/Set;",
]

[facts.system_properties.values]
# U14：java.home 构建期钉值为嵌入虚拟树的根（[concrete.boot] vm_props 同值）
"java.home" = "/java-runtime"
"sun.boot.library.path" = "/java-runtime/lib"
"file.separator" = "/"
"path.separator" = ":"
"java.class.path" = ""
"java.library.path" = ""
"jdk.debug" = "release"
"file.encoding" = "UTF-8"
"stdout.encoding" = "UTF-8"
"stderr.encoding" = "UTF-8"
