[facts.reflect]
# 反射成员面（闭包分析，generator `rava closure` 读取）。VM 按类镜像构造反射对象、再按反射对象调用其成员；
# 分析器把 Class 值按所指类区分（类字面量、下列 mirror_of_receiver 的逐调用点接收者），以此求反射目标：
#   mirror_of_receiver  返回接收者的类镜像（JLS §4.3.2 getClass）
#   superclass_of_receiver  返回接收者镜像所指类的直接超类镜像（接口 / 根类为 null，数组为根类；所指未知仍未知），
#                       逐调用点——getInheritableMethod 的上溯、Enum.getDeclaringClass 由此得到确定值集
#   component_of_receiver  返回接收者镜像所指数组类的元素类型镜像（JVMS §4.3.2，基本类型元素给基本类型类镜像；非数组为 null）
#   primitive_class     返回基本类型（含 void）的类镜像（JLS §15.8.2 `int.class`、`Integer.TYPE`）：所指不是字节码类，
#                       类初始化无对象（JVMS §5.5）、无成员可枚举；与类镜像区分，不使 class_init 记为所指未知
#   caller_class        返回调用它的 @CallerSensitive 方法的调用者类镜像（[caller_sensitive] 注解）：在 CS 方法 M 体内
#                       调用时，值集 = M 各压栈调用边上调用方所在类的镜像（生成器在被调引用解析到 CS 声明的字节码
#                       调用点压入调用方类）；M 另有不压栈的调用边（手写体、lambda / 方法句柄转接等）时再并入全部
#                       压栈调用方类与根类（运行期取外层栈顶或回退）；在非 CS 方法体内调用时所指未知
#                       结果恒非 null（运行期无调用者时回退根类，reflection_impl.rs），分析按非空引用折叠 null 判定
#   methods / constructors / record_accessors  成员枚举：接收者镜像所指类的声明方法 / 构造器 /
#                       record 组件访问器成为反射对象（class_impl.rs，按 build.rs 元数据表构造）
#   method_lookups      按名查找方法：同一调用里的类字面量 + 方法名常量点名反射目标（字段查找不在此列）
#                       调用点上的方法名字面量另对 Class 接收者值集里的类镜像所指类点名（如 `this.getMethod("values")`）；
#                       形参透传的名字不与接收者镜像相乘；接收者所指未知时记为反射缺口
#   method_invokers / constructor_invokers    反射调用：调用反射对象所表示的方法 / 构造器
#                       （NativeAccessor 直接按声明键分派；DirectMethodHandleAccessor 经 MethodHandle.invokeExact）
# 被枚举（用户类）或被按名查找（任意类）、且有对应调用可达的成员入链（方法的形参与接收者取自调用通道的实参池，见 method_to_handle 下注；
# 字段 / 构造器 / 记录访问器仍按声明类型 open，同 VM 入口）；接收者镜像推不出的枚举记为反射缺口
# （closure.json `reflect.gaps`），不做模糊扩展——缺口由清单补种。
mirror_of_receiver = [
    "java/lang/Object.getClass:()Ljava/lang/Class;",
]
superclass_of_receiver = [
    "java/lang/Class.getSuperclass:()Ljava/lang/Class;",
]
component_of_receiver = [
    "java/lang/Class.getComponentType:()Ljava/lang/Class;",
    "java/lang/Class.componentType:()Ljava/lang/Class;",
]
declaring_of_receiver = [
    "java/lang/Class.getDeclaringClass0:()Ljava/lang/Class;",
]
primitive_class = [
    "java/lang/Class.getPrimitiveClass:(Ljava/lang/String;)Ljava/lang/Class;",
]
caller_class = [
    "jdk/internal/reflect/Reflection.getCallerClass:()Ljava/lang/Class;",
]
methods = [
    "java/lang/Class.getDeclaredMethods0:(Z)[Ljava/lang/reflect/Method;",
]
constructors = [
    "java/lang/Class.getDeclaredConstructors0:(Z)[Ljava/lang/reflect/Constructor;",
]
record_accessors = [
    "java/lang/Class.getRecordComponents0:()[Ljava/lang/reflect/RecordComponent;",
]
method_lookups = [
    "java/lang/Class.getMethod:(Ljava/lang/String;[Ljava/lang/Class;)Ljava/lang/reflect/Method;",
    "java/lang/Class.getDeclaredMethod:(Ljava/lang/String;[Ljava/lang/Class;)Ljava/lang/reflect/Method;",
    "java/lang/invoke/MethodHandles$Lookup.findStatic:(Ljava/lang/Class;Ljava/lang/String;Ljava/lang/invoke/MethodType;)Ljava/lang/invoke/MethodHandle;",
    "java/lang/invoke/MethodHandles$Lookup.findVirtual:(Ljava/lang/Class;Ljava/lang/String;Ljava/lang/invoke/MethodType;)Ljava/lang/invoke/MethodHandle;",
    "java/lang/invoke/MethodHandles$Lookup.findSpecial:(Ljava/lang/Class;Ljava/lang/String;Ljava/lang/invoke/MethodType;Ljava/lang/Class;)Ljava/lang/invoke/MethodHandle;",
    "java/lang/invoke/MethodHandles$Lookup.resolveOrFail:(BLjava/lang/Class;Ljava/lang/String;Ljava/lang/invoke/MethodType;)Ljava/lang/invoke/MemberName;",
    "java/lang/invoke/MethodHandles$Lookup.resolveOrNull:(BLjava/lang/Class;Ljava/lang/String;Ljava/lang/invoke/MethodType;)Ljava/lang/invoke/MemberName;",
    # 按名构造方法 MemberName：名字由手写 MethodHandleNatives.resolve 解析（DMH / Invokers 的 LambdaForm 具名函数，
    # 名字经 getNamedFunction 形参传入——分析器取各调用点在该形参上的字符串常量）
    "java/lang/invoke/MemberName.<init>:(Ljava/lang/Class;Ljava/lang/String;Ljava/lang/invoke/MethodType;B)V",
]
# constructor_lookups  构造器查找：Class 实参 / Class 接收者值集里类镜像所指类的构造器成为反射构造目标（构造器没有
#                     按名形状，查找即点名该类构造器）；方法句柄 newInvokeSpecial（DirectMethodHandle 先 allocateInstance
#                     再调 <init>）与 Constructor.newInstance 都经 L3 分派闭包的 <alloc> / <init> 臂执行。
#                     Class.newInstance 即 getDeclaredConstructor().newInstance()（体内经私有 getConstructor0 查找），同口径
constructor_lookups = [
    "java/lang/invoke/MethodHandles$Lookup.findConstructor:(Ljava/lang/Class;Ljava/lang/invoke/MethodType;)Ljava/lang/invoke/MethodHandle;",
    "java/lang/Class.getConstructor:([Ljava/lang/Class;)Ljava/lang/reflect/Constructor;",
    "java/lang/Class.getDeclaredConstructor:([Ljava/lang/Class;)Ljava/lang/reflect/Constructor;",
    "java/lang/Class.newInstance:()Ljava/lang/Object;",
]
# method_to_handle   反射对象（Method）转成方法句柄的入口（`Lookup.unreflect*` 与 LambdaForm 具名函数都经此构造 MemberName）：
#                     按 Method 实参的来源追踪——来自常量名查找（getDeclaredMethod 等）的只点名该方法经方法句柄通道调用，
#                     来自形参的回溯到调用点，来源不明时全部按反射对象查到的方法另接方法句柄通道的实参池（见下）
# 反射方法的形参与接收者取自其调用通道的实参池：反射对象通道 = method_invokers 里带反射对象形参的入口（invoke0）
# 调用点上的接收者与实参数组元素；方法句柄通道 = 签名多态入口（method_invokers / handle_interpreters）调用点上的
# 接收者与全部实参、解释器值池、经该通道调用的成员的返回值。实例方法按池中接收者逐个选中实现、容器对象按接收者克隆上下文
# （池中 open 的接收者退回 VM 枢纽；lambda / 手写对象接收者同 VM 枢纽不建链）。内存效果由 [facts.array_writes] / [facts.memory_reads]
# 声明的成员经方法句柄通道调用时由解释器调用点按 DMH 所指字段建模，不接方法句柄通道的实参池
method_to_handle = [
    "java/lang/invoke/MemberName.<init>:(Ljava/lang/reflect/Method;Z)V",
]
method_invokers = [
    "jdk/internal/reflect/DirectMethodHandleAccessor$NativeAccessor.invoke0:(Ljava/lang/reflect/Method;Ljava/lang/Object;[Ljava/lang/Object;)Ljava/lang/Object;",
    "jdk/internal/reflect/NativeMethodAccessorImpl.invoke0:(Ljava/lang/reflect/Method;Ljava/lang/Object;[Ljava/lang/Object;)Ljava/lang/Object;",
    "java/lang/invoke/MethodHandle.invokeExact:([Ljava/lang/Object;)Ljava/lang/Object;",
    "java/lang/invoke/MethodHandle.invokeBasic:([Ljava/lang/Object;)Ljava/lang/Object;",
]
constructor_invokers = [
    "jdk/internal/reflect/DirectConstructorHandleAccessor$NativeAccessor.newInstance0:(Ljava/lang/reflect/Constructor;[Ljava/lang/Object;)Ljava/lang/Object;",
    "jdk/internal/reflect/NativeConstructorAccessorImpl.newInstance0:(Ljava/lang/reflect/Constructor;[Ljava/lang/Object;)Ljava/lang/Object;",
    "java/lang/invoke/MethodHandle.invokeExact:([Ljava/lang/Object;)Ljava/lang/Object;",
    "java/lang/invoke/MethodHandle.invokeBasic:([Ljava/lang/Object;)Ljava/lang/Object;",
]

# 按类镜像强制类初始化：Class 实参所指类（类字面量 / 值集里的类镜像）按 JVMS §5.5 初始化，其 <clinit> 的写入
# 计入字段值集（SharedSecrets 的 ensureClassInitialized(JarFile.class) 后读 JarFile.<clinit> 写入的访问器字段）。
# JDK 内的按镜像初始化（Lookup.ensureInitialized、DirectMethodHandle / VarHandles 的静态成员句柄）都经此入口
#   ObjectStreamClass.hasStaticInitializer（computeDefaultSUID 调用）：HotSpot 以 JNI GetStaticMethodID 查 `<clinit>`，
#   查找前初始化该类（及超类），手写 native 同样先初始化再答复
class_initializers = [
    "jdk/internal/misc/Unsafe.ensureClassInitialized:(Ljava/lang/Class;)V",
    "java/io/ObjectStreamClass.hasStaticInitializer:(Ljava/lang/Class;)Z",
]
# 类镜像子类型判定：`K.class.isAssignableFrom(x)` 的条件分支成立一侧，x 的类镜像值集收窄为所指类 ⊂ K 者
# （如 ObjectStreamClass.computeDefaultSUID 只对可序列化类走到 hasStaticInitializer 与字段枚举）
mirror_subtype_tests = [
    "java/lang/Class.isAssignableFrom:(Ljava/lang/Class;)Z",
]
# 成员声明类初始化点：下列方法里对 class_initializers 的调用，Class 实参恒为经该路径正被链接 / 访问的成员的声明类。
# handle：DirectMethodHandle 的 getStatic / putStatic / invokeStatic / newInvokeSpecial 句柄、VarHandles 的静态字段句柄；
# reflect：反射访问器工厂的 Method / Constructor / 静态 Field。分析器不按值集（MemberName.clazz 等跨全部成员的汇合）
# 求目标：「静态方法 / 构造器可达、反射暴露的方法、按反射 / 句柄取得的静态字段 ⇒ 声明类初始化」的结构不变量已覆盖；
# 运行期钩子目标取经同一路径链接到的成员声明类（该路径的初始化点可达时才登记）
handle_owner_initializers = [
    "java/lang/invoke/DirectMethodHandle.checkInitialized:(Ljava/lang/invoke/MemberName;)Z",
    "java/lang/invoke/DirectMethodHandle.shouldBeInitialized:(Ljava/lang/invoke/MemberName;)Z",
    "java/lang/invoke/VarHandles.makeFieldHandle:(Ljava/lang/invoke/MemberName;Ljava/lang/Class;Ljava/lang/Class;Z)Ljava/lang/invoke/VarHandle;",
]
reflect_owner_initializers = [
    "jdk/internal/reflect/MethodHandleAccessorFactory.ensureClassInitialized:(Ljava/lang/Class;)V",
    "jdk/internal/reflect/UnsafeFieldAccessorFactory.newFieldAccessor:(Ljava/lang/reflect/Field;Z)Ljdk/internal/reflect/FieldAccessor;",
]

# 按名取类（静态方法，第 0 个实参是 `.` 分隔的类名，返回该类镜像）：名字是字符串常量，或「常量前缀 + 常量表取值」
# 的线性拼接（[facts.string_concat]）时，分析器解析出所指类集，结果只含这些类的镜像；结果唯一地经 instantiators
# 实例化、再唯一地 checkcast 到 T 时只保留 T 的子类型。解析出的类初始化，其构造器随构造器枚举进入反射面
class_lookups = [
    "java/lang/Class.forName:(Ljava/lang/String;)Ljava/lang/Class;",
    "java/lang/Class.forName:(Ljava/lang/String;ZLjava/lang/ClassLoader;)Ljava/lang/Class;",
]
# 名字里推不出的段记为任意串：含任意串的候选按闭包里的类名匹配（运行期按名只取得到生成范围内的类——VM 只登记
# 生成的类，见 class_impl.rs `forName0` / `__is_known_class`），新类进入闭包时站点重跑；整条名字无任何字面量约束时
# 仍按推不出处理。名字是辅助方法的返回值时，虚调用按接收者值集逐个选出实现，各返回值各成一支
# 按名加载（不初始化，返回类镜像或 null）：解析同按名取类，结果只取镜像、不初始化（ClassSpecializer 按物种名
# 加载预生成物种类）
class_loads = [
    "jdk/internal/loader/BootLoader.loadClassOrNull:(Ljava/lang/String;)Ljava/lang/Class;",
]
# 手写类镜像构造（`宿主类.fn 名`，第 0 个实参是 `/` 分隔的 binary name）：手写体里实参为字符串字面量的调用，
# 结果即该字面量所指类的镜像（只取镜像、不初始化）；任一调用的实参不是字面量时，该手写成员按 fn 的一般返回值处理
hw_mirror_by_name = [
    "java/lang/Class.for_class",
]
# 类名取值：返回接收者镜像所指类的 binary name（`.` 分隔，数组为 `[L…;` 描述符形式）/ 简单名（InnerClasses 的
# 内部名，匿名类为空串；数组为元素简单名加 `[]`）。按名取类的拼接段是这些调用的结果时，候选取接收者镜像值集
# 所指各类的名字；接收者含 open / 非镜像 / 基本类型镜像时该段推不出
name_of_receiver = [
    "java/lang/Class.getName:()Ljava/lang/String;",
]
simple_name_of_receiver = [
    "java/lang/Class.getSimpleName:()Ljava/lang/String;",
]
# 实例化：接收者镜像所指类的无参构造
instantiators = [
    "java/lang/Class.newInstance:()Ljava/lang/Object;",
]

# 常量表：基类的具体子类是生成的不可变映射，内容即子类自身代码里的字符串常量；readers 为读取入口（名字:描述符）
# defined_classes：VM 承载的运行期类定义点（[[intrinsic]] class_definition）→ 承载所定义类成员的 VM 支持类。
#   返回值为该支持类的类镜像（运行期返回的是 VM 登记的类，其成员按名路由到支持类的同名声明），
#   随后在其上的按名查找（method_lookups）点名支持类的成员
[facts.reflect.defined_classes]
"java/lang/invoke/MethodHandleImpl$BindCaller.makeInjectedInvoker:(Ljava/lang/Class;)Ljava/lang/Class;" = "java/lang/invoke/InjectedInvokerDyn"
"java/lang/invoke/ClassSpecializer$Factory.generateConcreteSpeciesCode:(Ljava/lang/String;Ljava/lang/invoke/ClassSpecializer$SpeciesData;)Ljava/lang/Class;" = "java/lang/invoke/BoundMethodHandle$Species_Dyn"

# 序列化构造器的生成点（VM 承载为 SerializationConstructorAccessorDyn）→ 分配目标 Class 形参序号（不含接收者）。
# 反序列化不经目标类自身的构造器分配实例（L3 分派闭包的 <alloc> 臂），再在其上运行首个不可序列化超类的无参
# 构造体（<init_on> 臂；与 ReflectionFactory.newConstructorForSerialization 的选择同一结构，可序列化按
# [facts.field_writes] serializable_markers 判定）。分配目标 = 形参值集里镜像所指的可序列化具体类 ∩ 已实例化的类：
# 流中的类由程序自身写出时已实例化；只出现在外部数据里的类同按名取类的未知名字，不在闭包内（值集含 open 时记反射缺口）
[facts.reflect.serial_allocators]
"jdk/internal/reflect/MethodAccessorGenerator.generateSerializationConstructor:(Ljava/lang/Class;[Ljava/lang/Class;ILjava/lang/Class;)Ljdk/internal/reflect/SerializationConstructorAccessorImpl;" = 0

# 按类镜像分配新数组的手写方法 → 元素类型 Class 形参序号（不含接收者）。JLS §15.10.2 / JVMS anewarray：新数组的元素为
# 缺省值 null，数组类型由元素类型镜像决定（Array.newInstance 规范）。分析器按调用点把结果建模为该调用点上按元素类型
# 区分的数组分配点（同字节码 anewarray，元素只来自其后的写入），替代 open(返回类型)——open(Object) 结果的元素读取
# 是 open(Object)，经容器（ArrayList.grow → Arrays.copyOf(T[],int,Class)）流回元素数组后对全部逃逸对象分派。
# 基本类型类镜像给各基本类型数组；所指未知的 Class 与 open 仍给 open(返回类型)。实现：array_impl.rs newArray
[facts.reflect.array_allocators]
"java/lang/reflect/Array.newArray:(Ljava/lang/Class;I)Ljava/lang/Object;" = 0

# 直连反射调用：反射调用入口 → 非 @CallerSensitive 目标的特化入口（VM 支持类 Method$Direct，java_support/）。
# Method.invoke 的体对任意反射对象都要判 isCallerSensitive（解析方法注解）、取访问器、按 CS 与否两路调用访问器；
# 这些分支的取舍取决于运行期的反射对象，分析器无从折叠，使经它的每个调用点都把注解解析与 CS 访问器链带进闭包。
# 分析器把 lookups 所列查找入口的结果建模为携带所指方法的标记（名字 / 查找类 / 形参类型推得出时；形态按返回类型：
# 单个、数组、经 list 模型装入列表），copies 所列复制入口保持标记（复制所指方法不变），标记随字段 / 数组 / 列表
# 流到别处。反射调用点的接收者全是标记、所指方法全非 @CallerSensitive 时，isCallerSensitive 恒为假、访问器恒为
# 本地访问器（jdk.reflect.useNativeAccessorOnly），Method.invoke 的执行即「未 override 时访问检查 + 本地访问器
# invoke0」，与 helper 逐句一致；混入普通 Method 对象即回退。分析器把调用点接到 helper 与各目标（目标入反射分派面，
# 实参取实参数组元素），经 folds `direct_calls` 把调用指令改写为 invokestatic helper（engine/method_marks.rs、
# engine/reflect_direct.rs、input/norm.rs）。典型调用点：Class.getEnumConstantsShared 的 `getMethod("values").invoke(null)`、
# ServiceLoader$ProviderImpl.invokeFactoryMethod（经 JavaLangAccess.getDeclaredPublicMethods 列表与字段）、
# AnnotationInvocationHandler.equalsImpl（getDeclaredMethods 数组经字段）、ObjectStreamClass 的 readObject / writeObject 等
# （按形参名与形参类型数组查找，经字段）。lookups 口径：public = Class.getMethod（公开成员沿超类链与超接口）；
# declared = 只查声明类（getDeclaredMethod / getDeclaredMethods）；declared_public = 只查声明类的公开方法。
# native = helper 体内执行目标调用的 native：直连调用点已逐目标接边，其返回值不按 open 交出、形参值池不按返回类型逃逸
[facts.reflect.direct_invokers."java/lang/reflect/Method.invoke:(Ljava/lang/Object;[Ljava/lang/Object;)Ljava/lang/Object;"]
helper = "java/lang/reflect/Method$Direct.invoke:(Ljava/lang/reflect/Method;Ljava/lang/Object;[Ljava/lang/Object;)Ljava/lang/Object;"
list = "java/lang/reflect/Method$Direct.list:([Ljava/lang/reflect/Method;)Ljava/util/List;"
lookups = { "java/lang/Class.getMethod:(Ljava/lang/String;[Ljava/lang/Class;)Ljava/lang/reflect/Method;" = "public", "java/lang/Class.getDeclaredMethod:(Ljava/lang/String;[Ljava/lang/Class;)Ljava/lang/reflect/Method;" = "declared", "java/lang/Class.getDeclaredMethods:()[Ljava/lang/reflect/Method;" = "declared", "jdk/internal/access/JavaLangAccess.getDeclaredPublicMethods:(Ljava/lang/Class;Ljava/lang/String;[Ljava/lang/Class;)Ljava/util/List;" = "declared_public" }
native = "java/lang/reflect/Method$Direct.invoke0:(Ljava/lang/reflect/Method;Ljava/lang/Object;[Ljava/lang/Object;)Ljava/lang/Object;"
copies = ["jdk/internal/reflect/ReflectionFactory.copyMethod:(Ljava/lang/reflect/Method;)Ljava/lang/reflect/Method;", "jdk/internal/reflect/ReflectionFactory.leafCopyMethod:(Ljava/lang/reflect/Method;)Ljava/lang/reflect/Method;", "java/lang/reflect/Method.copy:()Ljava/lang/reflect/Method;"]

[facts.reflect.constant_tables."sun/util/PreHashedMap"]
readers = ["get:(Ljava/lang/Object;)Ljava/lang/Object;"]

# 值映射：新建即空、writers 按（键, 值）存入、readers 只返回已存入的值或 null 的映射实现类。
# 封存的映射字段（private，静态或实例）：嵌套内每次写字段都是「新建本表 → 无内容构造 → 若干次写入 → putstatic / putfield」
# （或写 null），每次读字段的值只作为 readers / writers / keeps 的接收者，或传给只以其为 readers / keeps 接收者的
# 静态 / 私有辅助方法。映射对象不逃逸，读取结果只能是某次写入的值或 null：候选 = 新建点写入值 ∪ 经读字段写入的值
# （引擎在每个写入点登记值映射槽，写入值为辅助方法形参时沿形参常量集取各调用点实参，engine/sealed.rs、map_slot.rs）。
# 典型：jdk.charsets 扩展提供者的 classMap（TreeMap 实例字段，构造器经 charset(名, 类名, 别名) 以常量实参写入）。
# keeps：不存入新值、不交出已存值的入口（删除 / 判定 / 清空 / 键视图——键视图不支持添加，JDK Map.keySet 规范）；
# empty_ctors：带引用实参、但新建的映射为空的构造器（比较器构造，TreeMap(Comparator) 规范）
[facts.reflect.value_maps]
classes = ["java/util/HashMap", "java/util/concurrent/ConcurrentHashMap", "java/util/TreeMap"]
writers = [
    "put:(Ljava/lang/Object;Ljava/lang/Object;)Ljava/lang/Object;",
    "putIfAbsent:(Ljava/lang/Object;Ljava/lang/Object;)Ljava/lang/Object;",
]
readers = ["get:(Ljava/lang/Object;)Ljava/lang/Object;"]
keeps = [
    "remove:(Ljava/lang/Object;)Ljava/lang/Object;",
    "containsKey:(Ljava/lang/Object;)Z",
    "clear:()V",
    "isEmpty:()Z",
    "size:()I",
    "keySet:()Ljava/util/Set;",
]
empty_ctors = ["<init>:(Ljava/util/Comparator;)V"]

[facts.string_concat]
# 字符串拼接链：新建构建器（可带初始内容）→ 逐段追加（返回接收者本身）→ 取结果。追加可是取结果前的独立语句
# （`sb.append(a).append(b); … sb.toString()`）：每条追加语句在取结果前的每条路径上恰好执行一次、先后确定时按序拼接
