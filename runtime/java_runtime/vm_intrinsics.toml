# SystemProps$Raw.platformProperties：名 = 下标常量 `_<名>_NDX` 的名（下标取参考 JDK 的类文件，21 / 25 不同）；
# 未列出的名为 null。目标平台 Linux：分隔符、字长、字节序为平台常量，其余宿主值延迟
[concrete.boot.platform_props]
file_separator = "/"
path_separator = ":"
sun_arch_data_model = "64"
sun_cpu_endian = "little"
sun_io_unicode_encoding = "UnicodeLittle"
# U1：编码与行分隔符运行期取宿主值
file_encoding = "@deferred"
native_encoding = "@deferred"
sun_jnu_encoding = "@deferred"
stdout_encoding = "@deferred"
stderr_encoding = "@deferred"
stdin_encoding = "@deferred"
line_separator = "@deferred"
# 宿主环境
format_language = "@deferred"
java_io_tmpdir = "@deferred"
os_arch = "@deferred"
os_name = "@deferred"
os_version = "@deferred"
user_dir = "@deferred"
user_home = "@deferred"
user_name = "@deferred"

# 按档位定值的 VM 查询：成员 → 门限（initLevel ≥ 门限为 true；JDK VM.java 的 isBooted / isModuleSystemInited）
