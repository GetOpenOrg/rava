[package]
name = "java_runtime"
version = "0.1.0"
edition = "2021"

[lib]
name = "java_runtime"
path = "src/lib.rs"

[features]
# 并行后端（#42 最终态）：Arc 对象模型 + 原子字段单元 + 读写锁引用槽，去 GIL。
mt = []

[dependencies]
parking_lot = "0.12"
java_rta_macros = { path = "../java_rta_macros" }

[lints.rust]
# 生成代码的固有形态不做告警（括号防御性包裹 / 未触达存根 / JVM 槽位复用赋值 /
# Java 命名）。手写层开发期需要诊断时，临时注释本表即可。
unused_parens = "allow"
unused_braces = "allow"
dead_code = "allow"
unused_assignments = "allow"
unused_variables = "allow"
unused_mut = "allow"
unused_imports = "allow"
non_snake_case = "allow"
non_camel_case_types = "allow"
non_upper_case_globals = "allow"
unreachable_code = "allow"
unreachable_patterns = "allow"
