# 入链种子清单：无静态调用边、由生成器按「触发成员 + 结构证据」补入闭包的类 / 成员，以及 VM
# 引导期初始化。
#
# 读取入口：generator/crates/closure/src/seeds.rs（原则 4：类名只在本清单出现）。
# 公共写法：成员引用 `类.成员`（触发）或 `类.成员:描述符`（精确方法）；类为斜线形态 binary name。

# ── 注解类型种子（FS-R R4b，docs/plans/2026-09-27-reflection-metadata-table.md §2.6）──────────
# 注解实例由 JDK AnnotationParser 按原始字节解析：注解类型（AnnotationType 反射其方法 = 元素）、
# 元注解（Retention / Inherited）与枚举 / Class 元素类型只出现在注解属性体里，无静态调用边。
# triggers 中任一成员在调用链上时（注解解析入口被触达），生成器按用户类的 RuntimeVisibleAnnotations
# 传递收集这些类型入闭包：注解类型的方法入链（方法表 = 元素面），枚举元素类型的 <clinit> 入链并
# 登记类初始化钩子（Enum.valueOf → 常量目录）。seeds 为触发后一并入链的成员（手写层经其转发、
# 无字节码调用边）。
[annotation]
triggers = [
    "java/lang/Class.getRawAnnotations",
    "jdk/internal/access/JavaLangAccess.getConstantPool",
]
seeds = [
    "java/lang/Class.getDeclaredAnnotationMap:()Ljava/util/Map;",
]

# ── Locale 种子（L-1 L1-b，docs/plans/2026-09-25-l1-cldr-locale-data.md §3.2）─────────────
# 资源束经类名反射装载、无静态调用边，入选 locale 由用户字节码中「静态可见」的 locale 引用推出：
#   consts    该类的 static 自类型常量字段（getstatic）→ 沿 <clinit> 溯源到字符串字面量（语言, 地区, 变体）
#   factories 实参全为字符串字面量的调用 → (语言, 地区, 变体)
#   tags      实参为字符串字面量的 BCP 47 语言标签
#   bundles   每个入选 locale 需要的资源束族（CLDR），候选类 <包>/<基名>_<locale> 与 <包>/ext/<基名>_<locale>
#             （类路径上存在者入链：无参构造器 + 反射分派面，按字节码翻译）；
#             条目为字符串（受下方全局 triggers 控制）或 { base, triggers }（族自带触发成员）
#   triggers  调用链触达该成员（本地化数据的消费入口）才入选资源束——不消费本地化数据的程序
#             不付束翻译的代码税
[locale]
consts = [
    "java/util/Locale",
]
factories = [
    "java/util/Locale.of:(Ljava/lang/String;)Ljava/util/Locale;",
    "java/util/Locale.of:(Ljava/lang/String;Ljava/lang/String;)Ljava/util/Locale;",
    "java/util/Locale.of:(Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;)Ljava/util/Locale;",
    "java/util/Locale.<init>:(Ljava/lang/String;)V",
    "java/util/Locale.<init>:(Ljava/lang/String;Ljava/lang/String;)V",
    "java/util/Locale.<init>:(Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;)V",
]
tags = [
    "java/util/Locale.forLanguageTag:(Ljava/lang/String;)Ljava/util/Locale;",
]
# 束族与 LocaleData 访问器一一对应：`LocaleData.getXxx` 按 `Type.get{Text,Util}ResourcesPackage() + ".Xxx"`
# 取束，CLDR 适配器取 `.../cldr` 包、JRE（FALLBACK）适配器取上一级包；java.time 文本与 DateFormatSymbols
# 经 FALLBACK 适配器补缺，JDK 同时装载两族（`-Xlog:class+load` 实测 DateTimeFormatter 用例装载
# cldr/FormatData、FormatData、JavaTimeSupplementary 及其 _en）。族的触发成员取对应访问器，访问器不可达不付代码税
bundles = [
    "sun/text/resources/cldr/FormatData",
    "sun/text/resources/FormatData",
    # JRE FormatData 是 ParallelListResourceBundle：LocaleResources.getJavaTimeFormatData 经
    # LocaleData.setSupplementary 并入 JavaTimeSupplementary 族
    { base = "sun/text/resources/JavaTimeSupplementary", triggers = [
        "sun/util/resources/LocaleData.setSupplementary",
    ] },
    # 货币名 / 符号（L-2）：族自带触发成员——只有货币符号查询触达时才入选，数字格式用例不付
    # CurrencyNames（ROOT 束约 300 种货币）的代码税
    { base = "sun/util/resources/cldr/CurrencyNames", triggers = [
        "sun/util/locale/provider/LocaleResources.getCurrencyName",
        "sun/util/resources/LocaleData.getCurrencyNames",
    ] },
    { base = "sun/util/resources/CurrencyNames", triggers = [
        "sun/util/resources/LocaleData.getCurrencyNames",
    ] },
    { base = "sun/util/resources/cldr/TimeZoneNames", triggers = [
        "sun/util/resources/LocaleData.getTimeZoneNames",
    ] },
    { base = "sun/util/resources/TimeZoneNames", triggers = [
        "sun/util/resources/LocaleData.getTimeZoneNames",
    ] },
    { base = "sun/util/resources/cldr/LocaleNames", triggers = [
        "sun/util/resources/LocaleData.getLocaleNames",
    ] },
    { base = "sun/util/resources/LocaleNames", triggers = [
        "sun/util/resources/LocaleData.getLocaleNames",
    ] },
    { base = "sun/util/resources/cldr/CalendarData", triggers = [
        "sun/util/resources/LocaleData.getCalendarData",
    ] },
    { base = "sun/util/resources/CalendarData", triggers = [
        "sun/util/resources/LocaleData.getCalendarData",
    ] },
    { base = "sun/text/resources/BreakIteratorInfo", triggers = [
        "sun/util/resources/LocaleData.getBreakIteratorInfo",
    ] },
    { base = "sun/text/resources/BreakIteratorResources", triggers = [
        "sun/util/resources/LocaleData.getBreakIteratorResources",
    ] },
    { base = "sun/text/resources/CollationData", triggers = [
        "sun/util/resources/LocaleData.getCollationData",
    ] },
]
triggers = [
    "sun/util/locale/provider/LocaleResources.getDecimalFormatSymbolsData",
    "sun/util/locale/provider/LocaleResources.getNumberPatterns",
    # DateFormatSymbols.initializeData → LocaleData.getDateFormatData（月名 / 星期名，FormatData 束）
    "sun/util/resources/LocaleData.getDateFormatData",
    "sun/util/resources/LocaleData.getNumberFormatData",
]

# ── JCA 服务注册（K-JCA，docs/plans/2026-09-25-jca-service-registry.md）────────────────────
#   providers        name = provider 名；class = 注册类（全部方法字节码中 `ldc 类型; ldc 算法;
#                    ldc 实现类名` 三连常量即一条服务，SunJCE.ps / SunEntries.add 同形态）；
#                    provider = Provider 子类（JDK ProviderConfig 对内建 provider 直接 `new`：
#                    服务查找时按需构造一次，服务描述 / 属性 / newInstance 全走翻译字节码）；注册类有成员
#                    在调用链上（provider 已构造）其服务才计入。只登记经 Provider$Service.newInstance 按类名
#                    反射构造实现类的 provider；自带 Service 子类按算法直接 `new` 的（SunEC / SunJGSS 等）走字节码
#   triggers         调用链触达该成员（JCA 服务查找入口）才补种服务实现类；被请求的算法名 = 链上（用户与 JDK）
#                    `<engine>.getInstance(算法, ..)` 调用点算法实参按值流求得的全部名字（字面量、形参 / String
#                    字段槽：HmacCore 构造器把子类给的摘要算法名传给 MessageDigest.getInstance 即属此类）；
#                    推不出的调用点使该服务类型全部算法入选
#   defaults         算法名由 JDK 运行期配置得出、不出现在任何字符串常量中的缺省服务：触发成员在
#                    调用链上即入选（`类型.算法`）
#   instantiation_hosts  服务实现类的反射构造点（`类.名字:描述符`）：其中按名取类的所指类就是本规则补种的服务实现类，
#                    站点按推不出处理、不按类名字段的字符串集解析——否则注册表里全部算法的实现类都按名入链
#                    （JCA / SSL 提供者实现约千类），而被请求的算法才有可达证据
#   alias_sources    算法同义名源（类初始化器中每个构造调用的字符串实参组 = 一组同义名）：用户写
#                    别名（"SHA" / "SHA1"）时按标准名（"SHA-1"）入选服务
[jca]
providers = [
    { name = "SUN", class = "sun/security/provider/SunEntries", provider = "sun/security/provider/Sun" },
    { name = "SunJCE", class = "com/sun/crypto/provider/SunJCE", provider = "com/sun/crypto/provider/SunJCE" },
    { name = "SunRsaSign", class = "sun/security/rsa/SunRsaSignEntries", provider = "sun/security/rsa/SunRsaSign" },
    { name = "SunJSSE", class = "sun/security/ssl/SunJSSE", provider = "sun/security/ssl/SunJSSE" },
]
defaults = [
    # SecureRandom 缺省 PRNG：SunEntries.DEF_SECURE_RANDOM_ALGO 由 securerandom.source（JDK 默认
    # file:/dev/random）与 NativePRNG.isAvailable() 运行期得出——Linux 上即 NativePRNG
    { trigger = "java/security/SecureRandom.getDefaultPRNG", service = "SecureRandom.NativePRNG" },
]
alias_sources = [
    "sun/security/util/KnownOIDs",
]
instantiation_hosts = [
    "java/security/Provider$Service.getImplClass:()Ljava/lang/Class;",
]
triggers = [
    "sun/security/jca/GetInstance.getInstance",
    "sun/security/jca/GetInstance.getServices",
    "sun/security/jca/GetInstance.getService",
]

# ── 服务目录（ServiceLoader，模块 provides / 类路径 META-INF/services 作事实）─────────────────────
# provider 由 ServiceLoader 按服务目录反射构造（Class.forName + 无参构造器 / provider()），无静态调用边。
# 目录由分析器从所用 JDK 的 jmod 模块描述符（JVM 默认引导层：API 根集 + requires 闭包 + uses 绑定）与
# 用户 / 库档案的 META-INF/services 得出，不在此登记类名；入选服务与 provider 导出为 closure.json
# seeds.services（运行期 build.rs 按它装填引导服务目录，见 boundary-narrowing §6.11 项 5 / 决策 4）。
#   lookups     服务查找入口 → 服务 Class 形参序号（不含接收者，0 起）：该实参值集里的类镜像即被查找的服务
#   population  模块服务目录的装填入口：有模块 provider 入选时作根（引导期按事实逐条调用）
[services]
population = [
    "jdk/internal/module/ServicesCatalog.create:()Ljdk/internal/module/ServicesCatalog;",
    "jdk/internal/module/ServicesCatalog.addProvider:(Ljava/lang/Module;Ljava/lang/Class;Ljava/lang/Class;)V",
]
[services.lookups]
"java/util/ServiceLoader.<init>:(Ljava/lang/Class;Ljava/lang/ModuleLayer;Ljava/lang/Class;)V" = 2
"java/util/ServiceLoader.<init>:(Ljava/lang/Class;Ljava/lang/Class;Ljava/lang/ClassLoader;)V" = 1
"java/util/ServiceLoader.<init>:(Ljava/lang/Module;Ljava/lang/Class;Ljava/lang/ClassLoader;)V" = 1

# ── VM 引导期类初始化（HotSpot 在执行应用代码前完成初始化的类，initPhase1 等）───────────────
# 生成项目 main 启动时按本表顺序初始化其中「在闭包内翻译在场」的类（runtime vm_boot_init）。
# 准入：JDK 代码显式依赖「该类已在引导期初始化」的时序（惰性初始化下会重入读到未就绪状态）。
[boot_init]
classes = [
    # JDK 注释 "AccessibleObject is initialized early in initPhase1"：<clinit> 登记 ReflectAccess 并
    # 缓存 ReflectionFactory 单例；由 ReflectionFactory.<clinit> 反向触发时 GetReflectionFactoryAction
    # 重入读到 null。
    "java/lang/reflect/AccessibleObject",
]
# VM 启动期调用的静态方法（无参 `()V`，按序在 classes 之前执行）：HotSpot 由 initPhase1 在任何应用代码
# 之前完成的全局登记。准入：VM 发起的启动入口（docs/reference/handwritten-boundary.md 准入 ③）——
# 由闭包分析器作为根入链、生成项目 main 启动时调用（runtime vm_boot_init）。
calls = [
    # initPhase1 的 setJavaLangAccess()：SharedSecrets.setJavaLangAccess(new System$2)——JavaLangAccess
    # 无惰性初始化路径（SharedSecrets.getJavaLangAccess 直接返回静态字段），缺席即 null。
    "java/lang/System.setJavaLangAccess:()V",
]

# VM 引导阶段（HotSpot call_initPhase2 / call_initPhase3，准入 ③ VM 发起的启动入口）：VM 以常量实参调用的静态方法，
# 按序在 calls / classes 之后、main 之前执行。args：实参常量（个数与描述符一致，只限 Z/B/C/S/I）；分析器以此作入口
# 形参常量，与 VM 调用一致。anchors：阶段写入、此后由 Java 代码读取的 VM 状态字段（`类.字段:描述符`）——闭包内
# 任一锚点有读取点时阶段作根并在启动时执行，否则不入链、不执行。返回整数的阶段非 0 即启动失败（退出码 1）。
[[boot_init.phases]]
# initPhase2：模块系统引导（ModuleBootstrap.boot → 引导层）。实参为 HotSpot 缺省的 DisplayVMOutputToStderr、
# 引导日志开关（均为 false）。锚点暂空：引导层落地（docs/plans/2026-10-02-boot-layer.md 第 2–3 步：Class.module
# 钩子、Module / ModuleLayer 回到字节码）之前不作根；届时填 System.bootLayer 与 Class.module
call = "java/lang/System.initPhase2:(ZZ)I"
args = [false, false]
anchors = []

# ── 模块资源（jmod 内的非类数据文件）不在此登记：生成器由调用链上方法体的 ldc 资源名推导
# （`generator/crates/input/src/resources.rs`），以 include_bytes! 嵌入，运行时由 ClassLoader 的资源查询承载。
