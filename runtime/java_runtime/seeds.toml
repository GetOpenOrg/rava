# 入链种子清单：无静态调用边、由生成器按「触发成员 + 结构证据」补入闭包的类 / 成员，以及 VM
# 引导期初始化。
#
# 读取入口：generator/crates/closure/src/seeds.rs（原则 4：类名只在本清单出现）。
# 公共写法：成员引用 `类.成员`（触发）或 `类.成员:描述符`（精确方法）；类为斜线形态 binary name。

# ── 注解类型种子（FS-R R4b，docs/plans/2026-09-27-reflection-metadata-table.md §2.6）──────────
# 注解实例由 JDK AnnotationParser 按原始字节解析：注解类型（AnnotationType 反射其方法 = 元素）、
# 元注解（Retention / Inherited）与枚举 / Class 元素类型只出现在注解属性体里，无静态调用边。
# triggers 中任一成员在调用链上时（注解解析入口被触达），生成器按用户类的 RuntimeVisibleAnnotations
# 传递收集这些类型入闭包：注解类型的方法入链（方法表 = 元素面），枚举元素类型的 <clinit> 入链并
# 登记类初始化钩子（Enum.valueOf → 常量目录）。seeds 为触发后一并入链的成员（手写层经其转发、
# 无字节码调用边）。
[annotation]
triggers = [
    "java/lang/Class.getRawAnnotations",
    "jdk/internal/access/JavaLangAccess.getConstantPool",
]
seeds = [
    "java/lang/Class.getDeclaredAnnotationMap:()Ljava/util/Map;",
]

# ── Locale 种子（L-1 L1-b，docs/plans/2026-09-25-l1-cldr-locale-data.md §3.2）─────────────
# 资源束经类名反射装载、无静态调用边，入选 locale 由用户字节码中「静态可见」的 locale 引用推出：
#   consts    该类的 static 自类型常量字段（getstatic）→ 沿 <clinit> 溯源到字符串字面量（语言, 地区, 变体）
#   factories 实参全为字符串字面量的调用 → (语言, 地区, 变体)
#   tags      实参为字符串字面量的 BCP 47 语言标签
#   bundles   每个入选 locale 需要的资源束族（CLDR），候选类 <包>/<基名>_<locale> 与 <包>/ext/<基名>_<locale>
#             （类路径上存在者入链：无参构造器 + 反射分派面，按字节码翻译）；
#             条目为字符串（受下方全局 triggers 控制）或 { base, triggers }（族自带触发成员）
#   triggers  调用链触达该成员（本地化数据的消费入口）才入选资源束——不消费本地化数据的程序
#             不付束翻译的代码税
[locale]
consts = [
    "java/util/Locale",
]
factories = [
    "java/util/Locale.of:(Ljava/lang/String;)Ljava/util/Locale;",
    "java/util/Locale.of:(Ljava/lang/String;Ljava/lang/String;)Ljava/util/Locale;",
    "java/util/Locale.of:(Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;)Ljava/util/Locale;",
    "java/util/Locale.<init>:(Ljava/lang/String;)V",
    "java/util/Locale.<init>:(Ljava/lang/String;Ljava/lang/String;)V",
    "java/util/Locale.<init>:(Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;)V",
]
tags = [
    "java/util/Locale.forLanguageTag:(Ljava/lang/String;)Ljava/util/Locale;",
]
# 束族与 LocaleData 访问器一一对应：`LocaleData.getXxx` 按 `Type.get{Text,Util}ResourcesPackage() + ".Xxx"`
# 取束，CLDR 适配器取 `.../cldr` 包、JRE（FALLBACK）适配器取上一级包；java.time 文本与 DateFormatSymbols
# 经 FALLBACK 适配器补缺，JDK 同时装载两族（`-Xlog:class+load` 实测 DateTimeFormatter 用例装载
# cldr/FormatData、FormatData、JavaTimeSupplementary 及其 _en）。族的触发成员取对应访问器，访问器不可达不付代码税
bundles = [
    "sun/text/resources/cldr/FormatData",
    "sun/text/resources/FormatData",
    # JRE FormatData 是 ParallelListResourceBundle：LocaleResources.getJavaTimeFormatData 经
    # LocaleData.setSupplementary 并入 JavaTimeSupplementary 族
    { base = "sun/text/resources/JavaTimeSupplementary", triggers = [
        "sun/util/resources/LocaleData.setSupplementary",
    ] },
    # 货币名 / 符号（L-2）：族自带触发成员——只有货币符号查询触达时才入选，数字格式用例不付
    # CurrencyNames（ROOT 束约 300 种货币）的代码税
    { base = "sun/util/resources/cldr/CurrencyNames", triggers = [
        "sun/util/locale/provider/LocaleResources.getCurrencyName",
        "sun/util/resources/LocaleData.getCurrencyNames",
    ] },
    { base = "sun/util/resources/CurrencyNames", triggers = [
        "sun/util/resources/LocaleData.getCurrencyNames",
    ] },
    { base = "sun/util/resources/cldr/TimeZoneNames", triggers = [
        "sun/util/resources/LocaleData.getTimeZoneNames",
    ] },
    { base = "sun/util/resources/TimeZoneNames", triggers = [
        "sun/util/resources/LocaleData.getTimeZoneNames",
    ] },
    { base = "sun/util/resources/cldr/LocaleNames", triggers = [
        "sun/util/resources/LocaleData.getLocaleNames",
    ] },
    { base = "sun/util/resources/LocaleNames", triggers = [
        "sun/util/resources/LocaleData.getLocaleNames",
    ] },
    { base = "sun/util/resources/cldr/CalendarData", triggers = [
        "sun/util/resources/LocaleData.getCalendarData",
    ] },
    { base = "sun/util/resources/CalendarData", triggers = [
        "sun/util/resources/LocaleData.getCalendarData",
    ] },
    { base = "sun/text/resources/BreakIteratorInfo", triggers = [
        "sun/util/resources/LocaleData.getBreakIteratorInfo",
    ] },
    { base = "sun/text/resources/BreakIteratorResources", triggers = [
        "sun/util/resources/LocaleData.getBreakIteratorResources",
    ] },
    { base = "sun/text/resources/CollationData", triggers = [
        "sun/util/resources/LocaleData.getCollationData",
    ] },
]
triggers = [
    "sun/util/locale/provider/LocaleResources.getDecimalFormatSymbolsData",
    "sun/util/locale/provider/LocaleResources.getNumberPatterns",
    # DateFormatSymbols.initializeData → LocaleData.getDateFormatData（月名 / 星期名，FormatData 束）
    "sun/util/resources/LocaleData.getDateFormatData",
    "sun/util/resources/LocaleData.getNumberFormatData",
]

# ── JCA 服务注册（K-JCA，docs/plans/2026-09-25-jca-service-registry.md）────────────────────
#   providers        name = provider 名；class = 注册类（全部方法字节码中 `ldc 类型; ldc 算法;
#                    ldc 实现类名` 三连常量即一条服务，SunJCE.ps / SunEntries.add 同形态）；
#                    provider = Provider 子类（JDK ProviderConfig 对内建 provider 直接 `new`：
#                    服务查找时按需构造一次，服务描述 / 属性 / newInstance 全走翻译字节码）；注册类有成员
#                    在调用链上（provider 已构造）其服务才计入。只登记经 Provider$Service.newInstance 按类名
#                    反射构造实现类的 provider；自带 Service 子类按算法直接 `new` 的（SunEC / SunJGSS 等）走字节码
#   triggers         调用链触达该成员（JCA 服务查找入口）才补种服务实现类；被请求的算法名 = 链上（用户与 JDK）
#                    `<engine>.getInstance(算法, ..)` 调用点算法实参按值流求得的全部名字（字面量、形参 / String
#                    字段槽：HmacCore 构造器把子类给的摘要算法名传给 MessageDigest.getInstance 即属此类）；
#                    推不出的调用点使该服务类型全部算法入选
#   defaults         算法名由 JDK 运行期配置得出、不出现在任何字符串常量中的缺省服务：触发成员在
#                    调用链上即入选（`类型.算法`）
#   instantiation_hosts  服务实现类的反射构造点（`类.名字:描述符`）：其中按名取类的所指类就是本规则补种的服务实现类，
#                    站点按推不出处理、不按类名字段的字符串集解析——否则注册表里全部算法的实现类都按名入链
#                    （JCA / SSL 提供者实现约千类），而被请求的算法才有可达证据
#   alias_sources    算法同义名源（类初始化器中每个构造调用的字符串实参组 = 一组同义名）：用户写
#                    别名（"SHA" / "SHA1"）时按标准名（"SHA-1"）入选服务
[jca]
providers = [
    { name = "SUN", class = "sun/security/provider/SunEntries", provider = "sun/security/provider/Sun" },
    { name = "SunJCE", class = "com/sun/crypto/provider/SunJCE", provider = "com/sun/crypto/provider/SunJCE" },
    { name = "SunRsaSign", class = "sun/security/rsa/SunRsaSignEntries", provider = "sun/security/rsa/SunRsaSign" },
    { name = "SunJSSE", class = "sun/security/ssl/SunJSSE", provider = "sun/security/ssl/SunJSSE" },
]
defaults = [
    # SecureRandom 缺省 PRNG：SunEntries.DEF_SECURE_RANDOM_ALGO 由 securerandom.source（JDK 默认
    # file:/dev/random）与 NativePRNG.isAvailable() 运行期得出——Linux 上即 NativePRNG
    { trigger = "java/security/SecureRandom.getDefaultPRNG", service = "SecureRandom.NativePRNG" },
]
alias_sources = [
    "sun/security/util/KnownOIDs",
]
instantiation_hosts = [
    "java/security/Provider$Service.getImplClass:()Ljava/lang/Class;",
]
triggers = [
    "sun/security/jca/GetInstance.getInstance",
    "sun/security/jca/GetInstance.getServices",
    "sun/security/jca/GetInstance.getService",
]

# ── JCA 提供者序求值（docs/plans/2026-10-06-c1d-jca-provider-order.md）──────────────────────────────
# 运行期提供者表 = 嵌入的 java.security 生效属性里 `security.provider.N` 按 N 的有序名单；表上逐项装载：
# 内建名字由 ProviderConfig 直接 `new`，其余经装载器（ServiceLoader 遍历全部 Provider 实现并逐个构造）。
# 游走按序、命中即停：可证游走深度都小于首个非内建表项时，装载器调用点不放行（其后的全部 Provider 实现
# 不入链）；任一前提推不出即在不动点上放行（保守回到原结果）。
#   table / table_key      提供者表来源（相对本目录；{jdk} = 参考 JDK 主版本）与表键前缀
#   preferred_key          偏好序属性（设了即 ProviderList.getService 先走偏好表）：表中出现或可被改写即放行
#   override_property      附加属性文件的系统属性（Security 初始化时读取）：系统属性推不出 / 该键可被改写即放行
#   builtin                按 JDK 主版本：ProviderConfig 按名直接构造的 provider 名
#   loader                 装载器调用点的被调成员：闸门所在
#   interior               游走内部类（类名或其嵌套类）：沿调用方上溯；越出到非内部、非入口方法即放行
#   views                  惰性视图类（对象只经 producers 返回、在入口内就地消费）：视图方法改从生产者上溯
#   entries                外部入口（实参序号含接收者）：walk = first（按序取首个提供 类型/算法 的 provider，
#                          failover = 首个服务构造失败时改走全表）/ name（按名定位：name 实参或 literal 常量）
#   mutators               改写提供者表 / 偏好表的入口：无 key 即可达放行；有 key（属性键实参序号）时键推不出、
#                          以 table_key 开头或等于 preferred_key 才放行
#   total_types            首个服务构造不会失败的服务类型（first 的 failover 不发生）
#   registrations          内建 provider 构造时必定执行的注册体；plain / aliased = 注册调用（aliased 另登记
#                          [jca] alias_sources 里的同义名）；只取无条件执行的 `ldc 类型; ldc 算法; ldc 类名` 注册
[jca.order]
table = "src/jdk_resources/java.security.{jdk}.properties"
table_key = "security.provider."
preferred_key = "jdk.security.provider.preferred"
override_property = "java.security.properties"
loader = "sun/security/jca/ProviderConfig.doLoadProvider:()Ljava/security/Provider;"
interior = ["sun/security/jca/ProviderList", "sun/security/jca/ProviderConfig"]
total_types = ["MessageDigest"]
plain = [
    "sun/security/provider/SunEntries.add:(Ljava/security/Provider;Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;)V",
    "sun/security/provider/SunEntries.add:(Ljava/security/Provider;Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;Ljava/util/HashMap;)V",
    "sun/security/rsa/SunRsaSignEntries.add:(Ljava/security/Provider;Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;Ljava/util/List;Ljava/util/HashMap;)V",
    "com/sun/crypto/provider/SunJCE.ps:(Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;)V",
    "com/sun/crypto/provider/SunJCE.ps:(Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;Ljava/util/List;Ljava/util/HashMap;)V",
]
aliased = [
    "sun/security/provider/SunEntries.addWithAlias:(Ljava/security/Provider;Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;Ljava/util/HashMap;)V",
    "sun/security/rsa/SunRsaSignEntries.addA:(Ljava/security/Provider;Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;Ljava/util/HashMap;)V",
    "com/sun/crypto/provider/SunJCE.psA:(Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;Ljava/util/HashMap;)V",
]
registrations = [
    { provider = "SUN", body = "sun/security/provider/SunEntries.<init>:(Ljava/security/Provider;)V" },
    { provider = "SunRsaSign", body = "sun/security/rsa/SunRsaSignEntries.<init>:(Ljava/security/Provider;)V" },
    { provider = "SunJCE", body = "com/sun/crypto/provider/SunJCE.putEntries:()V" },
]
entries = [
    { member = "sun/security/jca/GetInstance.getInstance:(Ljava/lang/String;Ljava/lang/Class;Ljava/lang/String;)Lsun/security/jca/GetInstance$Instance;", walk = "first", type = 0, algorithm = 2, failover = true },
    { member = "sun/security/jca/GetInstance.getService:(Ljava/lang/String;Ljava/lang/String;)Ljava/security/Provider$Service;", walk = "first", type = 0, algorithm = 1, failover = false },
    { member = "sun/security/jca/GetInstance.getService:(Ljava/lang/String;Ljava/lang/String;Ljava/lang/String;)Ljava/security/Provider$Service;", walk = "name", name = 2 },
    { member = "java/security/Security.getProvider:(Ljava/lang/String;)Ljava/security/Provider;", walk = "name", name = 0 },
    # 缺省 PRNG：按序取首个名为 SUN（表首）或自带缺省 SecureRandom 的 provider
    { member = "java/security/SecureRandom.getDefaultPRNG:(Z[B)V", walk = "name", literal = "SUN" },
]
mutators = [
    { member = "java/security/Security.setProperty:(Ljava/lang/String;Ljava/lang/String;)V", key = 0 },
    { member = "sun/security/jca/Providers.setSystemProviderList:(Lsun/security/jca/ProviderList;)V" },
    { member = "sun/security/jca/Providers.changeThreadProviderList:(Lsun/security/jca/ProviderList;)V" },
    { member = "sun/security/jca/Providers.beginThreadProviderList:(Lsun/security/jca/ProviderList;)Lsun/security/jca/ProviderList;" },
]

[jca.order.builtin]
"21" = ["SUN", "SunRsaSign", "SunJCE", "SunJSSE"]
"25" = ["SUN", "SunRsaSign", "SunEC", "SunJSSE", "SunJCE"]

[jca.order.views]
"21" = [
    { class = "sun/security/jca/ProviderList$3", producers = ["sun/security/jca/ProviderList.providers:()Ljava/util/List;"] },
    { class = "sun/security/jca/ProviderList$ServiceList", producers = [
        "sun/security/jca/ProviderList.getServices:(Ljava/lang/String;Ljava/lang/String;)Ljava/util/List;",
        "sun/security/jca/ProviderList.getServices:(Ljava/lang/String;Ljava/util/List;)Ljava/util/List;",
        "sun/security/jca/ProviderList.getServices:(Ljava/util/List;)Ljava/util/List;",
    ] },
]
"25" = [
    { class = "sun/security/jca/ProviderList$2", producers = ["sun/security/jca/ProviderList.providers:()Ljava/util/List;"] },
    { class = "sun/security/jca/ProviderList$ServiceIterator", producers = [
        "sun/security/jca/ProviderList.getServices:(Ljava/lang/String;Ljava/lang/String;)Ljava/util/Iterator;",
        "sun/security/jca/ProviderList.getServices:(Ljava/util/List;)Ljava/util/Iterator;",
    ] },
]

# ── 服务目录（ServiceLoader，模块 provides / 类路径 META-INF/services 作事实）─────────────────────
# provider 由 ServiceLoader 按服务目录反射构造（Class.forName + 无参构造器 / provider()），无静态调用边。
# 目录由分析器从所用 JDK 的 jmod 模块描述符（JVM 默认引导层：API 根集 + requires 闭包 + uses 绑定）与
# 用户 / 库档案的 META-INF/services 得出，不在此登记类名；入选服务与 provider 导出为 closure.json
# seeds.services（运行期 build.rs 按它装填引导服务目录，见 boundary-narrowing §6.11 项 5 / 决策 4）。
#   lookups     服务查找入口 → 服务 Class 形参序号（不含接收者，0 起）：该实参值集里的类镜像即被查找的服务
#   population  模块服务目录的装填入口：有模块 provider 入选时作根（引导期按事实逐条调用）
[services]
population = [
    "jdk/internal/module/ServicesCatalog.create:()Ljdk/internal/module/ServicesCatalog;",
    "jdk/internal/module/ServicesCatalog.addProvider:(Ljava/lang/Module;Ljava/lang/Class;Ljava/lang/Class;)V",
]
[services.lookups]
"java/util/ServiceLoader.<init>:(Ljava/lang/Class;Ljava/lang/ModuleLayer;Ljava/lang/Class;)V" = 2
"java/util/ServiceLoader.<init>:(Ljava/lang/Class;Ljava/lang/Class;Ljava/lang/ClassLoader;)V" = 1
"java/util/ServiceLoader.<init>:(Ljava/lang/Module;Ljava/lang/Class;Ljava/lang/ClassLoader;)V" = 1

# ── 按名装载的资源束（ResourceBundle.getBundle）────────────────────────────────────────────────
# 束类经 Class.forName + newInstance 反射构造、.properties 束经模块资源查询读入，均无静态调用边。
# 分析器在 lookups 调用点求基名实参（常量 / 构造点键值；推不出时回退到调用链上的束形字面量），按入选 locale
# 的父链（同 [locale] 口径）展开：<基名>[_<后缀>] 为 root 子类且有无参构造器的束类补种，
# <基名>[_<后缀>].properties 存在的嵌入模块资源表（generator/crates/closure/src/engine/bundles.rs）。
#   root     资源束根类（束类候选须是其子类）
#   lookups  按名装载入口 → 基名形参序号（不含接收者，0 起）
[bundles]
root = "java/util/ResourceBundle"
[bundles.lookups]
"java/util/ResourceBundle.getBundle:(Ljava/lang/String;)Ljava/util/ResourceBundle;" = 0
"java/util/ResourceBundle.getBundle:(Ljava/lang/String;Ljava/util/ResourceBundle$Control;)Ljava/util/ResourceBundle;" = 0
"java/util/ResourceBundle.getBundle:(Ljava/lang/String;Ljava/util/Locale;)Ljava/util/ResourceBundle;" = 0
"java/util/ResourceBundle.getBundle:(Ljava/lang/String;Ljava/lang/Module;)Ljava/util/ResourceBundle;" = 0
"java/util/ResourceBundle.getBundle:(Ljava/lang/String;Ljava/util/Locale;Ljava/lang/Module;)Ljava/util/ResourceBundle;" = 0
"java/util/ResourceBundle.getBundle:(Ljava/lang/String;Ljava/util/Locale;Ljava/util/ResourceBundle$Control;)Ljava/util/ResourceBundle;" = 0
"java/util/ResourceBundle.getBundle:(Ljava/lang/String;Ljava/util/Locale;Ljava/lang/ClassLoader;)Ljava/util/ResourceBundle;" = 0
"java/util/ResourceBundle.getBundle:(Ljava/lang/String;Ljava/util/Locale;Ljava/lang/ClassLoader;Ljava/util/ResourceBundle$Control;)Ljava/util/ResourceBundle;" = 0

# ── 按名读取的资源（名字经拼接 / 字段得出）────────────────────────────────────────────────────
# 字面量资源名由生成器按调用链上的 ldc 推导；名字经拼接、字段（如静态字段存拼接结果、另一支取系统属性）得出时
# 无字面量可认。分析器在下列入口的调用点按名求资源名实参（推不出的段记为任意串，只取全部已知的候选），
# 类路径上存在的资源嵌入模块资源表（generator/crates/closure/src/engine/res_lookups.rs）。
# 键为声明处的成员（调用点按解析结果匹配）。
#   arg       资源名形参序号（不含接收者，0 起）
#   relative  相对名按调用点所在类的包解析（Class.resolveName 语义）
[resource_lookups]
"java/lang/Module.getResourceAsStream:(Ljava/lang/String;)Ljava/io/InputStream;" = { arg = 0 }
"java/lang/Class.getResourceAsStream:(Ljava/lang/String;)Ljava/io/InputStream;" = { arg = 0, relative = true }
"java/lang/Class.getResource:(Ljava/lang/String;)Ljava/net/URL;" = { arg = 0, relative = true }
"java/lang/ClassLoader.getResource:(Ljava/lang/String;)Ljava/net/URL;" = { arg = 0 }
"java/lang/ClassLoader.getResourceAsStream:(Ljava/lang/String;)Ljava/io/InputStream;" = { arg = 0 }
"java/lang/ClassLoader.getResources:(Ljava/lang/String;)Ljava/util/Enumeration;" = { arg = 0 }
"java/lang/ClassLoader.getSystemResource:(Ljava/lang/String;)Ljava/net/URL;" = { arg = 0 }
"java/lang/ClassLoader.getSystemResourceAsStream:(Ljava/lang/String;)Ljava/io/InputStream;" = { arg = 0 }
"java/lang/ClassLoader.getSystemResources:(Ljava/lang/String;)Ljava/util/Enumeration;" = { arg = 0 }

# ── VM 引导期类初始化（HotSpot 在执行应用代码前完成初始化的类，initPhase1 等）───────────────
# 生成项目 main 启动时按本表顺序初始化其中「在闭包内翻译在场」的类（runtime vm_boot_init）。
# 准入：JDK 代码显式依赖「该类已在引导期初始化」的时序（惰性初始化下会重入读到未就绪状态）。
[boot_init]
classes = [
    # HotSpot 引导先初始化 System 再调 initPhase1（首步 setJavaLangAccess：SharedSecrets.setJavaLangAccess(new System$2)，
    # JavaLangAccess 无惰性初始化路径，SharedSecrets.getJavaLangAccess 直接返回静态字段，缺席即 null）。
    # 本运行时 initPhase1 的引导段由 System.<clinit> 的 registerNatives 承载（system_impl.rs，首步即 setJavaLangAccess），
    # 故以类初始化入链：经静态方法调用进入会先跑 <clinit>，属性表建立期间初始化的类（ArraysSupport 等）读到未登记的 null。
    "java/lang/System",
    # JDK 注释 "AccessibleObject is initialized early in initPhase1"：<clinit> 登记 ReflectAccess 并
    # 缓存 ReflectionFactory 单例；由 ReflectionFactory.<clinit> 反向触发时 GetReflectionFactoryAction
    # 重入读到 null。
    "java/lang/reflect/AccessibleObject",
]
# VM 启动期调用的静态方法（无参 `()V`，按序在 classes 之前执行）：HotSpot 由 initPhase1 在任何应用代码
# 之前完成的全局登记。准入：VM 发起的启动入口（docs/reference/handwritten-boundary.md 准入 ③）——
# 由闭包分析器作为根入链、生成项目 main 启动时调用（runtime vm_boot_init）。
# （initPhase1 的 setJavaLangAccess 随 System 类初始化执行，见 classes 首项；不再列为独立调用。）
calls = []

# VM 引导阶段（HotSpot call_initPhase2 / call_initPhase3，准入 ③ VM 发起的启动入口）：VM 以常量实参调用的静态方法，
# 按序在 calls / classes 之后、main 之前执行。args：实参常量（个数与描述符一致，只限 Z/B/C/S/I）；分析器以此作入口
# 形参常量，与 VM 调用一致。anchors：阶段写入、此后由 Java 代码读取的 VM 状态字段（`类.字段:描述符`）——闭包内
# 任一锚点有读取点时阶段作根并在启动时执行，否则不入链、不执行。返回整数的阶段非 0 即启动失败（退出码 1）。
[[boot_init.phases]]
# initPhase2：模块系统引导（ModuleBootstrap.boot → 引导层）。实参为 HotSpot 缺省的 DisplayVMOutputToStderr、
# 引导日志开关（均为 false）。锚点暂空：引导层落地（docs/plans/2026-10-02-boot-layer.md 第 2–3 步：Class.module
# 钩子、Module / ModuleLayer 回到字节码）之前不作根；届时填 System.bootLayer 与 Class.module
call = "java/lang/System.initPhase2:(ZZ)I"
args = [false, false]
anchors = []

# ── 模块资源（jmod 内的非类数据文件）不在此登记：生成器由调用链上方法体的 ldc 资源名推导
# （`generator/crates/input/src/resources.rs`），并入 [bundles] 求得的属性文件资源束与 [resource_lookups] 按名求出的资源，以 include_bytes! 嵌入，
# 运行时由 ClassLoader 的资源查询承载。
