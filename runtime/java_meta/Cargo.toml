[package]
name = "java_meta"
version = "0.1.0"
edition = "2021"
# 档案侧反射元数据表 crate：表源码由发射层渲染进 scratch 的 closure_input/（rava_meta_tables），本 crate 只承载数据

[lib]
name = "java_meta"
path = "src/lib.rs"

[dependencies]
# 表是字节流，不取 java_runtime 的类型；依赖保留以固定链接序（java_runtime 不反向依赖本 crate，以导出符号读取表）
java_runtime = { path = "../java_runtime" }

[lints.rust]
non_upper_case_globals = "allow"
