# 已知失败清单（抽查 / 合入守护判定用）
#
# 用途：scripts/cluster/merge_daemon.py 与 scripts/cluster/known_failures.py 读取本文件，
# 判定抽查（spot）里的失败是否「已知」。失败用例的本地失败日志（cluster_results/spot/<tag>/error_logs/
# <测试>_<服务器>_jdk<N>.log）包含某条同名条目的 signature 子串，才算已知；同名用例签名不符算新失败。
# OOM / 超时 / 无结果 / infra 失败一律不算已知（日志里不会出现这些签名）。
#
# 条目字段：
#   test       测试类名（与 tests/e2e 下文件名一致，不带 .java）
#   signature  失败签名：错误摘要中的稳定子串（stub 消息、panic 消息、diff 行等；不含行号 / 耗时 / 进程号）
#   owner      负责分支 / 任务
#   since      登记日期（YYYY-MM-DD）
#   note       说明（可选）
#   deferred   暂缓阶段（可选，见 docs/plans/2026-10-07-framework-driven-api-coverage.md）：S1 / S2 / … = 到该阶段框架
#              纳入 API 面时恢复；面外 = 目前已知框架都不用。暂缓条目不排修、不阻塞合入，只在全量轮次跑
#   deferred_reason  暂缓依据（10-07 首批为人工判断，S0 API 面算出后按数据复核）
#
# 维护：修复合入后删除对应条目（与修复同一提交或紧随其后）；新增条目须写明负责分支。
# 同一测试可有多条（不同签名），任一命中即为已知。

