<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>rava 项目进展全景</title>
<link rel="stylesheet" href="styles.css">
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/dagre@0.8.5/dist/dagre.min.js"></script>
</head>
<body>
<header>
  <h1>rava 项目进展全景</h1>
  <span class="ts"></span>
  <div class="stats" id="stats"></div>
</header>
<div class="ctrl">
  <span style="color:var(--txt-dim);font-size:12px">筛选：</span><span id="filters" style="display:flex;gap:6px;flex-wrap:wrap"></span>
  <span class="sep">|</span>
  <button id="btnFold" class="on" title="收起已完成的工作节点（里程碑/上下文保留，其余按泳道汇总）">折叠已完成</button>
  <button id="btnCritical">关键路径</button>
  <button id="btnView">甘特视图</button>
  <span class="sep">|</span>
  <button id="btnZoomIn" class="icon" title="放大">＋</button>
  <button id="btnZoomOut" class="icon" title="缩小">－</button>
  <button id="btnFit" title="缩放适配">适应</button>
  <button id="btnFull" title="全屏切换">⛶ 全屏</button>
  <span style="color:var(--txt-dim);font-size:11px;margin-left:auto">滚轮缩放 · 拖拽平移 · 悬停看链路 · 点击看详情 · <span id="fsHint">若内嵌预览中全屏不可用，请用浏览器直接打开本文件</span></span>
</div>
<div id="pipe"></div>
<div id="main">
  <div id="graphWrap"><svg id="graph"></svg></div>
  <div id="gantt"></div>
  <div id="detail"><div class="placeholder">点击节点查看详情</div></div>
</div>
<div id="blockers"></div>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
