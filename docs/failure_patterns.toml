# ── 转译期 ──────────────────────────────────────────────────────────────────────

[[pattern]]
id = "transpile-stack-overflow"
stage = "transpile"
symptom = "转译数秒内栈溢出（fatal runtime error: stack overflow）"
match = [["has overflowed its stack"], ["stack overflow, aborting"]]
tests = ["TestDomResultNode", "TestResourceBundleFaces"]
cause = "闭包分析的常量实参求值（consteval.rs）穿过静态分派转发方法（转发构造完成标签对象）不计深度；ResourceBundle.findBundle 是自递归的转发方法，环上整数实参逐层变化使每层求值键都不同，memo_enter 同键截断拦不住，const_eval → aux_analyze → invoke_result → const_eval 嵌套约 1200 层撑爆主线程 8 MB 栈。两例同源（TestResourceBundleFaces 在 main 589052eb 上同样溢出，fix-domstack 上两例都通过），非 batch-1010d 引入"
introduced = "ef6a1249（常量实参求值穿过分派转发方法不计深度）"
fixed = ["b4da5107"]
status = "pending"
owner = "fix-domstack"
diagnose = "dev 上 gdb -batch -ex run -ex 'bt 80' -ex 'bt -60' --args rava build <Test.java> --stop-after emit 取栈（栈溢出时 RUST_BACKTRACE 无输出）；看重复的帧环属哪个求值器，在其 memo_enter 处按嵌套层数打印求值键，看键是否逐层变化"
doc = "docs/tasks.md 现状节 fix-domstack 条"
since = "2026-10-10"

[[pattern]]
id = "xsltc-translet-create"
stage = "run"
symptom = "XSLT 变换运行期 TransformerConfigurationException：Translet class loaded, but unable to create translet"
match = [["Translet class loaded, but unable to c"]]
tests = ["TestXmlTransform"]
cause = "运行期定义类在 rava 中没有终态承载：TemplatesImpl.defineTransletClasses 经 TransletClassLoader.defineClass 调 ClassLoader.defineClass1（native 手写），该手写对格式合法的类文件一律抛 LinkageError（原生二进制类全集构建期定死），defineTransletClasses 的 catch (LinkageError) 包成 TRANSLET_OBJECT_ERR。不是生成器 / 闭包 / 反射缺陷。fix-domstack 修好转译超时后首次暴露。终态方案：按内容寻址的预定义类（X1 = S2 训练运行，语料构建 rava build 按需自动训练，生产构建显式 rava trace），fix-xsltc2 实施，见 doc"
introduced = ""
fixed = ["fix-xsltc2 cd818df0"]
status = "pending"
owner = "fix-xsltc"
diagnose = "run.log 不打印 Caused by（TransformerException 的 cause 存在 containedException、经 getCause() 覆盖给出，fix-xsltc2 起未捕获报告经虚调 getCause() 取链）；用探针捕获异常后按 getCause() 打印链（作业 xsltc-probe2）。cause 为 LinkageError「runtime class definition is not supported」即本条"
doc = "docs/plans/2026-10-10-xsltc-translet.md"
since = "2026-10-10"

[[pattern]]
id = "transpile-time-regression-chm"
stage = "transpile"
symptom = "转译耗时成倍增长，缺省时限下转译超时（放宽时限可通过）"
match = [["transpile timeout"]]
tests = ["DeepCopy", "TestSerialDefaultSuid", "TestSerialUserGenericCallbacks", "TestJndiNoProvider"]
cause = "SerialCallbackContext.obj 不是容器形态、按类共用 F/U：序列化写方整张对象图（约 1.2 万值）流到反序列化 defaultReadObject 的 curContext.getObj()，FieldReflector.getObjFieldValues / setObjFieldValues 按未知偏移整堆读写，CHM.table / CollectionView.map 等对象字段互灌（逃逸 CHM 1 → 28），F(table)↔U(table) 往返成 N² 合并（batch-1012 → 1013：DeepCopy 527 → 912 s，JNDI 324 → 1006 s）。修复：final Object 型实例字段由构造器从实参写入的「值持有者」按分配点 × 堆上下文分对象（纯字节码形态，无类名）"
introduced = "8ce97959（serialPersistentFields 使精确 readObject / writeObject 派发可达，暴露值持有者按类共用的潜伏缺陷）"
fixed = ["cf58a73f", "c3ec480d"]
status = "pending"
owner = "perf-regress4"
diagnose = "放宽时限重跑确认是慢而非死循环；对照 timings_jdk21.tsv 各批次转译秒数；--flows @openstat / @escin:<类> 看 open 接收者与逃逸对象的引入点，@path 追值来源字段（perf-regress4 实测：DeepCopy 527 → 306 s、峰值 5983 → 4104 MB，JNDI 606 → 348 s）"
doc = "docs/plans/2026-10-09-transpile-time-regression.md"
since = "2026-10-10"

