# 失败原因库（只增不删）
#
# 用途：记录 e2e / 单测失败的「症状 → 根因 → 修复」历史，供分诊复用。与 docs/known_failures.toml 的分工：
#   known_failures.toml   当前未修的失败，判定抽查失败是否「已知」（修复后删除条目）；
#   failure_patterns.toml 历史上出现过的失败原因，修复后保留，只更新 status / fixed。
# scripts/cluster/known_failures.py 对新失败按本文件匹配，输出「疑似历史原因」提示；提示不改变已知 / 新失败判定。
#
# 条目字段：
#   id          唯一短名（kebab-case）
#   stage       失败阶段：transpile / compile / run / output / unit / resource
#   symptom     症状一句话
#   match       匹配规则：数组的数组；任一组内全部子串都出现在失败日志中即命中（组内 AND、组间 OR）。
#               匹配前剔除 dyn-compare 的 `[no-provenance]` 行（静态钉入、无来源记录的 VM 异常类清单，
#               几乎每个测试都有，不代表运行期抛出，不能作为症状）。match 为空的条目不参与自动匹配（如单测类）
#   tests       出现过该原因的用例（命中本列表的用例在提示中排前）
#   cause       根因（一两句；长篇分析放 doc 指向的文档）
#   introduced  引入提交（未知留空；潜伏缺陷写暴露它的提交并在 cause 里说明）
#   fixed       修复提交（可多个）
#   status      fixed / open / pending（修复已提交、待放行验证）
#   owner       负责分支 / 任务（status 非 fixed 时必填）
#   diagnose    定位方法（下次同症状从哪里查起）
#   doc         详细分析所在文档与章节
#   since       首次登记日期
#
# 维护：每个修复代理交付时新增或更新条目（同一修复合入同一提交）；协调攒批时检查，缺登记的退回补登。
# 同症状可有多条不同原因，逐条并列；新原因不要改写旧条目的 cause。

# ── 运行期：常量折叠错误 ────────────────────────────────────────────────────────

[[pattern]]
id = "offset-field-folded"
stage = "run"
symptom = "只经 Unsafe 按偏移写的字段被折叠成初值：CAS 无限重试（运行超时）、读到 null（NPE）、计数恒为 0"
match = [["Exception in thread \"main\" java.lang.NullPointerException"], ["run timeout"]]
tests = ["ReflectionAPI", "TestAnnoReflect", "TestAnnoDeepAccess", "TestAnnoArrayMembers", "TestAnnoNestedArray",
         "TestAnnoValues", "TestBeansIndexedProps", "TestBeansIntrospector", "TestCallerSensitiveHandle", "TestJucSync",
         "AmicablePairs", "RamanujanPrimes", "SelfReferentialSequence", "TestParallelArrayCas", "TestCommonPool",
         "TestRandomFactoryAll", "TestProcessBuilder"]
cause = "字段只经 Unsafe CAS 写（只进流图、不进常量格），偏移在构建期初始化的 <clinit> 里按名取得；消费符号偏移处未放开字段，getfield 被折叠成初值。Class.reflectionData / Class.annotationType 为 lc3-fix 所修；AtomicInteger.value 类（JucSync 等）为 fix-clone 所修。并行流 / ForkJoinPool 类（AmicablePairs、RamanujanPrimes、SelfReferentialSequence、TestParallelArrayCas、TestCommonPool，C4 全量 c249cdec 上运行超 900 s）同属此类，lc3-fix 即修复（c4-runtimeout 分诊）。TestRandomFactoryAll（NPE）、TestProcessBuilder（运行超时）在 C4 全量 c249cdec 上失败，5177e182（含 4c42ac44）抽查即通过（fixclone-attr5177），并入本条。fix-clone 的终态修法：符号偏移的唯一产生处 facts/fields.rs::field_offset 登记所指字段，工作循环排空时 open_field 并使读者失效——不论偏移在哪条路径（aux 求值的 <clinit>、手写层、站点求值）被产生，字段都不再折叠"
introduced = "78b744fe（reflect-marker：边界类字段改为手写层提及才开放，暴露潜伏缺陷）"
fixed = ["4c42ac44", "5177e182"]
status = "fixed"
owner = "fix-clone"
diagnose = "二分到暴露提交；查失败点读取的字段是否只经 Unsafe 写、偏移是否在构建期 <clinit> 按名取得；hw_offset.rs::site_offset 是否对该偏移 open_field。先确认失败提交是否已含 4c42ac44 / 5177e182：不含时直接在集成分支头抽查（c4-runtimeout 即如此结案）"
doc = "docs/tasks.md 现状节 lc3-fix / 注解反射 NPE 回归"
since = "2026-10-10"

[[pattern]]
id = "concrete-ctx-image-static-dead"
stage = "run"
symptom = "只经具体求值上下文（via kind = concrete）到达的方法运行期读构建期初始化类的静态表得 null：NPE（如 printf 宽度解析 Character.digit → CharacterDataLatin1.digit）"
