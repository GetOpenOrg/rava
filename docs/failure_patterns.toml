cause = "测试打印两个 new Object() 的身份哈希（JUnit assertSame 失败消息含 String.valueOf(obj)）。HotSpot 身份哈希取线程内 xorshift 序列，同一 JVM 逐次确定，故期望双跑确定性闸门通过；原生二进制按地址取哈希，逐次不同。无法也不应复现 HotSpot 哈希序列（取决于 JVM 内部此前的哈希请求次数）。违反 e2e 方法论 §五「不打印 identityHash」，属测试确定性缺陷，非生成器问题。修法（10-10 用户批准改测试源：测试本身不合规，不属「合法测试不改」）：被比较对象改为定值 toString、按身份比较的 Token 类型，断言语义不变；期望经 JDK 21 重生成并双跑一致"
introduced = "d4efc8d6（63_junit expected 补齐）"
fixed = ["junit-j3j4 本条目所在提交"]
status = "fixed"
owner = "junit-j3j4"
diagnose = "diff 只有 Object@ 哈希行时即本条；对照 docs/reference/e2e-coverage-methodology.md §五"
doc = "docs/plans/2026-10-05-junit-e2e-deps-task.md §七 第 15 条"
