cause = "地区补种漏掉别名常量：seeds/locale.rs 的常量溯源器只认 `<clinit>` 里「字面量实参 invokestatic → putstatic」，而 Locale.<clinit> 的 CHINA / PRC / TAIWAN 以 `getstatic SIMPLIFIED_CHINESE / TRADITIONAL_CHINESE; putstatic` 赋值，用户 `getstatic Locale.CHINA` 溯不出 zh_CN，jdk.localedata 的 zh 资源束类（CurrencyNames_zh、FormatData_zh、cldr/ext 下 zh 族等）不进闭包，运行期 zh 回落 root（CN¥ / 英文日期文本）。非 expected 基线问题（同 JDK 下 ¥ 正确）；10-06 的 NPE 签名已随其他修复消失。修法：value_before 对同类型静态常量别名溯源所指常量；中文候选链按 ResourceBundle.Control 口径补文字 / 地区（zh_TW → zh_Hant_TW / zh_Hant）"
introduced = "地区补种（seeds.toml [locale]）引入起即存在"
fixed = ["222fd151"]
status = "fixed"
owner = "fix-clone"
diagnose = "对照用户直接写 `new Locale(\"zh\",\"CN\")` 的探针与写 `Locale.CHINA` 的用例，比较 scratch 中 jdk_localedata 的 zh 资源束类清单；缺即补种溯源缺口"
doc = ""
since = "2026-10-10"

