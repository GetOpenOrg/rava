[[pattern]]
id = "parallel-capable-unregistered"
stage = "output"
symptom = "ClassLoader.registerAsParallelCapable / isRegisteredAsParallelCapable 恒为 false"
match = [["+Capable register = false"]]
tests = ["TestParallelCapable"]
cause = "非 offset-field-folded 同类。引导映像保留构建期身份哈希（计划 2026-10-05-boot-image-evaluator §5.5.2 D3），但类镜像是运行期对象（映像经 rt::mirror 链接）：求值器给镜像按首次查询编号取哈希（0x1000+n*7919），运行期镜像按地址取哈希，两侧不等。映像中以镜像为键、按哈希分桶的表（ClassLoader$ParallelLoaders.loaderTypes 的 WeakHashMap，Reflection.fieldFilterMap / methodFilterMap 等）运行期查不到构建期放入的键，registerAsParallelCapable 的超类检查失败、isRegisteredAsParallelCapable 恒 false。修法：镜像身份哈希两侧取同一确定函数（\"m:\" + 类型键的 FNV-1a）：求值器 identity_hash 对镜像优先取之，运行期 for_class / getPrimitiveClass 建镜像时登记，Object.hashCode / System.identityHashCode / super.hashCode 对类对象经 __object_identity_hash 取登记值"
introduced = "boot image 引入时（类镜像经 rt::mirror 链接、哈希未随映像）"
fixed = ["96143cf3"]
status = "fixed"
owner = "fix-clone"
diagnose = "boot_image.rs 中找 __set_key / __set_referent(From::from(rt::mirror(..))) 的映像 Node / Entry：其 hash 字段为构建期值，对照运行期 Class 对象的 identityHashCode 是否同值（concrete/ext_init.rs::identity_hash 与 class_impl.rs::mirror_identity_hash 须逐位一致，两侧单测以 \"m:a/B\" → 210234197 守护）"
doc = ""
since = "2026-10-10"

