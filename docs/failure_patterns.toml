cause = "测试打印两个 new Object() 的身份哈希（JUnit assertSame 失败消息含 String.valueOf(obj)）。HotSpot 身份哈希取线程内 xorshift 序列，同一 JVM 逐次确定，故期望双跑确定性闸门通过；原生二进制按地址取哈希，逐次不同。无法也不应复现 HotSpot 哈希序列（取决于 JVM 内部此前的哈希请求次数）。违反 e2e 方法论 §五「不打印 identityHash」，属测试确定性缺陷，非生成器问题。修法（10-10 用户批准改测试源：测试本身不合规，不属「合法测试不改」）：被比较对象改为定值 toString、按身份比较的 Token 类型，断言语义不变；期望经 JDK 21 重生成并双跑一致"
introduced = "d4efc8d6（63_junit expected 补齐）"
fixed = ["junit-j3j4 本条目所在提交"]
status = "fixed"
owner = "junit-j3j4"
diagnose = "diff 只有 Object@ 哈希行时即本条；对照 docs/reference/e2e-coverage-methodology.md §五"
doc = "docs/plans/2026-10-05-junit-e2e-deps-task.md §七 第 15 条"
since = "2026-10-10"

[[pattern]]
id = "dyncmp-build-time-clinit"
stage = "transpile"
symptom = "动态对照报 [miss]，负责帧是某个 JDK 类的 <clinit>（如 StreamOpFlag.<clinit> → StreamOpFlag$Type / $MaskBuilder / EnumMap / EnumMap$1，VarHandle.<clinit> → VarHandleGuards），但用例逐字通过、运行期不命中存根"
match = [["[miss]", ".<clinit>:()V@"]]
tests = ["TestJunitFailureMessages"]
cause = "对照口径问题，非闭包缺口。帧所属类在 closure.json boot_image_data.build_time（引导映像或构建期初始化扩展 c:<类> 组），其 <clinit> 由构建期求值器执行、结果物化进映像，发射为 #[boot_initialized = true]，原生程序运行期不执行；JVM 基准则在程序期首次使用时才执行它，期间加载的辅助类被当作漏覆盖。dev 实测（dyncmp-fact3）5 个类本身亦在 build_time、不在闭包，映像活对象不含其实例。修法：dyn_compare 栈上遇构建期初始化类的 <clinit> 即归 build-time-init（先于帧已建模判定），数据取 closure.json，无类名特判。局限：只记首次加载，类若在构建期 <clinit> 与运行期路径都需要，后者由 --methods 方法粒度对照兜底。验收（dev）：抽查 dyncmp-abdaf4ca 18 例（63_junit 10 + HelloWorld + DeepCopy + 6 例 stream / VarHandle）全过；作业 dyncmp-dyn18 同 18 例动态对照漏覆盖 0、未归因 0，归 build-time-init 共 78 处"
introduced = "构建期初始化（C3 build_time_init，boot-image-s6）后潜伏，J4（junit-j3j4）首次暴露"
fixed = ["abdaf4ca"]
status = "pending"
owner = "dyncmp-bootinit"
diagnose = "看 [miss] 的负责帧是否为 X.<clinit>，再查 closure_input/closure.json 的 boot_image_data.build_time 是否含 X、生成的 X 类头是否有 #[boot_initialized = true]；含即本条，不含则是真实漏覆盖"
doc = "docs/tasks.md 现状节「框架推进顺序」条"
since = "2026-10-10"

