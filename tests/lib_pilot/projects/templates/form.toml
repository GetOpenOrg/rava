# 模板引擎三件（Thymeleaf / FreeMarker / Velocity）
# 双版本模块锁（deps-extra/thymeleaf）：thymeleaf 3.1.3 托管 ognl 3.3.4（thymeleaf-parent 属性），
# 主模块锁钉 ognl 3.4.14（三个单文件 pilot golden 已按其存档，不可降级）——OgnlContext 构造器
# 签名失配，方案 A 并存，见 projects/README.md。模块须自持本项目全部 cp 条目（含 FreeMarker /
# Velocity，与主模块同版钉值）。
deps  = "tests/lib_pilot/deps-extra/thymeleaf/target/deps.lock.toml"
cp    = ["thymeleaf", "freemarker", "velocity-engine-core", "commons-lang3", "slf4j-api",
        "ognl", "attoparser", "unbescape", "javassist"]
fetch = "scripts/fetch_pilot_deps.sh --no-scan"
