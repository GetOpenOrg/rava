# 闭包构成分析：类 → 机制归类规则（scripts/closure_composition.py 读取；脚本里不写 JDK 类名特判）
#
# 匹配：每个类取全部条目中「最长匹配」的那条，同长取先声明者。条目三种写法：
#   "a/b/"   包前缀（含子包）
#   "a/b/C"  精确类及其嵌套类（C 或 C$…）
#   "a/b/C*" 原样前缀（a/b/C 开头的任何类名）
# kind：
#   mechanism  机制块：参与入链归属（via 链上第一个落入机制块的节点决定该类的「入口机制」）
#   base       基础库（lang 核心 / 集合 / 基础 IO 等）：只按自身包计数，不作为入链归属
#   user       用户 / 第三方类（闭包 domain 为 user / lib 时归此，不看包名）
# 未命中任何条目的 JDK 类归 base 的 "other"。
# 口径：docs/reports/2026-10-07-closure-composition.md

[[category]]
id = "user"
title = "用户 / 第三方"
kind = "user"
prefixes = []

[[category]]
id = "logging"
title = "日志（JUL / System.Logger）"
kind = "mechanism"
prefixes = [
  "java/util/logging/", "sun/util/logging/", "jdk/internal/logger/", "jdk/internal/event/",
  "java/lang/System$Logger", "java/lang/System$LoggerFinder", "java/lang/System$Logger$Level",
  "jdk/internal/util/Exceptions*", "jdk/jfr/",
]

[[category]]
id = "signal"
