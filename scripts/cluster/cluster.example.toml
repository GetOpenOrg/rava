# rava 集群测试服务器清单示例：复制到 ~/.config/rava/cluster.toml（或 RAVA_CLUSTER_CONFIG 指定的路径）后按本机填写。
# 各键含义见 cluster_config.py「服务器列表」注释。

# 服务器检出用的仓库地址（内部仓库；首次初始化时 git clone）
repo_url = "git@git.example.internal:team/rava.git"

# 可选：SSH 主机密钥文件（缺省 ~/.config/rava/known_hosts；环境变量 RAVA_KNOWN_HOSTS 覆盖）。
# 建连先读系统 ~/.ssh/known_hosts 再读此文件，未登记的主机拒绝连接（RejectPolicy）。
# 首次接入新服务器：python scripts/cluster/ssh_client.py trust <标签...>，或分发时加 --trust-new-host（TOFU）
# known_hosts = "~/.config/rava/known_hosts"

# 可选：直连失败时的降级 SOCKS5 代理；只直连的服务器（direct_only）不用
# fallback_proxy = { host = "127.0.0.1", port = 10808 }

# 作业服务器（gate 单元测试等）
[[servers]]
label = "job1"
host = "192.0.2.11"
username = "rava"
private_key_path = "~/.ssh/id_ed25519"
remote_dir = "/srv/rava/rava"
refjdk_root = "/srv/rava/rava-jdk"
skip_setup = true
direct_only = true
pools = ["job"]

# 测试服务器（全量 / 抽查），多槽并行
[[servers]]
label = "test1"
host = "192.0.2.17"
username = "rava"
private_key_path = "~/.ssh/id_ed25519"
skip_setup = true
direct_only = true
slots = 16
pools = ["test"]
